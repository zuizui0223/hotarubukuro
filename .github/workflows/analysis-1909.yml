name: 1909 analysis pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "reproducibility/submission_reference/**"
      - "manuscript/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_figures:
        description: Build manuscript figures from the fresh run
        type: boolean
        required: false
        default: true
      submission_draws:
        description: Natural maps for the cross-fitted isolate reference
        type: number
        required: false
        default: 10000
      joint_latent_draws:
        description: Joint posterior draws for the isolate coherence sensitivity
        type: number
        required: false
        default: 10000
      joint_observation_replicates:
        description: Observation replicates per joint posterior draw
        type: number
        required: false
        default: 20
  pull_request:
    types: [labeled]
    branches: ["main"]

permissions:
  contents: read

# A new canonical request on the same ref supersedes an older one. This avoids
# spending hours finishing a run from stale analysis code after the PR head has
# changed; the retained run is always tied to one explicit head SHA.
concurrency:
  group: analysis-1909-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Reproduce the 1,909 analysis
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.label.name == 'run-canonical-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REPORT_DIR: ${{ github.workspace }}/reproducibility
      STATUS_DIR: ${{ github.workspace }}/reproduction_status
      SNAPSHOT_DIR: ${{ github.workspace }}/reproduction_inputs/snapshot
      BUILD_FIGURES: ${{ inputs.build_figures || 'true' }}
      RUN_TESTS: "true"
      HOTARUBUKURO_SUBMISSION_DRAWS: ${{ inputs.submission_draws || '10000' }}
      HOTARUBUKURO_JOINT_LATENT_DRAWS: ${{ inputs.joint_latent_draws || '10000' }}
      HOTARUBUKURO_JOINT_OBS_REPS: ${{ inputs.joint_observation_replicates || '20' }}

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned R version
        id: pinned-r
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import yaml
          with open('dependencies/r-environment.yml', encoding='utf-8') as handle:
              data = yaml.safe_load(handle)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"r-version={data['r_version']}\n")
          PY

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.pinned-r.outputs.r-version }}
          use-public-rspm: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install declared system libraries
        shell: bash
        run: bash dependencies/install_system_dependencies.sh

      - name: Restore the R library cache
        uses: actions/cache@v4
        with:
          path: .r-lib
          key: analysis-r-${{ runner.os }}-${{ hashFiles('dependencies/r-environment.yml', 'dependencies/r-packages.csv', 'dependencies/install_r_packages.R', 'dependencies/install_inla.R') }}
          restore-keys: |
            analysis-r-${{ runner.os }}-

      - name: Restore the declared R environment
        shell: bash
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript scripts/setup_r_environment.R \
            --report-dir reproducibility \
            --scopes analysis,reproducibility,testing,figures,reporting

      - name: Run the complete 1,909 pipeline
        shell: bash
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: bash scripts/run_analysis_1909.sh

      - name: Run the joint spatial posterior-predictive isolate sensitivity
        shell: bash
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          Rscript scripts/run_joint_submission_isolate_ppc.R \
            --output results/ecological_v26_joint_submission_isolate_ppc \
            --latent-draws "$HOTARUBUKURO_JOINT_LATENT_DRAWS" \
            --obs-reps "$HOTARUBUKURO_JOINT_OBS_REPS" \
            --seed 20260725

      - name: Validate the joint isolate sensitivity
        shell: bash
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          Rscript validation/validate_joint_submission_isolate_ppc.R \
            --output results/ecological_v26_joint_submission_isolate_ppc

      - name: Write the submission inference lock
        shell: bash
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          Rscript scripts/write_submission_analysis_lock.R \
            --output results/submission_analysis_lock

      - name: Validate the submission inference lock
        shell: bash
        env:
          R_LIBS_USER: ${{ github.workspace }}/.r-lib
        run: |
          Rscript validation/validate_submission_analysis_lock.R \
            --output results/submission_analysis_lock

      - name: Publish the summary
        shell: bash
        run: |
          cat reproducibility/reproduction_summary.md >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          cat results/submission_analysis_lock/README.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the complete run
        uses: actions/upload-artifact@v4
        with:
          name: analysis-1909-${{ github.sha }}-${{ github.run_id }}
          path: |
            results
            reproducibility
            reproduction_status
            manuscript/figures
          if-no-files-found: error
          retention-days: 90
