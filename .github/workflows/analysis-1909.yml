name: 1909 analysis pipeline

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "reproducibility/submission_reference/**"
      - "manuscript/**"
      - "docs/**"
  workflow_dispatch:
    inputs:
      build_figures:
        description: Build manuscript figures from the fresh run
        type: boolean
        required: false
        default: true
      submission_draws:
        description: Natural maps for the cross-fitted isolate reference
        type: number
        required: false
        default: 10000
      joint_latent_draws:
        description: Joint posterior draws for the isolate coherence sensitivity
        type: number
        required: false
        default: 10000
      joint_observation_replicates:
        description: Observation replicates per joint posterior draw
        type: number
        required: false
        default: 20
  pull_request:
    types: [labeled]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: analysis-1909-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Reproduce the 1,909 analysis
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.label.name == 'run-canonical-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      REPORT_DIR: ${{ github.workspace }}/reproducibility
      STATUS_DIR: ${{ github.workspace }}/reproduction_status
      SNAPSHOT_DIR: ${{ github.workspace }}/reproduction_inputs/snapshot
      BUILD_FIGURES: ${{ inputs.build_figures || 'true' }}
      RUN_TESTS: "true"
      HOTARUBUKURO_SUBMISSION_DRAWS: ${{ inputs.submission_draws || '10000' }}
      HOTARUBUKURO_JOINT_LATENT_DRAWS: ${{ inputs.joint_latent_draws || '10000' }}
      HOTARUBUKURO_JOINT_OBS_REPS: ${{ inputs.joint_observation_replicates || '20' }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      INLA_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore the R library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore the declared R environment
        run: Rscript scripts/setup_r_environment.R --report-dir "$REPORT_DIR" --scopes analysis,reproducibility,testing,figures,reporting

      - name: Run the complete 1,909 pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/run_analysis_1909.sh

      - name: Run the joint spatial posterior-predictive isolate sensitivity
        run: |
          Rscript scripts/run_joint_submission_isolate_ppc.R \
            --latent-draws "$HOTARUBUKURO_JOINT_LATENT_DRAWS" \
            --observation-replicates "$HOTARUBUKURO_JOINT_OBS_REPS"

      - name: Validate the joint isolate sensitivity
        run: Rscript validation/validate_joint_submission_isolate_ppc.R

      - name: Write the submission inference lock
        run: Rscript scripts/write_submission_analysis_lock.R

      - name: Validate the submission inference lock
        run: Rscript validation/validate_submission_analysis_lock.R

      - name: Publish the summary
        if: always()
        shell: bash
        run: |
          if [[ -s reproducibility/reproduction_summary.md ]]; then
            cat reproducibility/reproduction_summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s reproducibility/analysis_population_check.csv ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat reproducibility/analysis_population_check.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s results/ecological_v26_joint_submission_isolate_ppc/joint_isolate_natural_null_summary.csv ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo '### Joint posterior-predictive isolate sensitivity' >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat results/ecological_v26_joint_submission_isolate_ppc/joint_isolate_natural_null_summary.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -s results/submission_analysis_lock/SUBMISSION_CLAIM.md ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat results/submission_analysis_lock/SUBMISSION_CLAIM.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the complete run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-1909-${{ github.sha }}-${{ github.run_id }}
          path: |
            results
            reproducibility
            reproduction_status
            manuscript/figures
          if-no-files-found: warn
          retention-days: 90
