name: submission-analysis-contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      raw_zenodo_reproduction:
        description: "Rebuild from the image-bearing Zenodo workbook and run all retained analyses"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test surface
        run: python -m pip install -e '.[test]'

      - name: Validate canonical command graph and Python contracts
        run: |
          python -m py_compile \
            run_pipeline.py \
            source_build/source_contract.py \
            source_build/extract_color.py \
            source_build/build_data_s1.py \
            source_build/reproduce_from_zenodo.py
          python source_build/reproduce_from_zenodo.py --dry-run --run-analysis --skip-analysis-setup
          python run_pipeline.py audit --structure-only
          python run_pipeline.py reproduce --dry-run --skip-setup
          pytest

      - name: Reject removed and alternative analysis surfaces
        shell: bash
        run: |
          for path in \
            Data_S1.csv \
            Code_S1.py \
            legacy \
            inputs \
            validation \
            hotarubukuro_analysis \
            analysis_sensitivity \
            config/color_extraction.json \
            source_build/audit_bombus_extraction.R \
            source_build/canonicalize_bombus_occurrences.R \
            scripts/run_multiscale_hotspots.R \
            scripts/run_human_landscape_features.R \
            scripts/run_local_human_context.R \
            scripts/run_did_sensitivity.R \
            scripts/fit_broad_spatial_inertia_environment_tracking.R; do
            test ! -e "$path"
          done
          ! grep -R "Data_S1.csv" run_pipeline.py source_build scripts R pyproject.toml

  r-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: r-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r-version.outputs.version }}
          use-public-rspm: true

      - name: Parse the complete retained R surface
        shell: bash
        run: |
          Rscript - <<'RS'
          files <- c(
            "R/pipeline_support.R",
            "R/reproducibility.R",
            "R/raster_sources.R",
            "R/environment_spatial.R",
            "R/natural_biotic_covariates.R",
            "R/phenotype_hurdle.R",
            "R/analysis_cells.R",
            "R/natural_predictive_model.R",
            "R/continuous_colour_isolation.R",
            "R/local_pair_graph.R",
            "R/human_raster_features.R",
            "source_build/download_rasters.R",
            "source_build/prepare_rasters.R",
            "source_build/fetch_bombus_occurrences.R",
            "source_build/build_bombus_sdm_mainland.R",
            "source_build/build_human_raster.R",
            "scripts/setup_r_environment.R",
            "scripts/build_environment_input.R",
            "scripts/run_environment_spatial.R",
            "scripts/run_natural_biotic_covariates.R",
            "scripts/run_phenotype_hurdle.R",
            "scripts/build_analysis_cells.R",
            "scripts/build_bombus_occurrence_reference_support.R",
            "scripts/run_bombus_local_sharp_transition.R",
            "scripts/run_bombus_spatial_replication_test.R",
            "scripts/build_broad_landscape_context.R",
            "scripts/run_broad_environment_spatial_audit.R",
            "scripts/build_fixed_space_null_cache.R",
            "scripts/fit_broad_supported_term_distance_space_null.R",
            "scripts/fit_final8_presence_null.R",
            "scripts/run_continuous_colour_isolation.R"
          )
          stopifnot(all(file.exists(files)))
          invisible(lapply(files, parse))
          cat("PASS complete retained R surface parse\n")
          RS

      - name: Run retained R unit tests
        shell: bash
        run: |
          Rscript -e 'install.packages(c("testthat", "FNN"), repos = getOption("repos"))'
          Rscript tests/testthat.R

  raw-zenodo-reproduction:
    # PR #70 runs a one-time raw-source proof while the source contract is finalized.
    if: (github.event_name == 'pull_request' && github.event.pull_request.number == 70) || (github.event_name == 'workflow_dispatch' && inputs.raw_zenodo_reproduction)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python package
        run: python -m pip install -e '.[test]'

      - name: Rebuild candidate canonical table from Zenodo
        run: python source_build/reproduce_from_zenodo.py

      - name: Show raw-source audit
        if: always()
        shell: bash
        run: |
          if [ -f results/source_reconstruction/zenodo_rebuild_audit.json ]; then
            cat results/source_reconstruction/zenodo_rebuild_audit.json
          fi

      - name: Diagnose stable content against historical Data_S1
        if: always()
        shell: bash
        run: |
          test -f results/source_reconstruction/Data_S1_from_zenodo.csv
          git fetch origin 8299c25155bb07f0acb93968a28657a5e7fe4ec2 --depth=1
          git show FETCH_HEAD:Data_S1.csv > /tmp/historical_Data_S1.csv
          python - <<'PY'
          import csv
          import hashlib
          import io
          import json
          from collections import Counter
          from pathlib import Path

          volatile = {"processed_at"}
          historical_path = Path("/tmp/historical_Data_S1.csv")
          rebuilt_path = Path("results/source_reconstruction/Data_S1_from_zenodo.csv")

          def read(path):
              with path.open("r", encoding="utf-8-sig", newline="") as handle:
                  reader = csv.DictReader(handle)
                  return list(reader.fieldnames or []), list(reader)

          historical_header, historical = read(historical_path)
          rebuilt_header, rebuilt = read(rebuilt_path)
          historical_columns = set(historical_header) - volatile
          rebuilt_columns = set(rebuilt_header) - volatile
          only_historical = sorted(historical_columns - rebuilt_columns)
          only_rebuilt = sorted(rebuilt_columns - historical_columns)
          common = sorted(historical_columns & rebuilt_columns)
          if "observation_id" in common:
              common.remove("observation_id")
              common.insert(0, "observation_id")

          historical_by_id = {row["observation_id"]: row for row in historical}
          rebuilt_by_id = {row["observation_id"]: row for row in rebuilt}
          missing_ids = sorted(set(historical_by_id) - set(rebuilt_by_id))
          extra_ids = sorted(set(rebuilt_by_id) - set(historical_by_id))
          shared_ids = sorted(set(historical_by_id) & set(rebuilt_by_id))

          mismatch_counts = Counter()
          examples = []
          for observation_id in shared_ids:
              left = historical_by_id[observation_id]
              right = rebuilt_by_id[observation_id]
              for column in common:
                  if left.get(column, "") != right.get(column, ""):
                      mismatch_counts[column] += 1
                      if len(examples) < 20:
                          examples.append({
                              "observation_id": observation_id,
                              "column": column,
                              "historical": left.get(column, ""),
                              "rebuilt": right.get(column, ""),
                          })

          def canonical_digest(header, rows):
              columns = sorted(set(header) - volatile)
              if "observation_id" in columns:
                  columns.remove("observation_id")
                  columns.insert(0, "observation_id")
              output = io.StringIO(newline="")
              writer = csv.DictWriter(output, fieldnames=columns, lineterminator="\n")
              writer.writeheader()
              for row in sorted(rows, key=lambda item: item.get("observation_id", "")):
                  writer.writerow({column: row.get(column, "") for column in columns})
              return hashlib.sha256(output.getvalue().encode("utf-8")).hexdigest()

          result = {
              "volatile_columns_excluded": sorted(volatile),
              "historical_rows": len(historical),
              "rebuilt_rows": len(rebuilt),
              "columns_only_historical": only_historical,
              "columns_only_rebuilt": only_rebuilt,
              "missing_observation_ids": missing_ids[:20],
              "extra_observation_ids": extra_ids[:20],
              "mismatch_counts": dict(sorted(mismatch_counts.items())),
              "mismatch_examples": examples,
              "historical_stable_sha256": canonical_digest(historical_header, historical),
              "rebuilt_stable_sha256": canonical_digest(rebuilt_header, rebuilt),
          }
          result["stable_content_equal"] = (
              not only_historical
              and not only_rebuilt
              and not missing_ids
              and not extra_ids
              and not mismatch_counts
              and result["historical_stable_sha256"] == result["rebuilt_stable_sha256"]
          )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Read pinned R version
        id: r-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r-version.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          sudo apt-get update
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs sudo apt-get install -y

      - name: Run the retained pipeline from the generated canonical table
        run: python run_pipeline.py reproduce --no-resume

      - name: Show downstream analysis manifest
        if: always()
        shell: bash
        run: |
          if [ -f results/analysis_reproduction/run_manifest.json ]; then
            cat results/analysis_reproduction/run_manifest.json
          fi
