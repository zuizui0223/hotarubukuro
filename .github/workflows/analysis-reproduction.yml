name: Analysis reproduction contract

on:
  push:
    branches: [main]
    paths:
      - "Data_S1.csv"
      - "Code_S1.py"
      - "run_pipeline.py"
      - "R/**"
      - "scripts/**"
      - "source_build/**"
      - "analysis_sensitivity/**"
      - "config/**"
      - "dependencies/**"
      - "pyproject.toml"
      - ".github/workflows/analysis-reproduction.yml"
  pull_request:
    paths:
      - "Data_S1.csv"
      - "Code_S1.py"
      - "run_pipeline.py"
      - "R/**"
      - "scripts/**"
      - "source_build/**"
      - "analysis_sensitivity/**"
      - "config/**"
      - "dependencies/**"
      - "pyproject.toml"
      - ".github/workflows/analysis-reproduction.yml"
  workflow_dispatch:
    inputs:
      full_reproduction:
        description: "Run the full public-source analysis reconstruction"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile public Python entry points
        run: python -m py_compile run_pipeline.py Code_S1.py
      - name: Validate fixed public inputs and required analysis files
        run: python run_pipeline.py audit
      - name: Validate complete stage graph without running heavy models
        run: python run_pipeline.py reproduce --dry-run --skip-setup
      - name: Run Python unit tests
        run: |
          python -m pip install -e ".[test]"
          python -m pytest

  full-reproduction:
    if: github.event_name == 'workflow_dispatch' && inputs.full_reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run one-command public analysis reconstruction
        run: python run_pipeline.py reproduce --no-resume
      - name: Show reconstruction manifest
        if: always()
        run: |
          if [ -f results/analysis_reproduction/run_manifest.json ]; then
            cat results/analysis_reproduction/run_manifest.json
          fi

# This comment intentionally triggers the pull-request contract smoke test.
