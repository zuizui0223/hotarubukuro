name: Apply JBI background rewrite

on:
  push:
    branches:
      - agent/jbi-submission-manuscript
    paths:
      - submission/jbi/rewrite_background_once.py

permissions:
  contents: write

jobs:
  rewrite-introduction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite Introduction around dependent biogeographical bottlenecks
        run: |
          set -euo pipefail
          python submission/jbi/rewrite_background_once.py
          git diff --check
          python submission/jbi/validate_jbi_submission.py

      - name: Commit revised JBI manuscript
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/jbi/JBI_main_manuscript_anonymized.md
          git commit -m 'Rewrite JBI background as dependent ecological argument'
          git push origin "HEAD:${GITHUB_REF_NAME}"
