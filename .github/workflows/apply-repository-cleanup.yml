name: Apply one-time repository cleanup

on:
  push:
    branches:
      - agent/repository-cleanup-legacy
    paths:
      - scripts/repository_cleanup_once.py
      - .github/workflows/apply-repository-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply cleanup
        run: python scripts/repository_cleanup_once.py

      - name: Validate staged tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d manuscript
          test -d legacy/manuscript-development
          test ! -e scripts/run_bombus_limitation_gate.R
          test ! -e scripts/run_publication_pipeline.R
          test ! -e .github/workflows/analysis-1909.yml
          test -s paper/README.md
          test -s submission/jbi/JBI_main_manuscript_anonymized.md
          python submission/jbi/validate_jbi_submission.py
          python -m py_compile submission/jbi/validate_jbi_submission.py
          bash -n scripts/run_reanalysis_current_inputs.sh
          bash -n scripts/run_downstream_current_inputs.sh

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Archive superseded analysis development under legacy'
          git push origin "HEAD:${GITHUB_REF_NAME}"
