name: Apply one-time repository cleanup

on:
  push:
    branches:
      - agent/repository-cleanup-legacy
    paths:
      - .github/workflows/apply-repository-cleanup.yml

permissions:
  contents: write

env:
  CLEANUP_COMMIT_MESSAGE: "Archive superseded analysis development under legacy"

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move superseded material into legacy
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            legacy/workflows \
            legacy/method-development/scripts \
            legacy/method-development/R \
            legacy/method-development/validation \
            legacy/method-development/tests \
            legacy/reproducibility-development/docs \
            legacy/reproducibility-development/inputs \
            legacy/reproducibility-development/config

          # Previous manuscript architecture: preserved intact but no longer active.
          git mv manuscript legacy/manuscript-development
          git mv reports legacy/reporting

          # Workflows tied to superseded populations, gates or development branches.
          for f in \
            analysis-1909.yml \
            bombus-limitation-gate.yml \
            bombus-relaxation-local-current-inputs.yml \
            resume-reanalysis-current-inputs.yml \
            pr-checks.yml \
            repository-checks.yml; do
            git mv ".github/workflows/$f" "legacy/workflows/$f"
          done

          # Superseded orchestration / estimands / old figure production.
          for f in \
            run_analysis_1909.sh \
            run_bombus_limitation_gate.R \
            run_bombus_limitation_gate_current_inputs.R \
            run_bombus_relaxation_local_contrast.R \
            resume_reanalysis_from_fresh_v16.sh \
            report_analysis_arc.R \
            run_publication_pipeline.R \
            build_publication_figures.R \
            run_local_bombus_turnover.R; do
            git mv "scripts/$f" "legacy/method-development/scripts/$f"
          done
          git mv scripts/internal legacy/method-development/scripts/internal

          git mv R/local_bombus_turnover.R legacy/method-development/R/local_bombus_turnover.R
          git mv R/final_registry.R legacy/method-development/R/final_registry.R

          for f in \
            audit_bombus_limitation_gate.R \
            validate_bombus_limitation_gate.R \
            audit_local_bombus_turnover.R \
            validate_local_bombus_turnover.R \
            audit_publication_claims.R \
            validate_publication_pipeline.R \
            validate_submission_analysis_lock.R \
            validate_submission_isolate_null.R; do
            git mv "validation/$f" "legacy/method-development/validation/$f"
          done

          for f in test-local-bombus-turnover.R test-publication-pipeline.R; do
            git mv "tests/testthat/$f" "legacy/method-development/tests/$f"
          done

          # Superseded documentation and frozen expectations.
          for f in analysis-1909.md bombus-limitation-gate-results.md pipeline-dag.md; do
            git mv "docs/$f" "legacy/reproducibility-development/docs/$f"
          done
          git mv inputs/analysis_1909_expectations.csv \
            legacy/reproducibility-development/inputs/analysis_1909_expectations.csv
          git mv config/code_manifest.csv \
            legacy/reproducibility-development/config/code_manifest.csv

          for f in \
            bombus_relaxation_analysis_spec_2026-08-08.md \
            bombus_relaxation_results_2026-08-08.md \
            phenology_removal_candidate_identity.md \
            pipeline_stage_registry.csv; do
            git mv "reproducibility/$f" "legacy/reproducibility-development/$f"
          done
          git mv reproducibility/patches legacy/reproducibility-development/patches

      - name: Remove legacy stages from current-input reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # The upstream driver should end after producing the fresh v11/v15 boundary.
          p = Path('scripts/run_reanalysis_current_inputs.sh')
          text = p.read_text(encoding='utf-8')
          marker = '''# ---------------------------------------------------------------------------
# 6. Replace only the active pipeline's upstream boundary and run the same
#    downstream stages in reconstruction mode. Historical n identity checks are
#    explicitly not applicable; structural/scientific validations still run.
# ---------------------------------------------------------------------------
'''
          if marker not in text:
              raise SystemExit('Could not locate section 6 in run_reanalysis_current_inputs.sh')
          prefix = text.split(marker, 1)[0]
          clean_tail = '''# ---------------------------------------------------------------------------
# 6. Publish only the freshly rebuilt broad-analysis boundary.
#    Downstream anomaly analyses are run once by run_downstream_current_inputs.sh;
#    the manuscript-facing Bombus test is a separate local-transition pipeline.
# ---------------------------------------------------------------------------
for stage in \\
  environment_v3 \\
  ecological_v9_final_public_HRNA_50km \\
  ecological_v10_final_mechanism_HRNA \\
  ecological_v11_pigmentation_hurdle \\
  ecological_v15_multiscale_hotspots; do
  rm -rf "results/${stage}"
  cp -a "${UPSTREAM_DIR}/results/${stage}" results/
done

echo "=== fresh current-input broad-analysis boundary complete ==="
'''
          p.write_text(prefix + clean_tail, encoding='utf-8')

          # Remove the obsolete all-five fixed limitation gate from current downstream work.
          p = Path('scripts/run_downstream_current_inputs.sh')
          text = p.read_text(encoding='utf-8')
          start = text.find('# Same stage-03 analysis definition.')
          end = text.find('run_stage 04_run_human_landscape_features', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate obsolete stage 03 in run_downstream_current_inputs.sh')
          replacement = '''# The manuscript-facing Bombus analysis is intentionally not part of this broad/anomaly
# reconstruction. It is run separately at sharp local colour boundaries.

'''
          p.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # Remove obsolete limitation-gate/final-lock reporting from the current summary.
          p = Path('scripts/report_reanalysis_current_inputs.R')
          text = p.read_text(encoding='utf-8')
          for block in [
              '''gate <- read_csv("results/ecological_v17_bombus_limitation_gate/bombus_limitation_gate_summary.csv")
gate_support <- read_csv(
  "results/ecological_v17_bombus_limitation_gate/bombus_limitation_gate_support_diagnostics.csv",
  required = FALSE
)
gate_interpretation <- read_csv(
  "results/ecological_v17_bombus_limitation_gate/interpretation_summary.csv",
  required = FALSE
)
''',
              '''final_results <- read_csv("results/final_analysis_pipeline/final_result_registry.csv", required = FALSE)
final_claims <- read_csv("results/final_analysis_pipeline/final_claim_registry.csv", required = FALSE)
'''
          ]:
              if block not in text:
                  raise SystemExit('Expected reporting block not found')
              text = text.replace(block, '')

          s = text.find('if (all(c("is_primary_gate", "response") %in% names(gate))) {')
          e = text.find('add("local_isolates", "candidate_count"', s)
          if s < 0 or e < 0:
              raise SystemExit('Could not locate gate-reporting section')
          text = text[:s] + text[e:]

          for line in [
              'write_csv(gate, "bombus_limitation_gate_summary.csv")\n',
              'write_csv(gate_support, "bombus_limitation_gate_support_diagnostics.csv")\n',
              'write_csv(final_results, "final_result_registry.csv")\n',
              'write_csv(final_claims, "final_claim_registry.csv")\n'
          ]:
              text = text.replace(line, '')

          s = text.find('primary_gate <- gate[gate$is_primary_gate')
          e = text.find('markdown <- c(', s)
          if s < 0 or e < 0:
              raise SystemExit('Could not locate gate_line reporting block')
          text = text[:s] + text[e:]
          text = text.replace('  gate_line,\n', '')
          text = text.replace(
              '  "Scientific stage order, response definitions, natural model, fixed Bombus gate grid,",\n'
              '  "local-isolate definition, natural-null procedure, and human-context analyses were retained.",\n'
              '  "Only the upstream flower/environment reconstruction and Bombus source build were replaced.",\n'
              '  "A fixed gate that has no fresh-SDM support is reported as not estimable rather than retuned."\n',
              '  "The report summarizes the fresh broad natural template and event-based anomaly/human-context stages.",\n'
              '  "The focal Bombus availability test is intentionally run in a separate local-transition pipeline."\n'
          )
          p.write_text(text, encoding='utf-8')
          PY

      - name: Update active workflows and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Current-input workflow: one upstream rebuild followed by one downstream pass.
          p = Path('.github/workflows/reanalysis-current-inputs.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('      - agent/reanalyse-from-1965-new-bombus\n', '      - main\n')
          text = text.replace('      - name: Rebuild fresh upstream boundary and run strict audit attempt\n        id: upstream_run\n        continue-on-error: true\n        shell: bash\n        run: bash scripts/run_reanalysis_current_inputs.sh "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/source-artifact"\n',
                              '      - name: Rebuild fresh broad-analysis boundary\n        shell: bash\n        run: bash scripts/run_reanalysis_current_inputs.sh "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/source-artifact"\n')
          old = '''      - name: Remove historical downstream checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \\
            results/ecological_v16_* \\
            results/ecological_v17_* \\
            results/ecological_v18_* \\
            results/ecological_v19_* \\
            results/ecological_v2[0-9]_* \\
            results/final_analysis_pipeline
          rm -rf manuscript/figures
          mkdir -p manuscript/figures reanalysis_status

'''
          new = '''      - name: Clear downstream outputs before the fresh pass
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \\
            results/ecological_v16_* \\
            results/ecological_v17_* \\
            results/ecological_v18_* \\
            results/ecological_v19_* \\
            results/ecological_v2[0-9]_* \\
            results/final_analysis_pipeline
          mkdir -p reanalysis_status

'''
          if old not in text:
              raise SystemExit('Historical checkpoint cleanup block not found')
          text = text.replace(old, new)
          text = text.replace('            echo "strict_audit_attempt_outcome=${{ steps.upstream_run.outcome }}"\n', '')
          text = text.replace('            manuscript/figures\n', '')
          text = text.replace('          find reanalysis_inputs reanalysis_status results manuscript/figures \\
', '          find reanalysis_inputs reanalysis_status results \\
')
          p.write_text(text, encoding='utf-8')

          # Final paper integration now points to the JBI package / paper map, not old E&E drafts.
          p = Path('.github/workflows/final-paper-analysis.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('      - agent/final-broad-fine-anomaly-pipeline\n', '      - main\n')
          text = text.replace('      - manuscript/**\n', '      - paper/**\n      - submission/jbi/**\n')
          text = text.replace('          test -s manuscript/ecology-and-evolution-manuscript-final.md\n          test -s manuscript/design-logic-and-novelty-ja.md\n',
                              '          test -s paper/README.md\n          test -s paper/active-file-map.csv\n          test -s submission/jbi/JBI_main_manuscript_anonymized.md\n          test -s submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md\n')
          text = text.replace("          grep -q '1,964 georeferenced focal-species photo records' manuscript/ecology-and-evolution-manuscript-final.md\n          grep -q '389 of which were syndicated from iNaturalist' manuscript/ecology-and-evolution-manuscript-final.md\n          grep -q 'including \\*Adenophora\\* where encountered' manuscript/ecology-and-evolution-manuscript-final.md\n",
                              "          grep -q '1,964' submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md\n          grep -q '389/393' submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md\n")
          for old_path in [
              '            manuscript/ecology-and-evolution-manuscript-final.md\n',
              '            manuscript/ecology-and-evolution-manuscript.md\n',
              '            manuscript/design-logic-and-novelty-ja.md\n',
              '            manuscript/figure-map.md\n',
              '            manuscript/supporting-information-plan.md\n'
          ]:
              text = text.replace(old_path, '')
          marker = '            reproducibility/yamap_public_database_benchmark_results_2026-08-09.md\n'
          text = text.replace(marker, marker + '            paper\n            submission/jbi\n')
          p.write_text(text, encoding='utf-8')

          # JBI format check should follow the cleaned submission branch and main.
          p = Path('.github/workflows/jbi-submission-format.yml')
          text = p.read_text(encoding='utf-8')
          text = text.replace('      - agent/jbi-submission-manuscript\n', '      - main\n      - agent/repository-cleanup-legacy\n')
          text = text.replace('          test -s submission/jbi/JBI_translated_abstract_ja.md\n',
                              '          test -s submission/jbi/JBI_translated_abstract_ja.md\n          test -s submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md\n          test -s paper/active-file-map.csv\n')
          p.write_text(text, encoding='utf-8')

          Path('scripts/README.md').write_text('''# Current manuscript-facing scripts

Start with [`../paper/README.md`](../paper/README.md). This directory now contains only current reusable infrastructure plus scripts that feed the active broad/anomaly or local-pollinator analyses. Superseded runners and estimands are under `legacy/method-development/`.

## Broad natural template + event-based departures

- `run_reanalysis_current_inputs.sh` — rebuilds the fresh 1,965-row upstream environment/phenotype boundary only.
- `run_downstream_current_inputs.sh` — runs the current natural predictive reference, event-based departure calibration and post-selection human-context stages.
- `report_reanalysis_current_inputs.R` — writes the fresh 1,922-observation manuscript summary.
- `run_natural_predictive_model.R`
- `run_local_pigmented_isolates.R`
- `run_joint_submission_isolate_ppc.R`
- `run_human_landscape_features.R`
- `run_local_human_context.R`
- `run_did_sensitivity.R`
- `run_candidate_doy_check.R`

## Local pollinator analysis

- `run_bombus_effective_availability_refined.R` — occurrence-reference calibration for the focal broad pollinators.
- `run_bombus_local_sharp_transition.R` — manuscript-facing 5-km white-pigmented boundary test.
- `run_bombus_spatial_replication_test.R` — Supporting Information community-boundary and montane/elevation guardrails.

## Infrastructure

- `canonical_snapshot.sh`, `setup_r_environment.R`, raster/snapshot helpers and validation utilities remain here only when they are used by a current workflow.

Historical 1,909 runners, old Bombus limitation gates, relaxation variants, old local-turnover code and previous publication orchestrators are not active entry points.
''', encoding='utf-8')
          PY

      - name: Write legacy move inventory and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > legacy/MOVED_2026-08-09.md <<'EOF'
          # Repository cleanup inventory — 2026-08-09

          This cleanup separates the current JBI paper from method-development history.

          ## Archived as manuscript development
          - former `manuscript/` tree -> `legacy/manuscript-development/`
          - former `reports/` tree -> `legacy/reporting/`

          ## Archived as obsolete method development
          - 1,909 complete runner and publication orchestrator
          - all-five Bombus limitation-gate implementation and validators
          - Bombus relaxation/local-contrast development variant
          - superseded local Bombus-turnover implementation
          - old E&E publication figure builder
          - old final-registry/publication-lock code and tests

          ## Archived as old workflow/reproducibility structure
          - 1,909 and limitation-gate workflows
          - relaxation/resume workflows
          - old PR/repository checks tied to 1,909 expectations
          - old code manifest / stage registry / 1,909 expectation file
          - superseded relaxation specifications and one-time manuscript patch

          Current evidence is listed only in `paper/active-file-map.csv`.
          EOF
          rm .github/workflows/apply-repository-cleanup.yml

      - name: Sanity checks before commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -d manuscript
          test -d legacy/manuscript-development
          test ! -e scripts/run_bombus_limitation_gate.R
          test ! -e scripts/run_publication_pipeline.R
          test ! -e .github/workflows/analysis-1909.yml
          test -s paper/README.md
          test -s submission/jbi/JBI_main_manuscript_anonymized.md
          python submission/jbi/validate_jbi_submission.py
          Rscript -e 'parse("scripts/report_reanalysis_current_inputs.R"); parse("scripts/run_bombus_local_sharp_transition.R"); parse("scripts/run_bombus_spatial_replication_test.R")'
          bash -n scripts/run_reanalysis_current_inputs.sh
          bash -n scripts/run_downstream_current_inputs.sh

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$CLEANUP_COMMIT_MESSAGE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
