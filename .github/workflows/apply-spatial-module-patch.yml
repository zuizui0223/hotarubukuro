name: Apply one-time spatial-module patch

on:
  push:
    branches:
      - agent/repository-cleanup-legacy
    paths:
      - scripts/patch_spatial_replication_module_once.py
      - .github/workflows/apply-spatial-module-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch current Supporting Information script
        run: |
          python scripts/patch_spatial_replication_module_once.py
          git diff --check
          grep -q 'source("R/local_pair_graph.R")' scripts/run_bombus_spatial_replication_test.R
          ! grep -q 'v17_require_columns' scripts/run_bombus_spatial_replication_test.R
          ! grep -q 'v17_pair_graph' scripts/run_bombus_spatial_replication_test.R
          ! grep -q 'hb_load_modules("local_bombus_turnover")' scripts/run_bombus_spatial_replication_test.R
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_bombus_spatial_replication_test.R
          git commit -m 'Use current local-pair utilities in Bombus supplement'
          git push origin "HEAD:${GITHUB_REF_NAME}"
