name: Apply YAMAP benchmark to active manuscript

on:
  push:
    branches:
      - agent/final-broad-fine-anomaly-pipeline
    paths:
      - .github/workflows/apply-yamap-manuscript-benchmark.yml

permissions:
  contents: write

jobs:
  patch-manuscript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply locked manuscript patch
        shell: bash
        run: |
          set -euo pipefail
          patch='reproducibility/patches/yamap_manuscript_benchmark_2026-08-09.patch'
          test -s "$patch"
          git apply --check "$patch"
          git apply "$patch"
          git diff --check
          grep -q '1,964 author-screened georeferenced records' manuscript/ecology-and-evolution-manuscript-final.md
          grep -q '389 were syndicated iNaturalist records' manuscript/ecology-and-evolution-manuscript-final.md
          grep -q 'including \*Adenophora\* where encountered' manuscript/ecology-and-evolution-manuscript-final.md

      - name: Commit manuscript integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manuscript/ecology-and-evolution-manuscript-final.md
          git commit -m 'Integrate YAMAP benchmark into active manuscript'
          git push origin "HEAD:${GITHUB_REF_NAME}"
