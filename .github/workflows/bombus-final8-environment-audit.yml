name: Bombus final8 environmental-distance audit

on:
  pull_request:
    paths:
      - analysis_sensitivity/audit_bombus_final8_environment_distance.R
      - R/local_pair_graph.R
      - .github/workflows/bombus-final8-environment-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROAD_ARTIFACT_ID: "9022276431"
      BROAD_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
      BOMB_S_ARTIFACT_ID: "9023416810"
      BOMB_S_ARTIFACT_SHA256: "3f7ac07ea90e2b732441a9f80a38ea49871014722d008769370524b947007e34"
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true
      - name: Restore checksum-locked evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for kind in broad bombus; do rm -rf "$kind" "/tmp/$kind.zip"; mkdir -p "$kind"; done
          curl --fail --location --retry 5 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BROAD_ARTIFACT_ID}/zip" -o /tmp/broad.zip
          test "$(sha256sum /tmp/broad.zip | awk '{print $1}')" = "$BROAD_ARTIFACT_SHA256"
          unzip -q /tmp/broad.zip -d broad
          curl --fail --location --retry 5 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOMB_S_ARTIFACT_ID}/zip" -o /tmp/bombus.zip
          test "$(sha256sum /tmp/bombus.zip | awk '{print $1}')" = "$BOMB_S_ARTIFACT_SHA256"
          unzip -q /tmp/bombus.zip -d bombus
      - name: Resolve locked input paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          cells=$(find broad -type f -name multiscale_hotspot_cells_1km.csv | head -n 1)
          pairs=$(find bombus -type f -name sharp_transition_nonoverlapping_pairs.csv | head -n 1)
          test -n "$cells" && test -s "$cells"
          test -n "$pairs" && test -s "$pairs"
          echo "cells=$cells" >> "$GITHUB_OUTPUT"
          echo "pairs=$pairs" >> "$GITHUB_OUTPUT"
      - name: Audit final8 environmental similarity
        run: |
          Rscript analysis_sensitivity/audit_bombus_final8_environment_distance.R \
            --cells "${{ steps.paths.outputs.cells }}" \
            --pairs "${{ steps.paths.outputs.pairs }}" \
            --output results/bombus_final8_environment_audit
      - name: Validate
        run: |
          test -s results/bombus_final8_environment_audit/bombus_pair_environment_distance_audit.csv
          grep -q '^status=PASS$' results/bombus_final8_environment_audit/validation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bombus-final8-environment-audit-${{ github.sha }}-${{ github.run_id }}
          path: results/bombus_final8_environment_audit
          if-no-files-found: error
          retention-days: 90
