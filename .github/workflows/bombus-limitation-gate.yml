name: Bombus limitation gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bombus-sdm-inference-guardrails
    paths:
      - .github/workflows/bombus-limitation-gate.yml
      - scripts/run_bombus_limitation_gate.R
      - R/local_bombus_turnover.R
      - config/code_manifest.csv

permissions:
  contents: read
  actions: read

jobs:
  limitation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Download frozen 1,909 submission artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p canonical-artifact
          gh run download 31149006557 \
            --repo zuizui0223/hotarubukuro \
            --name analysis-1909-2084bceaef9c4dee71a3399c9d0c5aa917abe067-31149006557 \
            --dir canonical-artifact

      - name: Run Bombus limitation-gate analysis
        run: |
          Rscript scripts/run_bombus_limitation_gate.R \
            --artifact-root canonical-artifact \
            --output exploratory-output \
            --env-match 0.75 \
            --low-thresholds 0.10,0.20,0.25,0.33 \
            --available-threshold 0.50

      - name: Show interpretation
        run: |
          cat exploratory-output/bombus_limitation_gate_summary.csv
          echo
          cat exploratory-output/available_zone_intensity_gradient.csv
          echo
          cat exploratory-output/interpretation_summary.csv

      - uses: actions/upload-artifact@v4
        with:
          name: bombus-limitation-gate-${{ github.sha }}
          path: exploratory-output
          if-no-files-found: error
          retention-days: 30
