# Fixed-head execution copy; scientific code is identical to the parent branch.
name: Run corrected broad environment and spatial audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/broad-environment-spatial-audit-fixed.yml
      - analysis_sensitivity/run_broad_environment_spatial_audit_wrapper.R
      - scripts/run_broad_environment_spatial_audit.R
      - reproducibility/broad_environment_spatial_audit_spec_2026-08-11.md
      - reproducibility/broad_environment_variable_evidence_registry_2026-08-11.csv
      - config/raster_sources.csv
      - source_build/download_rasters.R
      - source_build/prepare_rasters.R
      - dependencies/**

permissions:
  contents: read
  actions: read

concurrency:
  group: broad-environment-spatial-audit-fixed-${{ github.ref }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  EXTRA_RASTER_IDS: "chelsa_bio06,chelsa_bio13,chelsa_vpdmean,chelsa_swb,worldclim_elevation_30s"

jobs:
  prepare:
    name: Prepare omitted public environmental proxies
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true
      - name: Install system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs sudo apt-get install --yes --no-install-recommends
      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
      - name: Restore raster cache
        uses: actions/cache@v4
        with:
          path: data/cache/rasters
          key: broad-audit-fixed-rasters-${{ hashFiles('config/raster_sources.csv', 'config/pipeline.yml', 'R/raster_sources.R') }}
          restore-keys: |
            current-paper-rasters-
            raw-sources-
      - name: Restore R environment
        run: Rscript scripts/setup_r_environment.R --report-dir reproducibility --scopes analysis,reproducibility,acquisition,testing
      - name: Download and prepare selected rasters
        shell: bash
        run: |
          set -euo pipefail
          Rscript source_build/download_rasters.R --only "${EXTRA_RASTER_IDS}"
          Rscript source_build/prepare_rasters.R --only "${EXTRA_RASTER_IDS}" --force
          for raster in chelsa_bio06.tif chelsa_bio13.tif chelsa_vpdmean.tif chelsa_swb.tif elevation_30s.tif; do
            test -s "data/processed/rasters/${raster}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: broad-audit-fixed-rasters-${{ github.sha }}-${{ github.run_id }}
          path: data/processed/rasters
          if-no-files-found: error
          retention-days: 90

  fit:
    name: Corrected Broad audit — ${{ matrix.outcome }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        outcome: [pigmentation_state, conditional_intensity]
    steps:
      - uses: actions/checkout@v5
      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true
      - name: Install system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs sudo apt-get install --yes --no-install-recommends
      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
      - name: Restore R environment
        run: Rscript scripts/setup_r_environment.R --report-dir reproducibility --scopes analysis,reproducibility,testing
      - name: Restore checksum-locked broad evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" -o /tmp/reference.zip
          [[ "$(sha256sum /tmp/reference.zip | awk '{print $1}')" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact && unzip -q /tmp/reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv
          test -s reference-artifact/results/ecological_v19_human_landscape_extremes/landscape_cell_features.csv
      - uses: actions/download-artifact@v5
        with:
          name: broad-audit-fixed-rasters-${{ github.sha }}-${{ github.run_id }}
          path: data/processed/rasters
      - name: Normalize raster paths
        shell: bash
        run: |
          set -euo pipefail
          find data/processed/rasters -type f -name '*.tif' -exec cp -f {} data/processed/rasters/ \; 2>/dev/null || true
          for raster in chelsa_bio06.tif chelsa_bio13.tif chelsa_vpdmean.tif chelsa_swb.tif elevation_30s.tif; do
            test -s "data/processed/rasters/${raster}"
          done
      - name: Run corrected comprehensive audit
        shell: bash
        run: |
          set -euo pipefail
          Rscript analysis_sensitivity/run_broad_environment_spatial_audit_wrapper.R \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --landscape-csv reference-artifact/results/ecological_v19_human_landscape_extremes/landscape_cell_features.csv \
            --raster-dir data/processed/rasters \
            --outcome "${{ matrix.outcome }}" \
            --output-dir results/broad_environment_spatial_audit \
            --bootstrap-reps 4000 --seed 20260814
      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          root="results/broad_environment_spatial_audit/${{ matrix.outcome }}"
          test -s "$root/validation.json"
          test -s "$root/environment_model_decision_table.csv"
          test -s "$root/spatial_model_decision_table.csv"
          ! grep -q '"status": "FAIL"' "$root/validation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: broad-audit-fixed-${{ matrix.outcome }}-${{ github.sha }}-${{ github.run_id }}
          path: results/broad_environment_spatial_audit/${{ matrix.outcome }}
          if-no-files-found: error
          retention-days: 90
