name: Finalize broad environment and spatial structure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/broad-environment-spatial-audit.yml
      - scripts/run_broad_environment_spatial_audit.R
      - reproducibility/broad_environment_spatial_audit_spec_2026-08-11.md
      - reproducibility/broad_environment_variable_evidence_registry_2026-08-11.csv
      - config/**
      - source_build/**
      - R/raster_sources.R
      - dependencies/**
      - paper/active-file-map.csv
      - scripts/README.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/broad-environment-spatial-audit.yml
      - scripts/run_broad_environment_spatial_audit.R
      - reproducibility/broad_environment_spatial_audit_spec_2026-08-11.md
      - reproducibility/broad_environment_variable_evidence_registry_2026-08-11.csv
      - config/**
      - source_build/**
      - R/raster_sources.R
      - dependencies/**
      - paper/active-file-map.csv
      - scripts/README.md

permissions:
  contents: read
  actions: read

concurrency:
  group: broad-environment-spatial-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  EXTRA_RASTER_IDS: "chelsa_bio06,chelsa_bio13,chelsa_vpdmean,chelsa_swb,worldclim_elevation_30s"

jobs:
  prepare-raster-audit:
    name: Prepare omitted public environmental proxies
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore public raster cache
        uses: actions/cache@v4
        with:
          path: data/cache/rasters
          key: broad-audit-rasters-${{ hashFiles('config/raster_sources.csv', 'config/pipeline.yml', 'R/raster_sources.R') }}
          restore-keys: |
            current-paper-rasters-
            raw-sources-
            broad-audit-rasters-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,acquisition,testing

      - name: Download selected public rasters
        shell: bash
        run: |
          set -euo pipefail
          Rscript source_build/download_rasters.R \
            --only "${EXTRA_RASTER_IDS}"

      - name: Prepare selected rasters
        shell: bash
        run: |
          set -euo pipefail
          Rscript source_build/prepare_rasters.R \
            --only "${EXTRA_RASTER_IDS}" \
            --force

      - name: Verify prepared raster set
        shell: bash
        run: |
          set -euo pipefail
          for raster in \
            chelsa_bio06.tif \
            chelsa_bio13.tif \
            chelsa_vpdmean.tif \
            chelsa_swb.tif \
            elevation_30s.tif
          do
            test -s "data/processed/rasters/${raster}"
          done
          test -s data/processed/raster_download_manifest.csv
          test -s data/processed/raster_manifest.csv

      - name: Upload prepared audit rasters
        uses: actions/upload-artifact@v4
        with:
          name: broad-audit-rasters-${{ github.sha }}-${{ github.run_id }}
          path: |
            data/processed/rasters/chelsa_bio06.tif
            data/processed/rasters/chelsa_bio13.tif
            data/processed/rasters/chelsa_vpdmean.tif
            data/processed/rasters/chelsa_swb.tif
            data/processed/rasters/elevation_30s.tif
            data/processed/raster_download_manifest.csv
            data/processed/raster_manifest.csv
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

  fit-response:
    name: Broad environment/spatial audit — ${{ matrix.outcome }}
    needs: prepare-raster-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        outcome:
          - pigmentation_state
          - conditional_intensity

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing

      - name: Restore checksum-locked broad-analysis evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/current-broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/current-broad-reference.zip
          actual="$(sha256sum /tmp/current-broad-reference.zip | awk '{print $1}')"
          [[ "$actual" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/current-broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv
          test -s reference-artifact/results/ecological_v19_human_landscape_extremes/landscape_cell_features.csv

      - name: Download prepared audit rasters
        uses: actions/download-artifact@v5
        with:
          name: broad-audit-rasters-${{ github.sha }}-${{ github.run_id }}
          path: data

      - name: Normalize downloaded raster paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/processed/rasters
          find data -type f -name '*.tif' -exec cp -f {} data/processed/rasters/ \;
          for raster in \
            chelsa_bio06.tif \
            chelsa_bio13.tif \
            chelsa_vpdmean.tif \
            chelsa_swb.tif \
            elevation_30s.tif
          do
            test -s "data/processed/rasters/${raster}"
          done

      - name: Run response-specific broad audit
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/run_broad_environment_spatial_audit.R \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --landscape-csv reference-artifact/results/ecological_v19_human_landscape_extremes/landscape_cell_features.csv \
            --raster-dir data/processed/rasters \
            --outcome "${{ matrix.outcome }}" \
            --output-dir "results/broad_environment_spatial_audit" \
            --bootstrap-reps 4000 \
            --seed 20260814

      - name: Verify response output
        shell: bash
        run: |
          set -euo pipefail
          root="results/broad_environment_spatial_audit/${{ matrix.outcome }}"
          test -s "$root/validation.json"
          test -s "$root/environment_model_decision_table.csv"
          test -s "$root/spatial_model_decision_table.csv"
          test -s "$root/environment_fixed_effects.csv"
          test -s "$root/spatial_hyperparameters.csv"
          ! grep -q '"status": "FAIL"' "$root/validation.json"
          expected_spatial=8
          observed_spatial="$(awk 'END {print NR-1}' "$root/spatial_full_fit_metrics.csv")"
          [[ "$observed_spatial" -eq "$expected_spatial" ]]
          if [[ "${{ matrix.outcome }}" == "pigmentation_state" ]]; then
            expected_environment=16
          else
            expected_environment=19
          fi
          observed_environment="$(awk 'END {print NR-1}' "$root/environment_full_fit_metrics.csv")"
          [[ "$observed_environment" -eq "$expected_environment" ]]

      - name: Record workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          root="results/broad_environment_spatial_audit/${{ matrix.outcome }}"
          cat > "$root/workflow_provenance.txt" <<EOF
          workflow=broad-environment-spatial-audit
          workflow_run=${GITHUB_RUN_ID}
          workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          outcome=${{ matrix.outcome }}
          reference_artifact_id=${REFERENCE_ARTIFACT_ID}
          reference_artifact_sha256=${REFERENCE_ARTIFACT_SHA256}
          extra_raster_ids=${EXTRA_RASTER_IDS}
          frozen_cell_natural_reference_replaced=false
          EOF
          find "$root" -type f -printf '%P\t%s\n' | sort > "$root/file_inventory.tsv"

      - name: Upload response audit
        uses: actions/upload-artifact@v4
        with:
          name: broad-environment-spatial-${{ matrix.outcome }}-${{ github.sha }}-${{ github.run_id }}
          path: results/broad_environment_spatial_audit/${{ matrix.outcome }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

  aggregate:
    name: Combine broad environment/spatial evidence
    needs: fit-response
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Download both response artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: broad-environment-spatial-*-${{ github.sha }}-${{ github.run_id }}
          path: combined/broad_environment_spatial_audit
          merge-multiple: false

      - name: Validate and index combined evidence
        shell: bash
        run: |
          set -euo pipefail
          find combined/broad_environment_spatial_audit -name validation.json -print | sort \
            > combined/validation_files.txt
          [[ "$(wc -l < combined/validation_files.txt)" -eq 2 ]]
          while read -r validation; do
            ! grep -q '"status": "FAIL"' "$validation"
          done < combined/validation_files.txt
          find combined/broad_environment_spatial_audit -type f -printf '%p\t%s\n' | sort \
            > combined/file_inventory.tsv
          cat > combined/README.md <<EOF
          # Combined broad environmental and spatial-model audit

          This artifact evaluates omitted public environmental proxies, observation-process controls, final seasonality interactions, repeated-site structure, removal of the structural East/West factor and ocean-barrier SPDE alternatives for the two current flower-colour responses.

          The analysis is observation-level. It does not replace the separately frozen cell-level natural predictive reference or the 17 local-departure targets.
          EOF

      - name: Upload combined audit
        uses: actions/upload-artifact@v4
        with:
          name: broad-environment-spatial-combined-${{ github.sha }}-${{ github.run_id }}
          path: combined
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
