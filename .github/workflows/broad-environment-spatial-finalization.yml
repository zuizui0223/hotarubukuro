name: Finalize broad environmental and spatial model

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/broad-environment-spatial-finalization.yml
      - analysis_sensitivity/run_environment_interaction_joint_adjudication.py
      - analysis_sensitivity/run_broad_environment_spatial_sensitivity.R
      - scripts/run_environment_interaction_inla_screen.R
      - analysis_sensitivity/broad_environment_variable_literature_audit_2026-08-11.md
      - analysis_sensitivity/broad_environment_spatial_finalization_spec_2026-08-11.md
      - config/raster_sources.csv
      - source_build/download_rasters.R
      - source_build/prepare_rasters.R
      - dependencies/**
      - paper/active-file-map.csv
      - scripts/README.md

permissions:
  contents: read
  actions: read

concurrency:
  group: broad-environment-spatial-finalization-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"

jobs:
  joint-adjudication:
    name: Joint seasonality interaction adjudication
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing,reporting

      - name: Restore checksum-locked broad-analysis evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/current-broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/current-broad-reference.zip
          actual="$(sha256sum /tmp/current-broad-reference.zip | awk '{print $1}')"
          [[ "$actual" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/current-broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv

      - name: Run narrow exact joint adjudication
        shell: bash
        run: |
          set -euo pipefail
          python3 analysis_sensitivity/run_environment_interaction_joint_adjudication.py \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --output-dir results/environment_interaction_joint_adjudication/conditional_intensity \
            --bootstrap-reps 4000 \
            --seed 20260813

      - name: Verify adjudication
        shell: bash
        run: |
          set -euo pipefail
          root=results/environment_interaction_joint_adjudication/conditional_intensity
          test -s "$root/validation.json"
          test -s "$root/joint_adjudication_index.json"
          grep -q '"status": "PASS"' "$root/validation.json"
          grep -q '"status": "PASS"' "$root/joint_adjudication_index.json"

      - uses: actions/upload-artifact@v4
        with:
          name: broad-finalization-joint-${{ github.sha }}-${{ github.run_id }}
          path: results/environment_interaction_joint_adjudication
          if-no-files-found: error
          retention-days: 90

  environment-spatial:
    name: Hydroclimate and spatial sensitivity — ${{ matrix.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        outcome:
          - pigmentation_state
          - conditional_intensity

    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore raster cache
        uses: actions/cache@v4
        with:
          path: data/cache/rasters
          key: broad-finalization-rasters-${{ hashFiles('config/raster_sources.csv', 'config/pipeline.yml', 'R/raster_sources.R') }}
          restore-keys: |
            current-paper-rasters-
            raw-sources-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,acquisition,figures,testing,reporting

      - name: Restore checksum-locked broad-analysis evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/current-broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/current-broad-reference.zip
          actual="$(sha256sum /tmp/current-broad-reference.zip | awk '{print $1}')"
          [[ "$actual" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/current-broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv

      - name: Materialize VPD and site-water-balance predictors
        shell: bash
        run: |
          set -euo pipefail
          Rscript source_build/download_rasters.R \
            --only chelsa_vpdmean,chelsa_swb
          Rscript source_build/prepare_rasters.R \
            --only chelsa_vpdmean,chelsa_swb \
            --no-download
          find data/processed/rasters -type f | sort

      - name: Fit hydroclimate and spatial sensitivities
        shell: bash
        run: |
          set -euo pipefail
          Rscript analysis_sensitivity/run_broad_environment_spatial_sensitivity.R \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --processed-dir data/processed/rasters \
            --outcome "${{ matrix.outcome }}" \
            --output-dir "results/broad_environment_spatial_finalization/${{ matrix.outcome }}" \
            --bootstrap-reps 4000 \
            --barrier-range-fraction 0.2 \
            --seed 20260814

      - name: Verify response sensitivity
        shell: bash
        run: |
          set -euo pipefail
          root="results/broad_environment_spatial_finalization/${{ matrix.outcome }}"
          test -s "$root/validation.json"
          test -s "$root/model_comparison_summary.csv"
          test -s "$root/barrier_diagnostics.csv"
          grep -q '"status": "PASS"' "$root/validation.json"

      - uses: actions/upload-artifact@v4
        with:
          name: broad-finalization-${{ matrix.outcome }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/broad_environment_spatial_finalization/${{ matrix.outcome }}
            data/processed/raster_download_manifest.csv
            data/processed/raster_manifest.csv
          if-no-files-found: error
          retention-days: 90

  aggregate:
    name: Combine broad finalization evidence
    needs:
      - joint-adjudication
      - environment-spatial
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: broad-finalization-*-${{ github.sha }}-${{ github.run_id }}
          path: combined
          merge-multiple: false

      - name: Validate combined evidence
        shell: bash
        run: |
          set -euo pipefail
          find combined -type f -printf '%p\t%s\n' | sort > combined/file_inventory.tsv
          [[ "$(find combined -name validation.json | wc -l)" -eq 3 ]]
          while read -r validation; do
            grep -q '"status": "PASS"' "$validation"
          done < <(find combined -name validation.json | sort)
          cat > combined/README.md <<EOF
          # Broad environment/spatial finalization evidence

          This artifact combines:
          1. the narrow exact joint adjudication of the two temperature-seasonality candidates;
          2. VPD/SWB hydroclimate-completeness sensitivities for both response parts; and
          3. stationary-versus-coastline-barrier SPDE and East/West-factor sensitivities.

          The current manuscript model and the separate cell-level local-departure reference are not replaced automatically. Final model adoption requires explicit evidence review and a subsequent manuscript/SI update.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: broad-environment-spatial-finalization-combined-${{ github.sha }}-${{ github.run_id }}
          path: combined
          if-no-files-found: error
          retention-days: 90
