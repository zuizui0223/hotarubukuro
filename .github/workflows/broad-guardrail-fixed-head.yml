name: Run unresolved Broad guardrails on fixed head

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/broad-guardrail-fixed-head.yml
      - analysis_sensitivity/run_broad_environment_spatial_audit_wrapper.R
      - scripts/run_broad_environment_spatial_audit.R
      - dependencies/**

permissions:
  contents: read
  actions: read

concurrency:
  group: broad-guardrail-fixed-head-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  RASTER_ARTIFACT_ID: "9089127725"
  RASTER_ARTIFACT_SHA256: "a32d0b19d021a8caac9c73083c62efcaca7082ee22143bbe946f14f6fee9f438"

jobs:
  fit:
    name: Unresolved Broad guardrails — ${{ matrix.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        outcome: [pigmentation_state, conditional_intensity]

    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing

      - name: Restore checksum-locked broad evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/reference.zip
          [[ "$(sha256sum /tmp/reference.zip | awk '{print $1}')" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv
          test -s reference-artifact/results/ecological_v19_human_landscape_extremes/landscape_cell_features.csv

      - name: Restore frozen omitted-variable rasters
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RASTER_ARTIFACT_ID}/zip" \
            -o /tmp/rasters.zip
          [[ "$(sha256sum /tmp/rasters.zip | awk '{print $1}')" == "$RASTER_ARTIFACT_SHA256" ]]
          mkdir -p raster-artifact data/processed/rasters
          unzip -q /tmp/rasters.zip -d raster-artifact
          find raster-artifact -type f -name '*.tif' -exec cp -f {} data/processed/rasters/ \;
          for raster in chelsa_bio06.tif chelsa_bio13.tif chelsa_vpdmean.tif chelsa_swb.tif elevation_30s.tif; do
            test -s "data/processed/rasters/${raster}"
          done

      - name: Run pruned exact guardrail grid
        shell: bash
        run: |
          set -euo pipefail
          Rscript analysis_sensitivity/run_broad_environment_spatial_audit_wrapper.R \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --landscape-csv reference-artifact/results/ecological_v19_human_landscape_extremes/landscape_cell_features.csv \
            --raster-dir data/processed/rasters \
            --outcome "${{ matrix.outcome }}" \
            --output-dir results/broad_environment_spatial_audit \
            --bootstrap-reps 4000 \
            --seed 20260814

      - name: Verify output
        shell: bash
        run: |
          set -euo pipefail
          root="results/broad_environment_spatial_audit/${{ matrix.outcome }}"
          test -s "$root/validation.json"
          test -s "$root/environment_model_decision_table.csv"
          test -s "$root/spatial_model_decision_table.csv"
          ! grep -q '"status": "FAIL"' "$root/validation.json"

      - name: Record provenance
        shell: bash
        run: |
          set -euo pipefail
          root="results/broad_environment_spatial_audit/${{ matrix.outcome }}"
          cat > "$root/fixed_head_provenance.txt" <<EOF
          workflow=broad-guardrail-fixed-head
          workflow_run=${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          outcome=${{ matrix.outcome }}
          reference_artifact_id=${REFERENCE_ARTIFACT_ID}
          reference_artifact_sha256=${REFERENCE_ARTIFACT_SHA256}
          raster_artifact_id=${RASTER_ARTIFACT_ID}
          raster_artifact_sha256=${RASTER_ARTIFACT_SHA256}
          fitted_guardrails=BIO6;BIO13;forest;coast;DOY_year;image_QC;full_extension;cell_1km_IID
          frozen_cell_natural_reference_replaced=false
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: broad-guardrail-fixed-${{ matrix.outcome }}-${{ github.sha }}-${{ github.run_id }}
          path: results/broad_environment_spatial_audit/${{ matrix.outcome }}
          if-no-files-found: error
          retention-days: 90
