name: Archived completed Broad guardrail run

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broad-guardrail-fixed-head-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archived:
    name: Reuse completed Broad guardrail evidence
    runs-on: ubuntu-24.04
    steps:
      - name: Record completed evidence
        shell: bash
        run: |
          echo "The full unresolved Broad guardrail grid already completed successfully."
          echo "workflow_run=31463089305"
          echo "state_artifact=9091052962"
          echo "state_digest=sha256:2e690ab88ecde13fa06b44dfc82489d3ad463c4c58abb15a9a333eb8bc941c91"
          echo "intensity_artifact=9090999043"
          echo "intensity_digest=sha256:7e023c816d412e109f2041a8a84481da75336dd16207740c95f88290b4e0f53e"
          echo "Do not re-fit the completed grid on this execution-only PR."
