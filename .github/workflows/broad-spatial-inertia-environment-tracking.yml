name: Broad space-null phenotype excess

on:
  workflow_dispatch:
  push:
    branches:
      - agent/broad-spatial-inertia-environment-tracking
    paths:
      - .github/workflows/broad-spatial-inertia-environment-tracking.yml
      - scripts/fit_broad_space_null_phenotype_excess.R

permissions:
  contents: read
  actions: read

concurrency:
  group: broad-space-null-phenotype-excess-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  EXCESS_POSTERIOR_SAMPLES: "500"
  EXCESS_SEED: "20260725"
  EXCESS_MAX_PAIRS_PER_FOLD: "15000"
  EXCESS_GEO_BINS: "5"

jobs:
  fit:
    name: Cross-fitted space-null excess test
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: broad-excess-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            broad-tracking-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R analysis environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility/broad_space_null_excess
          --scopes analysis,reproducibility

      - name: Download frozen active Broad reference artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/broad-reference.zip
          actual="$(sha256sum /tmp/broad-reference.zip | awk '{print $1}')"
          test "$actual" = "$REFERENCE_ARTIFACT_SHA256"
          mkdir -p reference-artifact
          unzip -q /tmp/broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv
          echo "reference_zip_sha256=${actual}" | tee reference-artifact/reference_lock.txt

      - name: Fit cross-fitted space null and test phenotype excess
        shell: bash
        run: |
          set -uo pipefail
          out=results/broad_space_null_phenotype_excess
          mkdir -p "$out"
          Rscript scripts/fit_broad_space_null_phenotype_excess.R \
            --cells=reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv \
            --output="$out" \
            --samples=${EXCESS_POSTERIOR_SAMPLES} \
            --seed=${EXCESS_SEED} \
            --max-pairs-per-fold=${EXCESS_MAX_PAIRS_PER_FOLD} \
            --geo-bins=${EXCESS_GEO_BINS}
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "R runner returned $status; accepting only the known post-computation metadata-row mismatch when all scientific outputs exist."
            for f in primary_space_null_excess_test.csv matched_distance_stratum_contrasts.csv heldout_pair_space_null_excess.csv secondary_pair_diagnostics.csv heldout_space_null_predictions.csv; do
              test -s "$out/$f" || exit "$status"
            done
          fi
          python3 - <<'PY'
          import csv, os
          from pathlib import Path
          root = Path('results/broad_space_null_phenotype_excess')
          rows = [
              ('analysis', 'broad_cross_fitted_space_null_phenotype_excess'),
              ('source_cells', 'reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv'),
              ('space_null', 'intercept + Matern SPDE only'),
              ('cross_fitting', 'each tested pair lies wholly inside a held-out geographical fold'),
              ('spatial_folds', '1;2;3;4;5'),
              ('posterior_samples', os.environ['EXCESS_POSTERIOR_SAMPLES']),
              ('seed', os.environ['EXCESS_SEED']),
              ('max_pairs_per_fold', os.environ['EXCESS_MAX_PAIRS_PER_FOLD']),
              ('geographic_distance_bins', os.environ['EXCESS_GEO_BINS']),
              ('environment_terms', 'broad_pc1_climate_50km;broad_pc1_aridity_50km;broad_pc1_topography_50km;within_pc1_climate_50km;within_pc1_aridity_50km;within_pc1_topography_50km'),
              ('environment_distance', 'Euclidean distance in the frozen response-blind environmental basis, scaled on each training fold'),
              ('primary_estimand', 'mean across fold-by-geographic-distance strata of observed(high-environment - low-environment phenotype divergence), compared with the same statistic under cross-fitted space-only posterior prediction'),
              ('claim_boundary', 'F_ST/P_ST-inspired non-genetic null test; not F_ST, P_ST, Q_ST, drift, selection, or local adaptation'),
          ]
          with (root/'analysis_metadata.csv').open('w', newline='') as f:
              w = csv.writer(f)
              w.writerow(['field','value'])
              w.writerows(rows)
          PY

      - name: Validate output contract
        shell: bash
        run: |
          set -euo pipefail
          out=results/broad_space_null_phenotype_excess
          for f in primary_space_null_excess_test.csv matched_distance_stratum_contrasts.csv heldout_pair_space_null_excess.csv secondary_pair_diagnostics.csv heldout_space_null_predictions.csv analysis_metadata.csv; do
            test -s "$out/$f"
          done
          python3 - <<'PY'
          import csv
          from pathlib import Path
          root = Path('results/broad_space_null_phenotype_excess')
          primary = list(csv.DictReader((root/'primary_space_null_excess_test.csv').open()))
          assert len(primary) == 2, len(primary)
          assert {r['response'] for r in primary} == {'pigmentation_state', 'conditional_intensity'}
          for r in primary:
              p = float(r['posterior_predictive_p_upper'])
              assert 0 <= p <= 1
              assert int(float(r['n_fold_geo_strata'])) == 25
          pairs = list(csv.DictReader((root/'heldout_pair_space_null_excess.csv').open()))
          assert len(pairs) > 0
          assert {r['response'] for r in pairs} == {'pigmentation_state', 'conditional_intensity'}
          print('validated primary rows:', len(primary), 'pair rows:', len(pairs))
          PY

      - name: Write concise result summary
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path
          root = Path('results/broad_space_null_phenotype_excess')
          rows = list(csv.DictReader((root/'primary_space_null_excess_test.csv').open()))
          lines = ['# Broad cross-fitted space-null phenotype excess', '']
          for r in rows:
              p = float(r['posterior_predictive_p_upper'])
              directional = p < 0.05 and float(r['observed_contrast']) > float(r['space_null_median'])
              lines.append(
                  f"- {r['response']}: observed high-minus-low environmental divergence contrast="
                  f"{float(r['observed_contrast']):.6f}; space-null median={float(r['space_null_median']):.6f}; "
                  f"central 95% null=[{float(r['space_null_q025']):.6f}, {float(r['space_null_q975']):.6f}]; "
                  f"excess={float(r['phenotype_excess_over_space_null']):.6f}; "
                  f"one-sided posterior-predictive p_upper={p:.6f}; "
                  f"directional_5pct_excess={str(directional).upper()}"
              )
          lines += ['', 'Primary question: at matched geographic separation, do environmentally dissimilar held-out pairs show more phenotype divergence than a cross-fitted space-only SPDE null predicts?', '', 'The p_upper test is directional (high-environment divergence > low-environment divergence). The stored q025/q975 interval is the central 95% null interval and therefore uses a 97.5% upper endpoint; it is not the cutoff for the one-sided 5% test.', '', 'This is F_ST/P_ST-inspired only; the space null is unresolved geography, not neutral genetic F_ST, and the test does not demonstrate selection or local adaptation.']
          (root/'RESULT_SUMMARY.md').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          mkdir -p results/broad_space_null_phenotype_excess
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "reference_artifact_id=${REFERENCE_ARTIFACT_ID}"
            echo "reference_artifact_sha256=${REFERENCE_ARTIFACT_SHA256}"
            echo "posterior_samples=${EXCESS_POSTERIOR_SAMPLES}"
            echo "seed=${EXCESS_SEED}"
            echo "max_pairs_per_fold=${EXCESS_MAX_PAIRS_PER_FOLD}"
            echo "geo_bins=${EXCESS_GEO_BINS}"
          } > results/broad_space_null_phenotype_excess/workflow_provenance.txt

      - name: Upload Broad space-null results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-space-null-phenotype-excess-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/broad_space_null_phenotype_excess
            reproducibility/broad_space_null_excess
            reference-artifact/reference_lock.txt
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
