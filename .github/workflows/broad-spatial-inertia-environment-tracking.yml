name: Broad space-null phenotype excess — legacy four-PC basis

on:
  workflow_dispatch:
  push:
    branches:
      - agent/broad-spatial-inertia-environment-tracking
    paths:
      - .github/workflows/broad-spatial-inertia-environment-tracking.yml
      - scripts/fit_broad_space_null_phenotype_excess.R
      - scripts/run_broad_space_null_phenotype_excess_pipeline.R

permissions:
  contents: read
  actions: read

concurrency:
  group: broad-space-null-phenotype-excess-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  EXCESS_POSTERIOR_SAMPLES: "500"
  EXCESS_SEED: "20260725"
  EXCESS_MAX_PAIRS_PER_FOLD: "15000"
  EXCESS_GEO_BINS: "5"

jobs:
  fit:
    name: Cross-fitted legacy four-PC space-null excess test
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: broad-excess-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            broad-tracking-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R analysis environment
        shell: bash
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility/broad_space_null_excess
          --scopes analysis,reproducibility

      - name: Restore checksum-locked Broad reference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/broad-reference.zip
          actual="$(sha256sum /tmp/broad-reference.zip | awk '{print $1}')"
          test "$actual" = "$REFERENCE_ARTIFACT_SHA256"
          mkdir -p reference-artifact
          unzip -q /tmp/broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv
          echo "reference_zip_sha256=${actual}" > reference-artifact/reference_lock.txt

      - name: Fit and validate the legacy four-PC space-null result
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/run_broad_space_null_phenotype_excess_pipeline.R \
            --cells=reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv \
            --output=results/broad_space_null_phenotype_excess \
            --samples=${EXCESS_POSTERIOR_SAMPLES} \
            --seed=${EXCESS_SEED} \
            --max-pairs-per-fold=${EXCESS_MAX_PAIRS_PER_FOLD} \
            --geo-bins=${EXCESS_GEO_BINS}

      - name: Validate output and implemented basis
        shell: bash
        run: |
          set -euo pipefail
          out=results/broad_space_null_phenotype_excess
          for file in \
            primary_space_null_excess_test.csv \
            matched_distance_stratum_contrasts.csv \
            heldout_pair_space_null_excess.csv \
            secondary_pair_diagnostics.csv \
            heldout_space_null_predictions.csv \
            analysis_metadata.csv \
            RESULT_SUMMARY.md; do
            test -s "$out/$file"
          done
          python3 - "$out" <<'PY'
          import csv, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          with (root / 'primary_space_null_excess_test.csv').open(newline='', encoding='utf-8') as handle:
              primary = list(csv.DictReader(handle))
          assert len(primary) == 2
          assert {r['response'] for r in primary} == {'pigmentation_state', 'conditional_intensity'}
          assert all(int(float(r['n_fold_geo_strata'])) == 25 for r in primary)

          with (root / 'analysis_metadata.csv').open(newline='', encoding='utf-8') as handle:
              metadata = {r['field']: r['value'] for r in csv.DictReader(handle)}
          assert metadata['analysis'].endswith('legacy4')
          terms = metadata['environment_terms'].split(';')
          assert terms == [
              'broad50km_pc1', 'broad50km_pc2',
              'within50km_pc1', 'within50km_pc2'
          ], terms
          assert 'legacy' in metadata['claim_boundary'].lower()
          print('validated legacy four-PC basis and two response rows')
          PY

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          mkdir -p results/broad_space_null_phenotype_excess
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "reference_artifact_id=${REFERENCE_ARTIFACT_ID}"
            echo "reference_artifact_sha256=${REFERENCE_ARTIFACT_SHA256}"
            echo "posterior_samples=${EXCESS_POSTERIOR_SAMPLES}"
            echo "seed=${EXCESS_SEED}"
            echo "max_pairs_per_fold=${EXCESS_MAX_PAIRS_PER_FOLD}"
            echo "geo_bins=${EXCESS_GEO_BINS}"
            echo "environment_basis=legacy4_multiscale_pcs"
          } > results/broad_space_null_phenotype_excess/workflow_provenance.txt

      - name: Upload Broad legacy four-PC result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-space-null-legacy4-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/broad_space_null_phenotype_excess
            reproducibility/broad_space_null_excess
            reference-artifact/reference_lock.txt
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
