name: Publish Broad supported environmental distance

on:
  workflow_dispatch:
  push:
    branches:
      - agent/broad-supported-environment-distance-clean
    paths:
      - .github/workflows/broad-supported-environment-distance-publish.yml
      - scripts/fit_broad_supported_environment_distance.R
      - reproducibility/broad_supported_environment_distance_2026-08-19.md

permissions:
  contents: write
  actions: read

concurrency:
  group: broad-supported-environment-distance-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"

jobs:
  run-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install system and R environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends
          Rscript scripts/setup_r_environment.R \
            --report-dir reproducibility/broad_supported_environment_distance_publish_environment \
            --scopes analysis,reproducibility

      - name: Restore checksum-locked Broad evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/broad-reference.zip
          test "$(sha256sum /tmp/broad-reference.zip | awk '{print $1}')" = "$REFERENCE_ARTIFACT_SHA256"
          mkdir -p reference-artifact
          unzip -q /tmp/broad-reference.zip -d reference-artifact

      - name: Execute supported environmental-distance analysis
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/fit_broad_supported_environment_distance.R \
            --observations=reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --cells=reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv \
            --output=results/broad_supported_environment_distance \
            --samples=500 \
            --seed=20260725 \
            --max-pairs-per-fold=15000 \
            --geo-bins=5

      - name: Write concise result record
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path
          src = Path('results/broad_supported_environment_distance/primary_supported_environment_distance_test.csv')
          rows = list(csv.DictReader(src.open(encoding='utf-8')))
          assert len(rows) == 2
          out = Path('reproducibility/broad_supported_environment_distance_result_2026-08-19.md')
          lines = [
              '# Result — supported environmental distance versus spatial continuity',
              '',
              'The final environment + SPDE models were not refitted. They only fixed the supported term sets used to calculate unweighted environmental distance.',
              '',
              '| Response | Supported terms | Observed contrast | Space-null median | Excess | One-sided P |',
              '|---|---|---:|---:|---:|---:|',
          ]
          for r in rows:
              terms = r['supported_environment_terms'].replace(';', ', ')
              lines.append(
                  f"| {r['response']} | {terms} | {float(r['observed_contrast']):.6f} | "
                  f"{float(r['space_null_median']):.6f} | "
                  f"{float(r['phenotype_excess_over_space_null']):+.6f} | "
                  f"{float(r['posterior_predictive_p_upper']):.6f} |"
              )
          lines += [
              '',
              'Design: five held-out geographical folds, five geographical-distance strata per fold, up to 15,000 pairs per fold and 500 posterior-predictive maps from an intercept + stationary Matérn SPDE.',
              '',
              f"Workflow run: `{__import__('os').environ['GITHUB_RUN_ID']}`.",
              '',
              'Interpretation ceiling: this is an unsigned supporting comparison. Direction comes from the accepted final-model coefficients; the test does not establish selection, adaptation, genetics, drift, plasticity or direct physiology.',
          ]
          out.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(out.read_text())
          PY

      - name: Commit result record
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reproducibility/broad_supported_environment_distance_result_2026-08-19.md
          if git diff --cached --quiet; then
            echo "Result record unchanged."
            exit 0
          fi
          git commit -m "Record supported environmental-distance result [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
