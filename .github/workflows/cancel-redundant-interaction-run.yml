name: Cancel redundant interaction rerun

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: environment-interaction-inla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-redundant:
    if: ${{ github.head_ref == 'agent/broad-environment-spatial-finalization' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'The exact interaction artifacts are already frozen; cancel the redundant rerun.'
