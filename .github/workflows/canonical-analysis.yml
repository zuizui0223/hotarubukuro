name: Canonical analysis reproduction

# Canonical analysis reproduction.
#
# Starts from the immutable, checksummed analysis-input snapshot published as a
# GitHub Release asset and runs the established publication pipeline exactly as
# scripts/run_publication_pipeline.R defines it: the natural predictive model,
# local Bombus turnover, human-landscape features, the local pigmented-isolate
# definition, human context, the DID sensitivity, the publication lock, the
# independent validation, the claim audit, and the manuscript figures.
#
# This workflow must be reliable on a clean GitHub-hosted runner. It does not
# contact any external scientific data service; everything it consumes is either
# in the repository or in the checksummed snapshot.

# Triggering: workflow_dispatch once this workflow file is on the default
# branch, and, before then, by adding the `run-canonical-analysis` label to the
# pull request. Label gating keeps an expensive numerical run deliberate instead
# of firing on every push.

on:
  workflow_dispatch:
    inputs:
      pipeline_mode:
        description: run_publication_pipeline.R mode (full, extensions, verify)
        type: string
        required: false
        default: full
      build_figures:
        description: Build the manuscript figures after the pipeline
        type: string
        required: false
        default: "true"
  pull_request:
    types: [labeled]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: canonical-analysis-${{ github.ref }}
  cancel-in-progress: false

env:
  SNAPSHOT_DIR: ${{ github.workspace }}/reproduction_inputs/snapshot
  STATUS_DIR: ${{ github.workspace }}/reproduction_status
  REPORT_DIR: ${{ github.workspace }}/reproducibility
  PIPELINE_MODE: ${{ inputs.pipeline_mode || 'full' }}
  BUILD_FIGURES: ${{ inputs.build_figures || 'true' }}
  HOTARUBUKURO_MLIT_CACHE: ${{ github.workspace }}/reproduction_inputs/mlit_l03_2021
  HOTARUBUKURO_DID_CACHE: ${{ github.workspace }}/reproduction_inputs/mlit_did_2015

jobs:
  canonical:
    name: Canonical analysis
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-canonical-analysis'
    runs-on: ubuntu-24.04
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      # Speed only. The restore is fully determined by the pinned CRAN snapshot
      # and dependencies/inla.csv, so an empty cache changes the run time and
      # nothing else.
      - name: Restore the R library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}

      - name: Restore the declared R environment
        run: Rscript scripts/setup_r_environment.R --report-dir "$REPORT_DIR" --scopes analysis,reproducibility,testing,figures,reporting

      - name: Restore the canonical analysis-input snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/canonical_snapshot.sh restore inputs/canonical_snapshot.json "$SNAPSHOT_DIR"

      - name: Run the established publication pipeline
        run: bash scripts/run_canonical_analysis.sh

      - name: Summarise the primary result
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "## Canonical analysis reproduction"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- pipeline mode: ${PIPELINE_MODE}"
            echo
            if [[ -s "${STATUS_DIR}/validation_summary.txt" ]]; then
              echo '```text'
              cat "${STATUS_DIR}/validation_summary.txt"
              echo '```'
            else
              echo "No validation summary was produced."
            fi
            echo
            if [[ -s results/final_analysis_pipeline/final_stage_manifest.csv ]]; then
              echo '### Stage manifest'
              echo '```csv'
              cut -d, -f1,2,4 results/final_analysis_pipeline/final_stage_manifest.csv
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record run provenance
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$STATUS_DIR"
          {
            echo "workflow=canonical-analysis"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "r_version=$(tr -d '[:space:]' < dependencies/r-version.txt)"
            echo "pipeline_mode=${PIPELINE_MODE}"
          } > "${STATUS_DIR}/run_provenance.txt"
          find results reproducibility -type f -printf '%p\t%s\n' 2>/dev/null \
            | sort > "${STATUS_DIR}/result_inventory.tsv"

      - name: Upload results, manifests, and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-analysis-${{ github.sha }}-${{ github.run_id }}
          path: |
            reproducibility
            reproduction_status
            results/final_analysis_pipeline
            results/ecological_v16_predictive_replication
            results/ecological_v17_local_pair_turnover
            results/ecological_v19_human_landscape_extremes
            results/ecological_v20_local_white_isolates
            results/ecological_v21_local_human_neighbourhood
            results/ecological_v22_did_human_context
            manuscript/figures
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
