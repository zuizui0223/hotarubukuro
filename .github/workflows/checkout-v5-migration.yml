name: One-time checkout v5 blob migration

on:
  push:
    branches:
      - agent/repository-cleanup-legacy
    paths:
      - .github/workflows/checkout-v5-migration.yml

permissions:
  contents: write

jobs:
  prepare-blobs:
    if: github.ref_name == 'agent/repository-cleanup-legacy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace only checkout v4 references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          temporary_name = 'checkout-v5-migration.yml'
          changed = []
          replacements = 0
          for path in sorted(root.glob('*.yml')):
              if path.name == temporary_name:
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count('actions/checkout@v4')
              if count:
                  path.write_text(
                      text.replace('actions/checkout@v4', 'actions/checkout@v5'),
                      encoding='utf-8',
                  )
                  changed.append(str(path))
                  replacements += count

          expected = {
              '.github/workflows/bombus-local-sharp-transition.yml',
              '.github/workflows/bombus-occurrence-reference-support.yml',
              '.github/workflows/bombus-spatial-replication-test.yml',
              '.github/workflows/final-paper-analysis.yml',
              '.github/workflows/jbi-submission-format.yml',
              '.github/workflows/paper-checks.yml',
              '.github/workflows/reanalysis-current-inputs.yml',
              '.github/workflows/rebuild-bombus-sdm.yml',
              '.github/workflows/yamap-public-database-benchmark.yml',
              '.github/workflows/yamap-public-database-overlap-audit.yml',
          }
          if set(changed) != expected:
              raise SystemExit(
                  'Unexpected checkout migration file set. '
                  f'expected={sorted(expected)} observed={changed}'
              )
          if replacements != 12:
              raise SystemExit(
                  f'Expected 12 checkout replacements; observed {replacements}'
              )
          stale = [
              str(path) for path in root.glob('*.yml')
              if path.name != temporary_name and
              'actions/checkout@v4' in path.read_text(encoding='utf-8')
          ]
          if stale:
              raise SystemExit('checkout@v4 remains in: ' + ', '.join(stale))
          Path('/tmp/checkout-v5-paths.txt').write_text(
              '\n'.join(changed) + '\n', encoding='utf-8'
          )
          print(f'Updated {len(changed)} workflows with {replacements} replacements.')
          PY

      - name: Validate the exact diff scope
        shell: bash
        run: |
          set -euo pipefail
          git diff -- .github/workflows > /tmp/checkout-v5.patch
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('/tmp/checkout-v5.patch').read_text(encoding='utf-8')
          current = None
          forbidden = []
          for line in patch.splitlines():
              if line.startswith('diff --git '):
                  current = line.split(' b/', 1)[1]
                  continue
              if not line.startswith(('+', '-')) or line.startswith(('+++', '---')):
                  continue
              payload = line[1:].strip()
              if payload in {
                  '- uses: actions/checkout@v4',
                  'uses: actions/checkout@v4',
                  '- uses: actions/checkout@v5',
                  'uses: actions/checkout@v5',
              }:
                  continue
              forbidden.append(f'{current}: {line}')
          if forbidden:
              raise SystemExit(
                  'Unexpected migration diff lines: ' + ' | '.join(forbidden)
              )
          PY

      - name: Create detached Git blobs for the migrated workflows
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          paths = [
              line.strip()
              for line in Path('/tmp/checkout-v5-paths.txt').read_text(
                  encoding='utf-8'
              ).splitlines()
              if line.strip()
          ]
          mapping = []
          for path_string in paths:
              content = Path(path_string).read_bytes()
              payload = json.dumps({
                  'content': base64.b64encode(content).decode('ascii'),
                  'encoding': 'base64',
              }).encode('utf-8')
              request = Request(
                  f'https://api.github.com/repos/{repository}/git/blobs',
                  data=payload,
                  method='POST',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'hotarubukuro-checkout-v5-migration',
                  },
              )
              with urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode('utf-8'))
              mapping.append({
                  'path': path_string,
                  'mode': '100644',
                  'type': 'blob',
                  'sha': result['sha'],
              })
          Path('checkout-v5-blob-map.json').write_text(
              json.dumps(mapping, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(json.dumps(mapping, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: checkout-v5-blob-map-${{ github.sha }}-${{ github.run_id }}
          path: checkout-v5-blob-map.json
          if-no-files-found: error
          retention-days: 1
