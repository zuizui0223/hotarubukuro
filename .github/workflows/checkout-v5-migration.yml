name: One-time checkout v5 migration

on:
  push:
    branches:
      - agent/repository-cleanup-legacy
    paths:
      - .github/workflows/checkout-v5-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref_name == 'agent/repository-cleanup-legacy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Replace only checkout v4 references and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          changed = []
          replacements = 0
          for path in sorted(root.glob('*.yml')):
              if path.name == 'checkout-v5-migration.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              count = text.count('actions/checkout@v4')
              if count:
                  updated = text.replace('actions/checkout@v4', 'actions/checkout@v5')
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
                  replacements += count

          expected = {
              '.github/workflows/bombus-local-sharp-transition.yml',
              '.github/workflows/bombus-occurrence-reference-support.yml',
              '.github/workflows/bombus-spatial-replication-test.yml',
              '.github/workflows/final-paper-analysis.yml',
              '.github/workflows/jbi-submission-format.yml',
              '.github/workflows/paper-checks.yml',
              '.github/workflows/reanalysis-current-inputs.yml',
              '.github/workflows/rebuild-bombus-sdm.yml',
              '.github/workflows/yamap-public-database-benchmark.yml',
              '.github/workflows/yamap-public-database-overlap-audit.yml',
          }
          if set(changed) != expected:
              raise SystemExit(
                  'Unexpected checkout migration file set. '
                  f'expected={sorted(expected)} observed={changed}'
              )
          if replacements != 11:
              raise SystemExit(
                  f'Expected 11 checkout replacements; observed {replacements}'
              )
          stale = [
              str(path) for path in root.glob('*.yml')
              if 'actions/checkout@v4' in path.read_text(encoding='utf-8')
          ]
          if stale:
              raise SystemExit('checkout@v4 remains in: ' + ', '.join(stale))
          print(f'Updated {len(changed)} workflows with {replacements} replacements.')
          PY

          rm .github/workflows/checkout-v5-migration.yml

          # Guard the exact scope of the one-time migration. Besides this
          # workflow deleting itself, every changed line must be checkout v4/v5.
          git diff -- .github/workflows > /tmp/checkout-v5.patch
          python3 - <<'PY'
          from pathlib import Path

          patch = Path('/tmp/checkout-v5.patch').read_text(encoding='utf-8')
          forbidden = []
          for line in patch.splitlines():
              if not line.startswith(('+', '-')) or line.startswith(('+++', '---')):
                  continue
              if 'checkout-v5-migration.yml' in patch:
                  # The whole temporary file is expected to disappear.
                  pass
              if line in ('-      - uses: actions/checkout@v4',
                          '+      - uses: actions/checkout@v5'):
                  continue
              # Permit all removed lines belonging to the temporary workflow;
              # no added line from that file is allowed.
              if line.startswith('-'):
                  continue
              forbidden.append(line)
          if forbidden:
              raise SystemExit(
                  'Unexpected added migration diff lines: ' + ' | '.join(forbidden)
              )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows
          git commit -m 'Upgrade active checkout actions to v5'
          git push origin "HEAD:${GITHUB_REF_NAME}"
