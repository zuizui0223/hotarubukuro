name: Compact final JBI abstract
on:
  push:
    branches: [agent/human-context-final-audit]
    paths:
      - .github/workflows/compact-final-jbi-abstract.yml
      - analysis_sensitivity/compact_final_jbi_abstract.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/human-context-final-audit
          fetch-depth: 0
      - run: python3 analysis_sensitivity/compact_final_jbi_abstract.py
      - run: python3 submission/jbi/validate_jbi_submission.py
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- submission/jbi/JBI_main_manuscript_anonymized.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add submission/jbi/JBI_main_manuscript_anonymized.md
          git commit -m 'Compact final JBI abstract'
          git push origin HEAD:agent/human-context-final-audit
