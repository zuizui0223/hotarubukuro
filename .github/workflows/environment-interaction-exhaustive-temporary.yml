name: Temporary complete environmental pairwise audit

on:
  push:
    branches:
      - agent/environment-interaction-exhaustive-pairwise
    paths:
      - .github/workflows/environment-interaction-exhaustive-temporary.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: environment-interaction-exhaustive-temporary-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"

jobs:
  exhaustive-pairwise:
    name: Complete 28-pair INLA audit — ${{ matrix.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        outcome:
          - pigmentation_state
          - conditional_intensity

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing,reporting

      - name: Restore checksum-locked broad-analysis evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/current-broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/current-broad-reference.zip
          actual="$(sha256sum /tmp/current-broad-reference.zip | awk '{print $1}')"
          [[ "$actual" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/current-broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv

      - name: Generate complete 28-pair audit script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("scripts/run_environment_interaction_inla_screen.R")
          text = source.read_text(encoding="utf-8")
          registry_start = text.index("registry <- data.frame(")
          split_start = text.index("split_terms <- function")
          replacement = r'''registry <- local({
            pair_matrix <- t(utils::combn(base_terms, 2))
            short_name <- function(x) {
              gsub("[^A-Za-z0-9]+", "_", sub("^env_", "", x))
            }
            data.frame(
              interaction_id = apply(pair_matrix, 1, function(pair) {
                paste(short_name(pair), collapse = "_x_")
              }),
              term = sprintf("int_pair_%02d", seq_len(nrow(pair_matrix))),
              x = pair_matrix[, 1],
              y = pair_matrix[, 2],
              mechanism_family = "complete_pairwise_audit",
              directional_expectation = "not_preassigned",
              rationale = apply(pair_matrix, 1, function(pair) {
                paste("Complete pairwise audit of", pair[1], "and", pair[2])
              }),
              stringsAsFactors = FALSE
            )
          })

          model_registry <- rbind(
            data.frame(
              model_id = "base_additive",
              model_class = "base",
              interaction_terms = "",
              stringsAsFactors = FALSE
            ),
            data.frame(
              model_id = paste0("single_", registry$interaction_id),
              model_class = "single_interaction",
              interaction_terms = registry$term,
              stringsAsFactors = FALSE
            )
          )

          '''
          text = text[:registry_start] + replacement + text[split_start:]
          lock_needle = "lock_rows <- lapply(seq_len(nrow(lock_targets)), function(i) {"
          if text.count(lock_needle) != 1:
              raise SystemExit("Unable to locate frozen-lock evaluation point")
          filter_line = (
              "lock_targets <- lock_targets[lock_targets$outcome %in% names(outcomes), "
              ", drop = FALSE]\n"
          )
          text = text.replace(lock_needle, filter_line + lock_needle)
          target = Path("/tmp/run_environment_all_pairwise_inla_audit.R")
          target.write_text(text, encoding="utf-8")
          PY
          Rscript -e 'parse(file="/tmp/run_environment_all_pairwise_inla_audit.R")' >/dev/null

      - name: Fit complete pairwise grid
        shell: bash
        run: |
          set -euo pipefail
          Rscript /tmp/run_environment_all_pairwise_inla_audit.R \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --outcome "${{ matrix.outcome }}" \
            --output-dir "results/environment_interaction_all_pairwise/${{ matrix.outcome }}" \
            --bootstrap-reps 4000 \
            --seed 20260812

      - name: Verify exhaustive response output
        shell: bash
        run: |
          set -euo pipefail
          root="results/environment_interaction_all_pairwise/${{ matrix.outcome }}"
          test -s "$root/validation.json"
          test -s "$root/model_comparison_summary.csv"
          test -s "$root/single_interaction_summary.csv"
          test -s "$root/base_model_lock_check.csv"
          grep -q '"status": "PASS"' "$root/validation.json"
          [[ "$(awk 'END {print NR-1}' "$root/full_model_fit_metrics.csv")" -eq 29 ]]
          [[ "$(awk 'END {print NR-1}' "$root/interaction_registry.csv")" -eq 28 ]]

      - name: Record exhaustive provenance
        shell: bash
        run: |
          set -euo pipefail
          root="results/environment_interaction_all_pairwise/${{ matrix.outcome }}"
          cat > "$root/workflow_provenance.txt" <<EOF
          workflow=environment-interaction-exhaustive-temporary
          workflow_run=${GITHUB_RUN_ID}
          workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          outcome=${{ matrix.outcome }}
          reference_artifact_id=${REFERENCE_ARTIFACT_ID}
          reference_artifact_sha256=${REFERENCE_ARTIFACT_SHA256}
          pairwise_interactions=28
          candidate_models=29
          spatial_folds=5
          frozen_additive_model_replaced=false
          EOF
          find "$root" -type f -printf '%P\t%s\n' | sort > "$root/file_inventory.tsv"

      - name: Upload exhaustive response audit
        uses: actions/upload-artifact@v4
        with:
          name: environment-all-pairwise-${{ matrix.outcome }}-${{ github.sha }}-${{ github.run_id }}
          path: results/environment_interaction_all_pairwise/${{ matrix.outcome }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

  aggregate:
    name: Combine complete 28-pair audit
    needs: exhaustive-pairwise
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v5

      - name: Download both exhaustive response artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: environment-all-pairwise-*-${{ github.sha }}-${{ github.run_id }}
          path: combined/environment_interaction_all_pairwise
          merge-multiple: false

      - name: Validate and index complete pairwise evidence
        shell: bash
        run: |
          set -euo pipefail
          find combined/environment_interaction_all_pairwise -name validation.json -print | sort > combined/pairwise_validation_files.txt
          [[ "$(wc -l < combined/pairwise_validation_files.txt)" -eq 2 ]]
          while read -r validation; do
            grep -q '"status": "PASS"' "$validation"
          done < combined/pairwise_validation_files.txt
          find combined/environment_interaction_all_pairwise -type f -printf '%p\t%s\n' | sort > combined/pairwise_file_inventory.tsv
          cat > combined/PAIRWISE_README.md <<EOF
          # Complete environmental pairwise-interaction audit

          Every one of the 28 pairwise products among the eight current environmental axes was added to the frozen additive INLA-SPDE model one at a time, separately for pigmentation state and conditional intensity. Each candidate was evaluated with full-fit WAIC/CPO, the same five geographical folds and a spatial-block bootstrap of paired held-out loss.

          This is a search-space audit. Biological interpretation remains prioritized through the separately predeclared ten-interaction mechanism screen; no omitted pair is promoted solely because it ranks best among 28 tests.
          EOF

      - name: Upload combined complete pairwise audit
        uses: actions/upload-artifact@v4
        with:
          name: environment-all-pairwise-combined-${{ github.sha }}-${{ github.run_id }}
          path: combined
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
