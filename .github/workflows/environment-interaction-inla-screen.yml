name: Screen ecologically motivated environmental interactions

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/environment-interaction-inla-screen.yml
      - scripts/run_environment_interaction_inla_screen.R
      - reproducibility/environment_interaction_inla_screen_spec_2026-08-11.md
      - dependencies/**
      - paper/active-file-map.csv
      - scripts/README.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/environment-interaction-inla-screen.yml
      - scripts/run_environment_interaction_inla_screen.R
      - reproducibility/environment_interaction_inla_screen_spec_2026-08-11.md
      - dependencies/**
      - paper/active-file-map.csv
      - scripts/README.md

permissions:
  contents: read
  actions: read

concurrency:
  group: environment-interaction-inla-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"

jobs:
  fit-response:
    name: INLA-SPDE interaction screen — ${{ matrix.outcome }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        outcome:
          - pigmentation_state
          - conditional_intensity

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing,reporting

      - name: Restore checksum-locked broad-analysis evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/current-broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/current-broad-reference.zip
          actual="$(sha256sum /tmp/current-broad-reference.zip | awk '{print $1}')"
          [[ "$actual" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/current-broad-reference.zip -d reference-artifact
          test -s reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv

      - name: Fit all predeclared interaction models
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/run_environment_interaction_inla_screen.R \
            --input-csv reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --outcome "${{ matrix.outcome }}" \
            --output-dir "results/environment_interaction_inla_screen/${{ matrix.outcome }}" \
            --bootstrap-reps 4000 \
            --seed 20260811

      - name: Verify response output
        shell: bash
        run: |
          set -euo pipefail
          root="results/environment_interaction_inla_screen/${{ matrix.outcome }}"
          test -s "$root/validation.json"
          test -s "$root/model_comparison_summary.csv"
          test -s "$root/single_interaction_summary.csv"
          test -s "$root/base_model_lock_check.csv"
          grep -q '"status": "PASS"' "$root/validation.json"
          expected_models=16
          observed_models="$(awk 'END {print NR-1}' "$root/full_model_fit_metrics.csv")"
          [[ "$observed_models" -eq "$expected_models" ]]

      - name: Record response provenance
        shell: bash
        run: |
          set -euo pipefail
          root="results/environment_interaction_inla_screen/${{ matrix.outcome }}"
          cat > "$root/workflow_provenance.txt" <<EOF
          workflow=environment-interaction-inla-screen
          workflow_run=${GITHUB_RUN_ID}
          workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          branch=${GITHUB_REF_NAME}
          outcome=${{ matrix.outcome }}
          reference_artifact_id=${REFERENCE_ARTIFACT_ID}
          reference_artifact_sha256=${REFERENCE_ARTIFACT_SHA256}
          predeclared_interactions=10
          candidate_models=16
          spatial_folds=5
          frozen_additive_model_replaced=false
          EOF
          find "$root" -type f -printf '%P\t%s\n' | sort > "$root/file_inventory.tsv"

      - name: Upload response-specific interaction results
        uses: actions/upload-artifact@v4
        with:
          name: environment-interaction-${{ matrix.outcome }}-${{ github.sha }}-${{ github.run_id }}
          path: results/environment_interaction_inla_screen/${{ matrix.outcome }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 90

  aggregate:
    name: Combine environmental interaction evidence
    needs: fit-response
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Download both response artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: environment-interaction-*-${{ github.sha }}-${{ github.run_id }}
          path: combined/environment_interaction_inla_screen
          merge-multiple: false

      - name: Validate and index the combined evidence
        shell: bash
        run: |
          set -euo pipefail
          find combined/environment_interaction_inla_screen -name validation.json -print | sort > combined/validation_files.txt
          [[ "$(wc -l < combined/validation_files.txt)" -eq 2 ]]
          while read -r validation; do
            grep -q '"status": "PASS"' "$validation"
          done < combined/validation_files.txt
          find combined/environment_interaction_inla_screen -type f -printf '%p\t%s\n' | sort > combined/file_inventory.tsv
          cat > combined/README.md <<EOF
          # Combined environmental interaction INLA-SPDE screen

          This artifact contains independent response-specific screens for pigmentation state and pigmented-only conditional intensity. Each screen compares the frozen additive INLA-SPDE model with ten predeclared ecologically motivated single interactions, four mechanism bundles and one global interaction set, using full-fit WAIC/CPO plus the same five geographical folds and a spatial-block cluster bootstrap of paired predictive loss.

          No model is promoted from coefficient significance or WAIC alone, and the frozen manuscript model is not replaced automatically.
          EOF

      - name: Upload combined environmental interaction screen
        uses: actions/upload-artifact@v4
        with:
          name: environment-interaction-inla-combined-${{ github.sha }}-${{ github.run_id }}
          path: combined
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
