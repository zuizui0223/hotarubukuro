name: Final integrated paper pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-paper-analysis.yml
      - paper/**
      - submission/jbi/**
      - reproducibility/final_integrated_pipeline_2026-08-12.md
      - reproducibility/current_broad_human_primary_2026-08-12.md
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/final-paper-analysis.yml
      - paper/**
      - submission/jbi/**
      - reproducibility/final_integrated_pipeline_2026-08-12.md
      - reproducibility/current_broad_human_primary_2026-08-12.md

permissions:
  contents: read
  actions: read

env:
  BROAD_ARTIFACT_ID: "9022276431"
  BROAD_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  LOCAL_BOMBUS_ARTIFACT_ID: "9023416810"
  LOCAL_BOMBUS_ARTIFACT_SHA256: "3f7ac07ea90e2b732441a9f80a38ea49871014722d008769370524b947007e34"
  BOMB_FINAL8_AUDIT_ARTIFACT_ID: "9119773035"
  BOMB_FINAL8_AUDIT_SHA256: "51fc846d2f3d815d8bbf3c0b95647eabeb0acf731f1e6dd164c11a0dfe1b896f"
  HUMAN_CURRENT_BROAD_ARTIFACT_ID: "9119306089"
  HUMAN_CURRENT_BROAD_ARTIFACT_SHA256: "f5f7f3633d43a62fbef1f5142a77a21e766a5d85ab4f17dc43b062dadf4803c4"

jobs:
  validate-integrated-current:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Restore checksum-locked current evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          restore() {
            local id="$1" expected="$2" zip="$3" out="$4"
            rm -rf "$out" "$zip"
            mkdir -p "$out"
            curl --fail --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" \
              -o "$zip"
            [[ "$(sha256sum "$zip" | awk '{print $1}')" == "$expected" ]]
            unzip -q "$zip" -d "$out"
          }
          restore "$BROAD_ARTIFACT_ID" "$BROAD_ARTIFACT_SHA256" /tmp/broad.zip evidence/broad
          restore "$LOCAL_BOMBUS_ARTIFACT_ID" "$LOCAL_BOMBUS_ARTIFACT_SHA256" /tmp/bombus.zip evidence/bombus
          restore "$BOMB_FINAL8_AUDIT_ARTIFACT_ID" "$BOMB_FINAL8_AUDIT_SHA256" /tmp/bomb-final8.zip evidence/bombus-final8
          restore "$HUMAN_CURRENT_BROAD_ARTIFACT_ID" "$HUMAN_CURRENT_BROAD_ARTIFACT_SHA256" /tmp/human.zip evidence/human

      - name: Validate current numerical hierarchy
        shell: bash
        run: |
          set -euo pipefail
          cells=$(find evidence/broad -type f -name multiscale_hotspot_cells_1km.csv | head -n 1)
          sharp=$(find evidence/bombus -type f -name sharp_transition_summary.csv | head -n 1)
          env_audit=$(find evidence/bombus-final8 -type f -name bombus_pair_environment_distance_audit.csv | head -n 1)
          decision=$(find evidence/human -type f -name current_broad_primary_decision.csv | head -n 1)
          null=$(find evidence/human -type f -name current_broad_primary_candidate_null.csv | head -n 1)
          maxt=$(find evidence/human -type f -name current_broad_primary_human_maxT.csv | head -n 1)
          for p in "$cells" "$sharp" "$env_audit" "$decision" "$null" "$maxt"; do test -n "$p" && test -s "$p"; done

          python3 - "$cells" "$sharp" "$env_audit" "$decision" "$null" "$maxt" <<'PY'
          import csv, sys
          cells, sharp, env_audit, decision, null, maxt = sys.argv[1:]
          def rows(path):
              with open(path, encoding='utf-8') as f:
                  return list(csv.DictReader(f))

          assert len(rows(cells)) == 1305

          focal = [r for r in rows(sharp) if str(r.get('focal_strict_local_test','')).lower() in ('true','t','1')]
          assert len(focal) == 1
          r = focal[0]
          assert int(float(r['radius_km'])) == 5
          assert int(float(r['n_nonoverlapping_pairs'])) == 67
          assert abs(float(r['mean_signed_bombus_difference']) - 0.03590) < 5e-5
          assert abs(float(r['median_signed_bombus_difference']) - (-0.00277)) < 5e-5
          assert abs(float(r['proportion_positive']) - 0.493) < 5e-3
          assert abs(float(r['signflip_one_sided_p']) - 0.02716) < 5e-5

          audit = [r for r in rows(env_audit) if abs(float(r['radius_km'])-5) < 1e-9 and abs(float(r['transition_threshold'])-1) < 1e-9]
          assert len(audit) == 1
          assert int(float(audit[0]['n_nonoverlapping_pairs'])) == 67
          assert float(audit[0]['median_selected_final8']) < float(audit[0]['median_all_local_edges_final8'])

          d = rows(decision)
          assert len(d) == 1
          assert int(float(d[0]['candidate_count'])) == 16
          assert d[0]['best_population_scale'] == 'population_5km_rank'
          assert abs(float(d[0]['best_population_contrast']) - 0.06744) < 5e-5
          assert abs(float(d[0]['best_population_global_FWER']) - 0.05479) < 5e-5

          n = {r['metric']: r for r in rows(null)}
          assert abs(float(n['candidate_count']['observed_value']) - 16) < 1e-9
          assert abs(float(n['candidate_count']['null_mean']) - 13.5908) < 5e-4
          assert abs(float(n['candidate_count']['empirical_p']) - 0.27897) < 5e-5
          assert abs(float(n['candidate_fraction']['empirical_p']) - 0.12609) < 5e-5

          h = {r['feature']: r for r in rows(maxt)}
          p5 = h['population_5km_rank']
          assert abs(float(p5['observed_focal_minus_white_neighbour']) - 0.06744) < 5e-5
          assert abs(float(p5['directional_or_two_sided_p']) - 0.00800) < 5e-5
          assert abs(float(p5['maxT_FWER_p']) - 0.05479) < 5e-5
          PY

      - name: Validate manuscript and Supporting Information alignment
        shell: bash
        run: |
          set -euo pipefail
          python submission/jbi/validate_jbi_submission.py
          grep -q '1,922' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q '67 sharp transitions' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q 'Sixteen local departures' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q '0.0548' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -Eq 'finalized eight-axis|same eight measured abiotic axes|eight-axis' submission/jbi/supporting/Appendix_S3_broad_environment_spatial_model.md
          grep -q '67' submission/jbi/supporting/Appendix_S5_local_pollinator_robustness.md
          grep -q '16' submission/jbi/supporting/Appendix_S6_event_departures_human_context.md
          grep -q 'final_integrated_pipeline_2026-08-12' paper/analysis-map.md

      - name: Reject superseded current-interface claims
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            reproducibility/final_paper_pipeline_2026-08-09.md \
            reproducibility/current_broad_anomaly_reference_2026-08-09.md \
            reproducibility/human_context_final_audit_results_2026-08-11.md \
            analysis_sensitivity/run_human_context_highrep_final.R \
            analysis_sensitivity/run_human_context_current_broad_primary.R \
            .github/workflows/reanalysis-current-inputs.yml \
            scripts/run_downstream_current_inputs.sh \
            inputs/canonical_snapshot.json; do
            test ! -e "$path"
          done
          # Historical four-PC/17-candidate sensitivity descriptions are allowed
          # when explicitly labelled as provenance. Reject only wording that
          # presents the superseded 17-candidate result as current/fixed.
          ! grep -R -n --exclude-dir=legacy --exclude-dir=.git \
            -E '17 fixed local-departure|Observed candidates: 17|current primary[^[:cntrl:]]*17 candidates|primary[^[:cntrl:]]*17 candidates' \
            paper submission/jbi reproducibility .github/workflows

      - name: Write current stage manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/final_integrated_pipeline
          cp reproducibility/final_integrated_pipeline_2026-08-12.md results/final_integrated_pipeline/
          cp paper/active-file-map.csv results/final_integrated_pipeline/
          cat > results/final_integrated_pipeline/workflow_provenance.txt <<EOF
          workflow=final-paper-analysis
          run=${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          broad_artifact=${BROAD_ARTIFACT_ID}
          local_bombus_artifact=${LOCAL_BOMBUS_ARTIFACT_ID}
          bombus_final8_audit_artifact=${BOMB_FINAL8_AUDIT_ARTIFACT_ID}
          human_current_broad_artifact=${HUMAN_CURRENT_BROAD_ARTIFACT_ID}
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-integrated-paper-${{ github.sha }}-${{ github.run_id }}
          path: results/final_integrated_pipeline
          if-no-files-found: warn
          retention-days: 90
