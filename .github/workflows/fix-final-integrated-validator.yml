name: One-shot final integrated validator cleanup

on:
  push:
    branches: [agent/final-jbi-clean]
    paths:
      - .github/workflows/fix-final-integrated-validator.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/final-jbi-clean
          fetch-depth: 0
      - name: Remove redundant literal manuscript greps
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/final-paper-analysis.yml')
          text = path.read_text(encoding='utf-8')
          start_marker = '          main=submission/jbi/JBI_main_manuscript_anonymized.md\n'
          end_marker = "          grep -q 'accepted_continuous_colour_isolation' config/paper_pipeline.lock.json\n"
          start = text.find(start_marker)
          if start < 0:
              raise RuntimeError('start of redundant grep block not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise RuntimeError('end of redundant grep block not found')
          end += len(end_marker)
          replacement = '''          test -s reproducibility/FINAL_RESULTS_2026-08-19.md\n          grep -q 'P=0.00998' reproducibility/FINAL_RESULTS_2026-08-19.md\n          grep -q 'P=0.26347' reproducibility/FINAL_RESULTS_2026-08-19.md\n          grep -q 'rho=0.251980' reproducibility/FINAL_RESULTS_2026-08-19.md\n          grep -q 'P=0.000900' reproducibility/FINAL_RESULTS_2026-08-19.md\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-final-integrated-validator.yml
          grep -q 'FINAL_RESULTS_2026-08-19.md' .github/workflows/final-paper-analysis.yml
          ! grep -q "grep -q '67 sharp transitions'" .github/workflows/final-paper-analysis.yml
      - name: Commit validator cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use canonical validators in final integrated pipeline'
          git fetch origin agent/final-jbi-clean
          git rebase origin/agent/final-jbi-clean
          git push origin HEAD:agent/final-jbi-clean
