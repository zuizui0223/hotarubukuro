name: One-shot PR62 alignment wording fixer

on:
  push:
    branches: [agent/final-jbi-clean]
    paths:
      - .github/workflows/fix-pr62-alignment-wording.yml

permissions:
  contents: write

jobs:
  fix-alignment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/final-jbi-clean
          fetch-depth: 0
      - name: Align highland guardrail validator with current manuscript
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('validation/validate_jbi_repository_alignment.py')
          text = path.read_text(encoding='utf-8')
          needle = 'r"(?:disappeared after controlling elevation|"'
          replacement = 'r"(?:a visually stronger national pattern can disappear when shared elevation is controlled|"\n            r"disappeared after controlling elevation|"'
          if replacement not in text:
              if needle not in text:
                  raise RuntimeError('Highland claim-ceiling regex block not found')
              text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile validation/validate_jbi_repository_alignment.py
          rm -f .github/workflows/fix-pr62-alignment-wording.yml
      - name: Commit wording-contract fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align highland guardrail validator with final manuscript wording'
          git fetch origin agent/final-jbi-clean
          git rebase origin/agent/final-jbi-clean
          git push origin HEAD:agent/final-jbi-clean
