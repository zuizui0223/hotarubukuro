name: Fix submission list numbering

on:
  push:
    branches:
      - agent/strengthen-environmental-hypotheses
    paths:
      - .github/workflows/fix-submission-list-numbering.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/strengthen-environmental-hypotheses
          fetch-depth: 0

      - name: Render ordered Markdown lists with literal source numbers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/jbi_submission_bundle_core.py')
          text = path.read_text(encoding='utf-8')
          old = (
              '        list_match = re.match(r"^\\s*([-*+]|\\d+\\.)\\s+(.+)$", raw)\n'
              '        if list_match:\n'
              '            marker, value = list_match.groups()\n'
              '            style = "List Number" if marker[0].isdigit() else "List Bullet"\n'
              '            paragraph = document.add_paragraph(style=style)\n'
              '            paragraph.paragraph_format.space_after = Pt(2)\n'
              '            add_inline_runs(paragraph, value)\n'
              '            index += 1\n'
              '            continue\n'
          )
          new = (
              '        list_match = re.match(r"^\\s*([-*+]|\\d+\\.)\\s+(.+)$", raw)\n'
              '        if list_match:\n'
              '            marker, value = list_match.groups()\n'
              '            if marker[0].isdigit():\n'
              '                # Word List Number silently continues across separately rendered appendices.\n'
              '                # Preserve the explicit Markdown number so each source list restarts exactly.\n'
              '                paragraph = document.add_paragraph()\n'
              '                paragraph.paragraph_format.left_indent = Inches(0.25)\n'
              '                paragraph.paragraph_format.first_line_indent = Inches(-0.18)\n'
              '                marker_run = paragraph.add_run(f"{marker} ")\n'
              '                marker_run.bold = True\n'
              '            else:\n'
              '                paragraph = document.add_paragraph(style="List Bullet")\n'
              '            paragraph.paragraph_format.space_after = Pt(2)\n'
              '            add_inline_runs(paragraph, value)\n'
              '            index += 1\n'
              '            continue\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'Expected one list-rendering block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m py_compile scripts/jbi_submission_bundle_core.py

      - name: Commit and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-submission-list-numbering.yml
          git config user.name "zuizui0223"
          git config user.email "188828063+zuizui0223@users.noreply.github.com"
          git add -A
          git commit -m "Restart ordered lists in each generated appendix"
          git push origin HEAD:agent/strengthen-environmental-hypotheses
