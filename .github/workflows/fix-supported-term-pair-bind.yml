name: Repair supported-term pair-table binding

on:
  push:
    branches:
      - agent/broad-model-aligned-space-null
    paths:
      - .github/workflows/fix-supported-term-pair-bind.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/broad-model-aligned-space-null
          fetch-depth: 0

      - name: Replace strict rbind with fill-binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/fit_broad_supported_term_distance_space_null.R')
          text = path.read_text(encoding='utf-8')
          old = 'pair_table <- do.call(rbind, pair_rows)\n'
          new = '''bind_rows_fill <- function(rows) {
            columns <- unique(unlist(lapply(rows, names), use.names = FALSE))
            aligned <- lapply(rows, function(row) {
              missing <- setdiff(columns, names(row))
              for (column in missing) row[[column]] <- NA_real_
              row[columns]
            })
            do.call(rbind, aligned)
          }

          pair_table <- bind_rows_fill(pair_rows)
          '''
          if old not in text:
              raise SystemExit('target pair_table binding line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/fit_broad_supported_term_distance_space_null.R
          git commit -m 'Align response-specific pair-table columns'
          git push origin HEAD:agent/broad-model-aligned-space-null
