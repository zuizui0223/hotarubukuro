name: Full reconstruction and symmetry v4

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/full-reproduction-and-symmetry-v4.yml"
      - "scripts/run_full_reproduction_action.sh"
      - "R/**"
      - "scripts/**"
      - "validation/**"
      - "Data_S1.csv"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: full-reproduction-symmetry-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  R_VERSION: "4.5.3"
  INLA_VERSION: "25.10.19"
  PHENOLOGY_JOINT_PRECISION_DIAGONAL: "1e-4"
  PHENOLOGY_DIAGONAL_SMOKE_RUN: "30723361853"
  HISTORICAL_PUBLICATION_COMMIT: "bcceb7c7c909adcb5f7b69721ee5c5921ae90f2e"
  RASTER_RUN_ID: "29793112921"
  PUBLIC_CACHE: ${{ github.workspace }}/reproduction_inputs/public_environment_cache
  RASTER_ARTIFACT: ${{ github.workspace }}/reproduction_inputs/prepared_publication_rasters
  MLIT_CACHE: ${{ github.workspace }}/reproduction_inputs/mlit_l03_2021
  GBIF_CACHE: ${{ github.workspace }}/results/bombus_occurrence_phenology_cache
  BOMBUS_DIR: ${{ github.workspace }}/results/enmeval_aicc_reselected/predictions
  STATUS_DIR: ${{ github.workspace }}/reproduction_status

jobs:
  reproduce-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out repository and complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ env.R_VERSION }}
          use-public-rspm: true

      - name: Install system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            gdal-bin libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libcurl4-openssl-dev libssl-dev libxml2-dev libglpk-dev \
            libfontconfig1-dev libharfbuzz-dev libfribidi-dev \
            libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            curl ca-certificates unzip zip jq

      - name: Restore reusable caches
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.R_LIBS_USER }}
            reproduction_inputs/mlit_l03_2021
            results/bombus_occurrence_phenology_cache
          key: full-reproduction-v4-${{ runner.os }}-r${{ env.R_VERSION }}-inla${{ env.INLA_VERSION }}-${{ hashFiles('R/pipeline_support.R', 'R/phenotype_hurdle.R', 'R/natural_predictive_model.R', 'scripts/run_full_reproduction_action.sh') }}
          restore-keys: |
            full-reproduction-v4-${{ runner.os }}-r${{ env.R_VERSION }}-inla${{ env.INLA_VERSION }}-
            full-reproduction-v3-${{ runner.os }}-r${{ env.R_VERSION }}-inla${{ env.INLA_VERSION }}-

      - name: Install R dependencies and pinned INLA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STATUS_DIR"
          Rscript - <<'RS'
          options(repos = c(
            inlabruorg = "https://inlabru-org.r-universe.dev",
            CRAN = Sys.getenv(
              "RSPM",
              "https://packagemanager.posit.co/cran/__linux__/noble/latest"
            )
          ))
          packages <- c(
            "jsonlite", "yaml", "digest", "mclust", "mgcv", "qgam",
            "quantreg", "sf", "terra", "FNN", "dplyr", "readr", "rgbif",
            "foreign", "ranger", "testthat", "geodata", "curl", "httr2",
            "units", "knitr", "rmarkdown", "fmesher", "MatrixModels", "sp",
            "lifecycle", "rlang", "withr", "sn"
          )
          missing <- packages[
            !vapply(packages, requireNamespace, logical(1), quietly = TRUE)
          ]
          if (length(missing)) install.packages(missing, Ncpus = 2L)

          target_version <- Sys.getenv("INLA_VERSION")
          installed_version <- if (requireNamespace("INLA", quietly = TRUE)) {
            as.character(utils::packageVersion("INLA"))
          } else {
            ""
          }
          if (!identical(installed_version, target_version)) {
            archive <- tempfile(fileext = ".tar.gz")
            url <- sprintf(
              "https://www.inla.r-inla-download.org/R/stable/src/contrib/INLA_%s.tar.gz",
              target_version
            )
            download.file(url, archive, mode = "wb", method = "libcurl")
            install.packages(archive, repos = NULL, type = "source")
          }
          required <- c(packages, "INLA")
          stopifnot(vapply(required, requireNamespace, logical(1), quietly = TRUE))
          stopifnot(as.character(utils::packageVersion("INLA")) == target_version)
          print(INLA::inla.version())
          writeLines(
            capture.output(sessionInfo()),
            file.path(Sys.getenv("STATUS_DIR"), "sessionInfo_dependencies.txt")
          )
          RS

      - name: Download retained prepared-raster artifact
        uses: actions/download-artifact@v4
        with:
          name: prepared-publication-rasters
          path: ${{ env.RASTER_ARTIFACT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.RASTER_RUN_ID }}

      - name: Apply phenology-only INLA precision stabilization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("R/natural_predictive_model.R")
          text = path.read_text(encoding="utf-8")
          needle = '    fit <- do.call(INLA::inla, arguments)'
          replacement = (
              '    if (identical(model, "national_environment_year_spde_phenology")) {\n'
              '      arguments$control.inla <- list(\n'
              '        diagonal = as.numeric(Sys.getenv(\n'
              '          "PHENOLOGY_JOINT_PRECISION_DIAGONAL"\n'
              '        ))\n'
              '      )\n'
              '    }\n'
              '    fit <- do.call(INLA::inla, arguments)'
          )
          if text.count(needle) != 1:
              raise SystemExit(
                  "Expected exactly one v16 INLA execution point for phenology patch"
              )
          path.write_text(text.replace(needle, replacement), encoding="utf-8")
          PY
          grep -n -A9 -B2 'PHENOLOGY_JOINT_PRECISION_DIAGONAL' \
            R/natural_predictive_model.R

      - name: Reconstruct all stages and run asymmetry analysis
        shell: bash
        run: bash scripts/run_full_reproduction_action.sh

      - name: Write reconstruction provenance
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$STATUS_DIR"
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "tested_commit=${GITHUB_SHA}"
            echo "r_version=${R_VERSION}"
            echo "inla_version=${INLA_VERSION}"
            echo "phenology_joint_precision_diagonal=${PHENOLOGY_JOINT_PRECISION_DIAGONAL}"
            echo "phenology_diagonal_scope=national_environment_year_spde_phenology_only"
            echo "phenology_diagonal_reason=joint_posterior_sampling_numerical_stabilization"
            echo "phenology_diagonal_smoke_run=${PHENOLOGY_DIAGONAL_SMOKE_RUN}"
            echo "historical_prediction_commit=${HISTORICAL_PUBLICATION_COMMIT}"
            echo "raster_artifact_run=${RASTER_RUN_ID}"
            echo "strict_current_enmeval_reselection=false"
            echo "symmetry_output_present=$([[ -s results/ecological_v23_local_state_asymmetry/local_state_asymmetry_summary.csv ]] && echo true || echo false)"
          } > "$STATUS_DIR/reconstruction_provenance.txt"
          find results -maxdepth 4 -type f -printf '%p\t%s\n' 2>/dev/null \
            | sort > "$STATUS_DIR/result_inventory.tsv" || true

      - name: Upload reconstructed outputs and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-reproduction-symmetry-v4-${{ github.sha }}
          path: |
            reproduction_status
            results/environment_v3
            results/public_rasters
            results/ecological_v9_final_public_HRNA_50km
            results/ecological_v10_final_mechanism_HRNA
            results/ecological_v11_pigmentation_hurdle
            results/ecological_v15_multiscale_hotspots
            results/ecological_v16_predictive_replication
            results/ecological_v17_local_pair_turnover
            results/ecological_v19_human_landscape_extremes
            results/ecological_v20_local_white_isolates
            results/ecological_v21_local_human_neighbourhood
            results/ecological_v23_local_state_asymmetry
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
