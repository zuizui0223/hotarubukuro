name: Current-Broad-primary 10000-map human-context adjudication

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/human-context-highrep-final.yml
      - analysis_sensitivity/run_human_context_current_broad_primary_fast.R
      - R/candidate_null_tools.R
      - R/local_pigmented_isolates.R
      - R/local_human_context.R
      - dependencies/**

permissions:
  contents: read
  actions: read

concurrency:
  group: human-context-current-broad-${{ github.ref }}
  cancel-in-progress: true

env:
  REFERENCE_ARTIFACT_ID: "9022276431"
  REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  FINAL8_ARTIFACT_ID: "9094339466"
  FINAL8_ARTIFACT_SHA256: "413042ea03f1beff71410583df52cb036b9076b0476c99f6e2c885ab0bf42fa1"

jobs:
  adjudicate:
    name: Replay locked final8 Broad on final8 local graph
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing,reporting

      - name: Restore checksum-locked reference and final8 draws
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact final8-artifact /tmp/reference.zip /tmp/final8.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/reference.zip
          [[ "$(sha256sum /tmp/reference.zip | awk '{print $1}')" == "$REFERENCE_ARTIFACT_SHA256" ]]
          mkdir -p reference-artifact
          unzip -q /tmp/reference.zip -d reference-artifact

          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FINAL8_ARTIFACT_ID}/zip" \
            -o /tmp/final8.zip
          [[ "$(sha256sum /tmp/final8.zip | awk '{print $1}')" == "$FINAL8_ARTIFACT_SHA256" ]]
          mkdir -p final8-artifact
          unzip -q /tmp/final8.zip -d final8-artifact

          test -s reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv
          test -s reference-artifact/results/ecological_v21_local_human_neighbourhood/human_neighbourhood_cell_features.csv
          test -s reference-artifact/results/ecological_v22_did_human_context/did_cell_context.csv
          test -s final8-artifact/final8_presence_draws10000.rds

      - name: Replay current-Broad-primary 10000 maps
        shell: bash
        run: |
          set -euo pipefail
          Rscript analysis_sensitivity/run_human_context_current_broad_primary_fast.R \
            --reference-root reference-artifact \
            --final8-root final8-artifact \
            --output results/human_context_current_broad_primary \
            --draws 10000 \
            --seed 20260725

      - name: Validate current-Broad-primary evidence
        shell: bash
        run: |
          set -euo pipefail
          root=results/human_context_current_broad_primary
          for file in \
            current_broad_primary_validation.json \
            current_broad_primary_graph_registry.csv \
            current_broad_primary_graph_support.csv \
            current_broad_primary_candidate_null.csv \
            current_broad_primary_human_maxT.csv \
            current_broad_primary_observation_bias.csv \
            current_broad_primary_candidate_membership.csv \
            current_broad_primary_decision.csv \
            current_broad_primary_feature_registry.csv; do
            test -s "$root/$file"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/human_context_current_broad_primary/current_broad_primary_validation.json').read_text())
          assert v['status'] == 'PASS', v
          assert v['n_maps'] == 10000, v
          assert v['primary_definition']['radius_km'] == 10, v
          assert v['primary_definition']['rms_caliper'] == 1, v
          assert v['primary_definition']['minimum_neighbours'] == 3, v
          assert v['primary_definition']['human_variables_used_in_selection'] is False, v
          assert v['candidate_count'] > 0, v
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: human-context-current-broad-${{ github.sha }}-${{ github.run_id }}
          path: results/human_context_current_broad_primary
          if-no-files-found: error
          retention-days: 90
