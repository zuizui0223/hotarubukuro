name: INLA installation smoke test

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/inla-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-fit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Install system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev \
            libglpk-dev curl ca-certificates

      - name: Install pinned INLA without repository-index lookup
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          options(repos = c(
            inlabruorg = "https://inlabru-org.r-universe.dev",
            CRAN = Sys.getenv(
              "RSPM",
              "https://packagemanager.posit.co/cran/__linux__/noble/latest"
            )
          ))
          dependencies <- c(
            "fmesher", "MatrixModels", "sp", "lifecycle", "rlang", "withr"
          )
          missing <- dependencies[
            !vapply(dependencies, requireNamespace, logical(1), quietly = TRUE)
          ]
          if (length(missing)) install.packages(missing, Ncpus = 2L)

          archive <- tempfile(fileext = ".tar.gz")
          url <- paste0(
            "https://www.inla.r-inla-download.org/R/stable/src/contrib/",
            "INLA_25.10.19.tar.gz"
          )
          download.file(url, archive, mode = "wb", method = "libcurl")
          install.packages(archive, repos = NULL, type = "source")
          stopifnot(requireNamespace("INLA", quietly = TRUE))
          print(INLA::inla.version())
          RS

      - name: Run a minimal INLA model
        shell: Rscript {0}
        run: |
          set.seed(1)
          data <- data.frame(y = rnorm(20), x = rnorm(20))
          fit <- INLA::inla(y ~ x, data = data, family = "gaussian")
          stopifnot(
            is.finite(fit$summary.fixed["x", "mean"]),
            is.finite(fit$mlik[1, 1])
          )
          print(fit$summary.fixed)
          sessionInfo()
