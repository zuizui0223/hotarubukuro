name: Inspect a retained run artifact

# A diagnostic, not part of any analysis.
#
# Actions artifacts redirect to blob storage, which the development environment
# cannot reach, so reading a previous run's stage manifest has to happen on a
# runner. This job needs no R and no analysis inputs, so it still works when the
# INLA upstream is unavailable and the analysis workflows cannot even provision
# their environment.
#
# It prints the pipeline stage manifest and the logs of whichever stage failed,
# which is the fastest way to identify an abort point in a run whose artifact is
# still retained.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run whose artifact should be inspected
        type: string
        required: false
        default: "30755058759"
  pull_request:
    types: [labeled]
    branches: ["main", "analysis/local-colour-state-asymmetry"]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    name: Inspect the retained artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-inspect-artifact'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Download the artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || '30755058759' }}
          github-token: ${{ github.token }}
          path: artifact
          merge-multiple: true

      - name: Report the pipeline stage outcome
        shell: bash
        run: |
          set -uo pipefail
          # Ordered so the diagnosis is the last thing printed. The inventory is
          # long enough to push a stage error out of a log tail otherwise.
          {
            echo "## Reproducibility inventory"
            echo
            echo '```text'
            find artifact -type f -printf '%p\t%s\n' | sort | head -200
            echo '```'
            echo
            echo "## Stage manifest for run ${{ inputs.run_id || '30755058759' }}"
            echo
            manifest="$(find artifact -name final_stage_manifest.csv | head -1)"
            if [[ -n "$manifest" ]]; then
              echo '```csv'
              cut -d, -f1,2,4,5 "$manifest"
              echo '```'
            else
              echo "No final_stage_manifest.csv in the artifact."
            fi
            echo
            echo "## Stage errors"
            echo
            for log in $(find artifact -path '*/logs/*_stderr.log' | sort); do
              [[ -s "$log" ]] || continue
              echo "### $(basename "$log")"
              echo '```text'
              cat "$log"
              echo '```'
              echo
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
