name: Integrate continuous isolation into JBI manuscript

on:
  workflow_dispatch:
  push:
    branches:
      - agent/continuous-colour-isolation-human-context
    paths:
      - scripts/integrate_continuous_isolation_manuscript.py
      - scripts/register_continuous_isolation_paper_contract.py
      - scripts/run_continuous_isolation_paper_contract.py
      - scripts/demote_event_analysis_to_supplement.py
      - .github/workflows/integrate-continuous-isolation-manuscript.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/integrate_continuous_isolation_manuscript.py
      - scripts/register_continuous_isolation_paper_contract.py
      - scripts/run_continuous_isolation_paper_contract.py
      - scripts/demote_event_analysis_to_supplement.py
      - .github/workflows/integrate-continuous-isolation-manuscript.yml

permissions:
  contents: write

concurrency:
  group: continuous-isolation-paper-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/continuous-colour-isolation-human-context

      - name: Apply deterministic manuscript and paper-contract integration
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^### 1.4 From broad geography to local boundaries and calibrated departures$' \
            submission/jbi/JBI_main_manuscript_anonymized.md; then
            python scripts/integrate_continuous_isolation_manuscript.py
          else
            echo "continuous-isolation manuscript prose already integrated"
          fi
          python scripts/run_continuous_isolation_paper_contract.py
          python scripts/demote_event_analysis_to_supplement.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def words(text: str) -> list[str]:
              return re.findall(r"\b[\wÀ-ž*'’-]+\b", text)

          map_path = Path('paper/active-file-map.csv')
          map_path.write_bytes(map_path.read_bytes().replace(b'\r\n', b'\n'))

          translated = Path('submission/jbi/JBI_translated_abstract_ja.md')
          text = translated.read_text(encoding='utf-8')
          text = text.replace('有色セルでは、', '674個の有色セルでは、')
          for heading in (
              '**調査地域：**', '**対象分類群：**', '**方法：**',
              '**結果：**', '**主な結論：**',
          ):
              text = text.replace('\n' + heading, '\n\n' + heading)
          text = re.sub(r'\n{3,}', '\n\n', text)
          translated.write_text(text, encoding='utf-8')

          main_path = Path('submission/jbi/JBI_main_manuscript_anonymized.md')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace(
              'Five leave-one-geographical-fold-out estimates assessed regional stability.',
              'Five leave-one-geographical-fold-out estimates assessed regional stability (Roberts et al., 2017; Valavi et al., 2019).',
          )
          main_path.write_text(main, encoding='utf-8')

          main_body = main.split('## 1. Introduction', 1)[1].split('## Acknowledgements', 1)[0]
          body_n = len(words(main_body))
          checklist_path = Path('submission/jbi/JBI_submission_checklist.md')
          checklist = checklist_path.read_text(encoding='utf-8')
          checklist = re.sub(
              r'Current Introduction-through-Discussion count = \*\*[\d,]+ words\*\* by repository validator\.',
              f'Current Introduction-through-Discussion count = **{body_n:,} words** by repository validator.',
              checklist,
          )
          checklist_path.write_text(checklist, encoding='utf-8')

          cover_path = Path('submission/jbi/JBI_cover_letter.md')
          cover = '''# Cover letter draft — Journal of Biogeography

Dear Senior Editors,

We submit our Research Article, “From broad geography to local boundaries: biogeography of flower-colour polymorphism from hiking photographs.” Using screened YAMAP images, we built a national quantitative flower-colour dataset and resolved its geography into environmental, residual-spatial, local focal-Bombus and human-context layers. Our conceptual advance is scale-matched attribution: changing comparison units separates processes that national regression would confound. Continuous all-cell geometry shows that isolated pigmented occurrences are more population-exposed than natural maps predict, while density correction prevents overstatement of an apparent reciprocal white pattern. Positive, heterogeneous and null results generate testable physiological, reproductive and human-context hypotheses without assigning causality beyond the evidence.

Sincerely,

[Corresponding author]
[Affiliation]
[Email]
'''
          cover_path.write_text(cover, encoding='utf-8')

          lock_path = Path('config/paper_pipeline.lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          for check in lock['alignment']['checks']:
              if check.get('label') != 'continuous colour-isolation human context':
                  continue
              check['patterns'] = [
                  (
                      r'(?:not as .*proof.*horticultural origin|'
                      r'does not establish.*horticultural origin)'
                      if 'horticultural origin' in pattern
                      else pattern
                  )
                  for pattern in check['patterns']
              ]
          lock_path.write_text(
              json.dumps(lock, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          alignment_path = Path('validation/validate_jbi_repository_alignment.py')
          alignment = alignment_path.read_text(encoding='utf-8')
          alignment = alignment.replace(
              '"local departures are not proof of human origin":',
              '"human-context overlay is not proof of human origin":',
          )
          alignment = alignment.replace(
              'r"not as proof of reciprocal colour displacement or horticultural origin)"',
              'r"not as .*proof of horticultural origin)"',
          )
          alignment_path.write_text(alignment, encoding='utf-8')

          validator_path = Path('submission/jbi/validate_jbi_submission.py')
          validator = validator_path.read_text(encoding='utf-8')
          validator = validator.replace(
              '        \'tag_panel(fig4a, "a")\',',
              '        \'source("scripts/render_jbi_figure4_continuous_isolation.R")\',',
          )
          validator_path.write_text(validator, encoding='utf-8')
          print(f'synchronized Main word count: {body_n}')
          PY
          git restore -- .github/workflows/jbi-main-figures.yml
          python -m json.tool config/paper_pipeline.lock.json >/dev/null
          git diff --check
          grep -q 'rho=0.252' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q 'P=0.0009' submission/jbi/JBI_translated_abstract_ja.md
          grep -q '674個の有色セル' submission/jbi/JBI_translated_abstract_ja.md
          grep -q 'continuous_pigmented_cells' validation/validate_jbi_figure_bundle.R
          grep -q 'accepted_continuous_colour_isolation' config/paper_pipeline.lock.json
          ! grep -q 'Sixteen event-defined populations' submission/jbi/JBI_main_manuscript_anonymized.md
          ! grep -q '^### 3.5 Predictive replay retained extreme populations as field targets$' submission/jbi/JBI_main_manuscript_anonymized.md
          ! grep -q '^### 4.5 Event calibration defines targets without turning them into causes$' submission/jbi/JBI_main_manuscript_anonymized.md
          ! grep -q '16 event-defined' submission/jbi/JBI_main_figure_captions.md
          grep -q '\*\*16\*\*' submission/jbi/supporting/Appendix_S6_event_departures_human_context.md
          python validation/validate_jbi_repository_alignment.py
          python submission/jbi/validate_jbi_submission.py

      - name: Commit generated non-workflow paper sources and contracts
        shell: bash
        run: |
          set -euo pipefail
          branch=agent/continuous-colour-isolation-human-context
          paths=(
            config/paper_pipeline.lock.json
            paper/README.md
            paper/analysis-map.md
            paper/active-file-map.csv
            validation/validate_jbi_repository_alignment.py
            validation/validate_jbi_figure_bundle.R
            submission/jbi/JBI_main_manuscript_anonymized.md
            submission/jbi/JBI_translated_abstract_ja.md
            submission/jbi/JBI_main_figure_captions.md
            submission/jbi/JBI_main_figure_plan.md
            submission/jbi/JBI_cover_letter.md
            submission/jbi/JBI_submission_checklist.md
            submission/jbi/validate_jbi_submission.py
            submission/jbi/supporting/Appendix_S6_event_departures_human_context.md
            reproducibility/continuous_colour_isolation_manuscript_integration_2026-08-18.md
            scripts/render_jbi_main_figures.R
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo "continuous-isolation paper integration already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "Keep event analysis in Supporting Information only"

          for attempt in 1 2 3 4 5; do
            echo "push attempt ${attempt}/5"
            git fetch origin "$branch"
            git rebase "origin/$branch"
            if git push origin "HEAD:$branch"; then
              exit 0
            fi
            sleep 2
          done
          echo "failed to publish generated paper contract after five rebased attempts" >&2
          exit 1
