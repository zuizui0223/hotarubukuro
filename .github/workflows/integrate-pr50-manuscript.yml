name: Integrate PR 50 into current JBI manuscript

on:
  push:
    branches:
      - agent/unify-jbi-reproducible-pipeline
    paths:
      - '.github/workflows/integrate-pr50-manuscript.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Keep the added Abstract result concise
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/integrate_pr50_manuscript.py')
          text = path.read_text(encoding='utf-8')
          old = 'Pigmentation state and intensity showed different geography, and a cross-fitted space-only sensitivity detected environmental alignment beyond spatial continuity for state but not intensity. Pigmentation was less likely in warmer climates, whereas intensity depended on Temperature PC1 × temperature seasonality and was lower in wetter and more rugged environments.'
          new = 'Pigmentation state and intensity differed geographically; only state exceeded a cross-fitted spatial expectation along environmental difference. Pigmentation was less likely in warmer climates, whereas intensity depended on Temperature PC1 × temperature seasonality and was lower in wetter and more rugged environments.'
          if text.count(old) != 1:
              raise SystemExit('Expected one Abstract replacement payload in integration script')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Keep the cover-letter interest statement below 100 words
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/integrate_pr50_manuscript.py')
          text = path.read_text(encoding='utf-8')
          old = 'We submit our Research Article, “From broad geography to local boundaries: biogeography of flower-colour polymorphism from hiking photographs.” Using a new national quantitative trait dataset built from screened YAMAP images, the paper resolves one flower-colour map into response-specific environmental geography, coherent residual spatial structure, a localized focal-Bombus hypothesis and calibrated provenance targets. A cross-fitted space-only sensitivity further shows that environmental difference aligns with pigmentation-state divergence beyond spatial continuity, but not with conditional intensity. Its conceptual advance is scale-matched attribution: changing comparison unit separates signals that a single national regression would confound. Positive, heterogeneous and null results together yield a testable model for how physiological and reproductive value, history and occasional human movement can maintain an intraspecific polymorphism.'
          new = 'We submit our Research Article, “From broad geography to local boundaries: biogeography of flower-colour polymorphism from hiking photographs.” From screened YAMAP images, we built a national quantitative flower-colour dataset and resolved its geography into environmental, residual-spatial, local focal-Bombus and provenance layers. A cross-fitted space-only sensitivity showed environmental alignment beyond spatial continuity for pigmentation state, but not conditional intensity. The conceptual advance is scale-matched attribution: changing comparison unit separates processes a national regression would confound, while positive, heterogeneous and null results generate testable physiological, reproductive and historical hypotheses.'
          if text.count(old) != 1:
              raise SystemExit('Expected one cover-letter replacement payload in integration script')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply manuscript integration
        run: python scripts/integrate_pr50_manuscript.py

      - name: Synchronize submission checklist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('submission/jbi/JBI_submission_checklist.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Current Introduction-through-Discussion count = **4,162 words** by repository validator.': 'Current Introduction-through-Discussion count = **4,452 words** by repository validator.',
              'Current abstract = **290 words** by repository validator.': 'Current abstract = **299 words** by repository validator.',
              '**Broad killing part:** environment is shown to explain response-specific geography, while SPDE delivers coherent residual ranges that guide microclimate and genomic sampling rather than being dismissed as unexplained noise.': '**Broad killing part:** environment is shown to explain response-specific geography, while SPDE delivers coherent residual ranges that guide microclimate and genomic sampling rather than being dismissed as unexplained noise. A cross-fitted space-only sensitivity further shows environment-aligned divergence beyond spatial continuity for pigmentation state but not conditional intensity, without relabelling that excess as genetic differentiation or adaptation.'
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Checklist replacement target count was {text.count(old)} for: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate manuscript and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python submission/jbi/validate_jbi_submission.py
          python validation/validate_jbi_repository_alignment.py \
            --lock config/paper_pipeline.lock.json \
            --output /tmp/jbi-repository-alignment.json
          python -m pip install --quiet pytest
          python -m pytest tests/python/test_run_pipeline.py
          git diff --check

      - name: Commit the integrated manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate PR #50 spatial-null result into JBI manuscript'
          git push origin "HEAD:${GITHUB_REF_NAME}"
