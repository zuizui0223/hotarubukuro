name: Integrate PR 50 into current JBI manuscript

on:
  push:
    branches:
      - agent/unify-jbi-reproducible-pipeline
    paths:
      - '.github/workflows/integrate-pr50-manuscript.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Keep the added Abstract result concise
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/integrate_pr50_manuscript.py')
          text = path.read_text(encoding='utf-8')
          old = 'Pigmentation state and intensity showed different geography, and a cross-fitted space-only sensitivity detected environmental alignment beyond spatial continuity for state but not intensity. Pigmentation was less likely in warmer climates, whereas intensity depended on Temperature PC1 × temperature seasonality and was lower in wetter and more rugged environments.'
          new = 'Pigmentation state and intensity differed geographically; only state exceeded a cross-fitted spatial expectation along environmental difference. Pigmentation was less likely in warmer climates, whereas intensity depended on Temperature PC1 × temperature seasonality and was lower in wetter and more rugged environments.'
          if text.count(old) != 1:
              raise SystemExit('Expected one Abstract replacement payload in integration script')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply manuscript integration
        run: python scripts/integrate_pr50_manuscript.py

      - name: Validate manuscript and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          python submission/jbi/validate_jbi_submission.py
          python validation/validate_jbi_repository_alignment.py \
            --lock config/paper_pipeline.lock.json \
            --output /tmp/jbi-repository-alignment.json
          python -m pip install --quiet pytest
          python -m pytest tests/python/test_run_pipeline.py
          git diff --check

      - name: Commit the integrated manuscript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate PR #50 spatial-null result into JBI manuscript'
          git push origin "HEAD:${GITHUB_REF_NAME}"
