name: Build JBI main figure bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/jbi-main-figures.yml
      - scripts/build_jbi_figure_bundle.R
      - scripts/build_jbi_figure_bundle_final_broad.R
      - scripts/render_jbi_main_figures.R
      - scripts/render_jbi_main_figures_final_broad.R
      - scripts/render_jbi_figure4_continuous_isolation.R
      - validation/validate_jbi_figure_bundle.R
      - validation/validate_jbi_figure_bundle_final_broad.R
      - reproducibility/broad_environment_spatial_final_fixed_effects_2026-08-11.csv
      - reproducibility/broad_environment_spatial_final_hyperparameters_2026-08-11.csv
      - reproducibility/continuous_colour_isolation_human_context_result_2026-08-18.md
      - submission/jbi/JBI_main_figure_captions.md
      - submission/jbi/figures/**
      - paper/active-file-map.csv
      - R/**
      - dependencies/**
  push:
    branches: [main]
    paths:
      - .github/workflows/jbi-main-figures.yml
      - scripts/build_jbi_figure_bundle.R
      - scripts/build_jbi_figure_bundle_final_broad.R
      - scripts/render_jbi_main_figures.R
      - scripts/render_jbi_main_figures_final_broad.R
      - scripts/render_jbi_figure4_continuous_isolation.R
      - validation/validate_jbi_figure_bundle.R
      - validation/validate_jbi_figure_bundle_final_broad.R
      - reproducibility/broad_environment_spatial_final_fixed_effects_2026-08-11.csv
      - reproducibility/broad_environment_spatial_final_hyperparameters_2026-08-11.csv
      - reproducibility/continuous_colour_isolation_human_context_result_2026-08-18.md
      - submission/jbi/JBI_main_figure_captions.md
      - submission/jbi/figures/**
      - paper/active-file-map.csv
      - R/**
      - dependencies/**

permissions:
  contents: read
  actions: read

env:
  BROAD_ARTIFACT_ID: "9022276431"
  BROAD_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"
  LOCAL_TRANSITION_ARTIFACT_ID: "9023416810"
  LOCAL_TRANSITION_ARTIFACT_SHA256: "3f7ac07ea90e2b732441a9f80a38ea49871014722d008769370524b947007e34"
  BOMB_FINAL8_AUDIT_ARTIFACT_ID: "9119773035"
  BOMB_FINAL8_AUDIT_SHA256: "51fc846d2f3d815d8bbf3c0b95647eabeb0acf731f1e6dd164c11a0dfe1b896f"
  HUMAN_CURRENT_BROAD_ARTIFACT_ID: "9119306089"
  HUMAN_CURRENT_BROAD_ARTIFACT_SHA256: "f5f7f3633d43a62fbef1f5142a77a21e766a5d85ab4f17dc43b062dadf4803c4"
  CONTINUOUS_ISOLATION_ARTIFACT_ID: "9317087893"
  CONTINUOUS_ISOLATION_ARTIFACT_SHA256: "6fd26d9a938b68d3f0c56512cd1620597c740d44ba91ab5a7ccbb9daa99d5386"
  HOTARUBUKURO_R_SEED: "20260725"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"

jobs:
  build-main-figures:
    name: Generate and validate four JBI main figures
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: jbi-figures-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt') }}
          restore-keys: |
            jbi-figures-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared figure environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility/jbi-figure-environment
          --scopes figures,reproducibility
          --skip-inla true

      - name: Restore checksum-locked broad evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BROAD_ARTIFACT_ID}/zip" -o /tmp/broad.zip
          [[ "$(sha256sum /tmp/broad.zip | awk '{print $1}')" == "$BROAD_ARTIFACT_SHA256" ]]
          unzip -q -o /tmp/broad.zip -d "$GITHUB_WORKSPACE"
          test -s results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv
          test -s results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv

      - name: Restore checksum-locked local focal-pollinator evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${LOCAL_TRANSITION_ARTIFACT_ID}/zip" -o /tmp/local-transition.zip
          [[ "$(sha256sum /tmp/local-transition.zip | awk '{print $1}')" == "$LOCAL_TRANSITION_ARTIFACT_SHA256" ]]
          unzip -q -o /tmp/local-transition.zip -d "$GITHUB_WORKSPACE"
          test -s results/ecological_v18_bombus_local_sharp_transition/sharp_transition_summary.csv
          test -s results/ecological_v18_bombus_local_sharp_transition/sharp_transition_nonoverlapping_pairs.csv

      - name: Restore final8 Bombus, event-human and continuous-isolation evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            results/bombus_final8_environment_audit \
            results/human_context_current_broad \
            results/continuous_colour_isolation_human_context

          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOMB_FINAL8_AUDIT_ARTIFACT_ID}/zip" -o /tmp/bomb-final8.zip
          [[ "$(sha256sum /tmp/bomb-final8.zip | awk '{print $1}')" == "$BOMB_FINAL8_AUDIT_SHA256" ]]
          unzip -q -o /tmp/bomb-final8.zip -d results/bombus_final8_environment_audit

          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${HUMAN_CURRENT_BROAD_ARTIFACT_ID}/zip" -o /tmp/human-current.zip
          [[ "$(sha256sum /tmp/human-current.zip | awk '{print $1}')" == "$HUMAN_CURRENT_BROAD_ARTIFACT_SHA256" ]]
          unzip -q -o /tmp/human-current.zip -d results/human_context_current_broad

          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CONTINUOUS_ISOLATION_ARTIFACT_ID}/zip" -o /tmp/continuous-isolation.zip
          [[ "$(sha256sum /tmp/continuous-isolation.zip | awk '{print $1}')" == "$CONTINUOUS_ISOLATION_ARTIFACT_SHA256" ]]
          unzip -q -o /tmp/continuous-isolation.zip -d results/continuous_colour_isolation_human_context

          test -s results/bombus_final8_environment_audit/bombus_pair_environment_distance_audit.csv
          test -s results/human_context_current_broad/current_broad_primary_candidate_membership.csv
          test -s results/human_context_current_broad/current_broad_primary_candidate_null.csv
          test -s results/human_context_current_broad/current_broad_primary_human_maxT.csv
          test -s results/continuous_colour_isolation_human_context/continuous_isolation_cell_metrics.csv
          test -s results/continuous_colour_isolation_human_context/continuous_isolation_natural_null_summary.csv
          test -s results/continuous_colour_isolation_human_context/continuous_isolation_validation.json

      - name: Build the four current JBI figures
        shell: bash
        run: >-
          Rscript scripts/render_jbi_main_figures_final_broad.R
          --output results/jbi_figure_bundle

      - name: Validate figure files and numerical lock
        shell: bash
        run: >-
          Rscript validation/validate_jbi_figure_bundle_final_broad.R
          --output results/jbi_figure_bundle

      - name: Validate the current JBI text package
        run: python submission/jbi/validate_jbi_submission.py

      - name: Record workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > results/jbi_figure_bundle/workflow_provenance.txt <<EOF
          workflow=jbi-main-figures
          workflow_run=${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          broad_artifact_id=${BROAD_ARTIFACT_ID}
          broad_artifact_sha256=${BROAD_ARTIFACT_SHA256}
          local_transition_artifact_id=${LOCAL_TRANSITION_ARTIFACT_ID}
          local_transition_artifact_sha256=${LOCAL_TRANSITION_ARTIFACT_SHA256}
          bombus_final8_audit_artifact_id=${BOMB_FINAL8_AUDIT_ARTIFACT_ID}
          bombus_final8_audit_sha256=${BOMB_FINAL8_AUDIT_SHA256}
          current_broad_human_artifact_id=${HUMAN_CURRENT_BROAD_ARTIFACT_ID}
          current_broad_human_artifact_sha256=${HUMAN_CURRENT_BROAD_ARTIFACT_SHA256}
          continuous_isolation_artifact_id=${CONTINUOUS_ISOLATION_ARTIFACT_ID}
          continuous_isolation_artifact_sha256=${CONTINUOUS_ISOLATION_ARTIFACT_SHA256}
          EOF

      - name: Upload JBI main-figure bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-main-figures-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/jbi_figure_bundle
            submission/jbi/JBI_main_figure_plan.md
            submission/jbi/JBI_main_figure_captions.md
            submission/jbi/figures/README.md
            reproducibility/broad_environment_spatial_final_fixed_effects_2026-08-11.csv
            reproducibility/broad_environment_spatial_final_hyperparameters_2026-08-11.csv
            reproducibility/continuous_colour_isolation_human_context_result_2026-08-18.md
            reproducibility/jbi-figure-environment
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
