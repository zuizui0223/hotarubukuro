name: Build JBI review submission bundle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/jbi-submission-bundle.yml
      - scripts/build_jbi_submission_bundle.py
      - scripts/validate_jbi_submission_bundle.py
      - submission/jbi/**
      - dependencies/submission-apt-packages.txt
      - pyproject.toml
      - paper/active-file-map.csv
  push:
    branches:
      - main
    paths:
      - .github/workflows/jbi-submission-bundle.yml
      - scripts/build_jbi_submission_bundle.py
      - scripts/validate_jbi_submission_bundle.py
      - submission/jbi/**
      - dependencies/submission-apt-packages.txt
      - pyproject.toml
      - paper/active-file-map.csv

permissions:
  contents: read
  actions: read

env:
  FIGURE_ARTIFACT_ID: "9057707602"
  FIGURE_ARTIFACT_SHA256: "a1b2d44c09b5dd7d00f73dcab4232128936e9bfd5f8af7c433a617ad114968eb"

jobs:
  build-submission-bundle:
    name: Assemble and render the JBI review package
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install submission document system packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/submission-apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Install declared submission Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install '.[submission]'

      - name: Restore checksum-locked current Main figures
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf figure-artifact /tmp/jbi-main-figures.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FIGURE_ARTIFACT_ID}/zip" \
            -o /tmp/jbi-main-figures.zip
          actual="$(sha256sum /tmp/jbi-main-figures.zip | awk '{print $1}')"
          [[ "$actual" == "$FIGURE_ARTIFACT_SHA256" ]]
          mkdir -p figure-artifact
          unzip -q /tmp/jbi-main-figures.zip -d figure-artifact
          test -s figure-artifact/results/jbi_figure_bundle/main_figures/Figure_1_measurement_two_part_phenotype.png
          test -s figure-artifact/results/jbi_figure_bundle/main_figures/Figure_4_calibrated_local_departures.pdf

      - name: Validate current source manuscript package
        run: python submission/jbi/validate_jbi_submission.py

      - name: Build editable review and portal-template files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_jbi_submission_bundle.py \
            --figure-root figure-artifact/results/jbi_figure_bundle/main_figures \
            --output results/jbi_submission_bundle/package

      - name: Validate DOCX, figures, hashes, anonymity and blockers
        run: >-
          python scripts/validate_jbi_submission_bundle.py
          --root results/jbi_submission_bundle

      - name: Render every generated DOCX through LibreOffice
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/libreoffice-home"
          mkdir -p "$HOME" results/jbi_submission_bundle/rendered
          for docx in results/jbi_submission_bundle/package/*.docx; do
            libreoffice \
              -env:UserInstallation="file://${RUNNER_TEMP}/lo-profile-$(basename "$docx" .docx)" \
              --headless --convert-to pdf \
              --outdir results/jbi_submission_bundle/rendered \
              "$docx"
          done
          expected=6
          observed="$(find results/jbi_submission_bundle/rendered -maxdepth 1 -name '*.pdf' -size +1000c | wc -l)"
          [[ "$observed" -eq "$expected" ]]
          for pdf in results/jbi_submission_bundle/rendered/*.pdf; do
            pdfinfo "$pdf" > "${pdf%.pdf}.pdfinfo.txt"
            grep -q '^Pages:' "${pdf%.pdf}.pdfinfo.txt"
            pdftoppm -f 1 -singlefile -png -r 110 \
              "$pdf" "${pdf%.pdf}_first_page" >/dev/null 2>&1
            test -s "${pdf%.pdf}_first_page.png"
          done

      - name: Record bundle provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > results/jbi_submission_bundle/workflow_provenance.txt <<EOF
          workflow=jbi-submission-bundle
          workflow_run=${GITHUB_RUN_ID}
          workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          figure_artifact_id=${FIGURE_ARTIFACT_ID}
          figure_artifact_sha256=${FIGURE_ARTIFACT_SHA256}
          main_document=01_Main_Manuscript_Anonymized.docx
          supporting_document=02_Supporting_Information_Appendices_S1-S6.docx
          portal_ready=false_until_author_controlled_fields_are_completed
          EOF

      - name: Upload JBI review submission bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-review-submission-bundle-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/jbi_submission_bundle
            submission/jbi/JBI_submission_checklist.md
            submission/jbi/JBI_sdm_model_building_checklist.md
          if-no-files-found: error
          compression-level: 6
          retention-days: 90
