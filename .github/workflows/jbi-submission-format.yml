name: Validate JBI submission package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/repository-cleanup-legacy
    paths:
      - submission/jbi/**
      - paper/**
      - .github/workflows/jbi-submission-format.yml

permissions:
  contents: read

jobs:
  validate-jbi-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate manuscript format and anonymity guards
        run: python submission/jbi/validate_jbi_submission.py

      - name: Confirm current submission package
        shell: bash
        run: |
          set -euo pipefail
          test -s submission/jbi/JBI_main_manuscript_anonymized.md
          test -s submission/jbi/JBI_title_page_template.md
          test -s submission/jbi/JBI_cover_letter.md
          test -s submission/jbi/JBI_supporting_information_outline.md
          test -s submission/jbi/JBI_submission_checklist.md
          test -s submission/jbi/JBI_translated_abstract_ja.md
          test -s submission/jbi/JBI_main_figure_plan.md
          test -s submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md
          test -s paper/README.md
          test -s paper/active-file-map.csv
