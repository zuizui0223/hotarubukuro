name: Apply local-only Bombus cleanup

on:
  push:
    branches:
      - agent/bombus-sdm-inference-guardrails
    paths:
      - .github/workflows/local-bombus-only-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bombus-sdm-inference-guardrails
          fetch-depth: 0

      - name: Apply patch
        run: python3 scripts/internal/apply_local_bombus_only_patch.py

      - name: Commit patched source
        run: |
          git config user.name "ZHANG RUIQI"
          git config user.email "rachelzhang0223@gmail.com"
          git add -A
          git commit -m "Keep Bombus inference local-only"
          git push origin HEAD:agent/bombus-sdm-inference-guardrails
