name: Local state asymmetry full diagnostic

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/local-state-asymmetry-full.yml"
      - "R/local_state_asymmetry.R"
      - "scripts/run_local_state_asymmetry.R"
      - "validation/validate_local_state_asymmetry.R"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: local-state-asymmetry-full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recover-run-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      CELLS_PATH: results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv
      CHECKPOINT_PATH: results/ecological_v16_predictive_replication/checkpoints/national_environment_spde_presence_draws1000.rds
      OUTPUT_DIR: results/ecological_v23_local_state_asymmetry
    steps:
      - name: Check out repository and full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch repository branches and pull-request heads
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/pull/*/head:refs/remotes/pull/*' || true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"

      - name: Attempt results-cache restoration
        id: results-cache
        uses: actions/cache/restore@v4
        with:
          path: results
          key: local-state-asymmetry-results-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            local-state-asymmetry-results-${{ runner.os }}-
            publication-results-
            ecological-results-
            publication-analysis-
            predictive-results-
            analysis-results-
            results-

      - name: Attempt processed-raster cache restoration
        id: raster-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/processed/rasters
            data/processed/raster_manifest.csv
            data/processed/raster_download_manifest.csv
          key: publication-processed-v4-${{ github.sha }}
          restore-keys: |
            publication-processed-v4-

      - name: Inventory retained Actions caches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic_inventory
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            > diagnostic_inventory/actions-caches-pages.jsonl || true
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          path = Path("diagnostic_inventory/actions-caches-pages.jsonl")
          if path.exists():
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  page = json.loads(line)
                  rows.extend(page.get("actions_caches", []))
          compact = [
              {
                  "id": row.get("id"),
                  "key": row.get("key"),
                  "ref": row.get("ref"),
                  "size_in_bytes": row.get("size_in_bytes"),
                  "created_at": row.get("created_at"),
                  "last_accessed_at": row.get("last_accessed_at"),
              }
              for row in rows
          ]
          Path("diagnostic_inventory/actions-cache-inventory.json").write_text(
              json.dumps(compact, indent=2), encoding="utf-8"
          )
          print(f"Retained Actions caches: {len(compact)}")
          for row in compact:
              print(row["key"], row["size_in_bytes"], row["ref"])
          PY

      - name: Recover exact inputs from reachable Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$CELLS_PATH")" "$(dirname "$CHECKPOINT_PATH")" diagnostic_inventory
          git rev-list --all --objects > diagnostic_inventory/git-objects.txt
          recover_from_history() {
            local target="$1"
            [[ -f "$target" ]] && return 0
            local record object path
            record="$(awk -v target="$target" '$0 ~ (" " target "$") {line=$0} END {print line}' diagnostic_inventory/git-objects.txt)"
            [[ -z "$record" ]] && return 0
            object="${record%% *}"
            path="${record#* }"
            if [[ "$(git cat-file -t "$object" 2>/dev/null || true)" == "blob" ]]; then
              echo "Recovering $target from Git object $object ($path)"
              git cat-file blob "$object" > "$target"
              printf '%s\tgit-object=%s\tpath=%s\n' "$target" "$object" "$path" \
                >> diagnostic_inventory/recovery_sources.txt
            fi
          }
          recover_from_history "$CELLS_PATH"
          recover_from_history "$CHECKPOINT_PATH"

      - name: Inventory and recover inputs from GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic_inventory release_downloads "$(dirname "$CELLS_PATH")" "$(dirname "$CHECKPOINT_PATH")"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > diagnostic_inventory/releases-pages.jsonl || true
          python - <<'PY'
          import json
          from pathlib import Path

          releases = []
          path = Path("diagnostic_inventory/releases-pages.jsonl")
          if path.exists():
              for line in path.read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  page = json.loads(line)
                  if isinstance(page, list):
                      releases.extend(page)
          assets = []
          for release in releases:
              for asset in release.get("assets", []):
                  assets.append({
                      "id": asset.get("id"),
                      "name": asset.get("name", ""),
                      "size_in_bytes": asset.get("size", 0),
                      "created_at": asset.get("created_at", ""),
                      "release_id": release.get("id"),
                      "release_tag": release.get("tag_name", ""),
                      "release_name": release.get("name", ""),
                  })
          assets.sort(key=lambda row: row.get("created_at", ""), reverse=True)
          Path("diagnostic_inventory/release-inventory.json").write_text(
              json.dumps([
                  {
                      "id": release.get("id"),
                      "tag": release.get("tag_name"),
                      "name": release.get("name"),
                      "draft": release.get("draft"),
                      "prerelease": release.get("prerelease"),
                      "published_at": release.get("published_at"),
                      "asset_count": len(release.get("assets", [])),
                  }
                  for release in releases
              ], indent=2), encoding="utf-8"
          )
          Path("diagnostic_inventory/release-asset-inventory.json").write_text(
              json.dumps(assets, indent=2), encoding="utf-8"
          )
          with open("diagnostic_inventory/release-assets.tsv", "w", encoding="utf-8") as handle:
              for asset in assets:
                  if asset["id"] and asset["size_in_bytes"] <= 1_500_000_000:
                      handle.write(
                          f'{asset["id"]}\t{asset["name"]}\t{asset["size_in_bytes"]}\t{asset["release_tag"]}\n'
                      )
          print(f"Releases: {len(releases)}; release assets: {len(assets)}")
          PY

          inspect_archive() {
            local archive="$1"
            local source_kind="$2"
            local source_id="$3"
            local source_name="$4"
            ARCHIVE="$archive" SOURCE_KIND="$source_kind" SOURCE_ID="$source_id" \
            SOURCE_NAME="$source_name" CELLS_PATH="$CELLS_PATH" CHECKPOINT_PATH="$CHECKPOINT_PATH" \
            python - <<'PY'
          import gzip
          import os
          import shutil
          import tarfile
          import tempfile
          import zipfile
          from pathlib import Path

          archive = Path(os.environ["ARCHIVE"])
          targets = [Path(os.environ["CELLS_PATH"]), Path(os.environ["CHECKPOINT_PATH"])]
          source_kind = os.environ["SOURCE_KIND"]
          source_id = os.environ["SOURCE_ID"]
          source_name = os.environ["SOURCE_NAME"]
          member_log = Path(f"diagnostic_inventory/{source_kind}-{source_id}-members.txt")

          def target_for(name):
              normalized = name.replace("\\", "/")
              for target in targets:
                  if target.exists():
                      continue
                  if normalized.endswith(str(target).replace("\\", "/")) or Path(normalized).name == target.name:
                      return target
              return None

          def copy_stream(src, target):
              target.parent.mkdir(parents=True, exist_ok=True)
              with open(target, "wb") as dst:
                  shutil.copyfileobj(src, dst, length=1024 * 1024)
              with open("diagnostic_inventory/recovery_sources.txt", "a", encoding="utf-8") as out:
                  out.write(
                      f"{target}\t{source_kind}={source_id}\tname={source_name}\n"
                  )
              print(f"Recovered {target} from {source_kind} {source_id}")

          names = []
          try:
              if zipfile.is_zipfile(archive):
                  with zipfile.ZipFile(archive) as zf:
                      names = zf.namelist()
                      for name in names:
                          target = target_for(name)
                          if target is not None:
                              with zf.open(name) as src:
                                  copy_stream(src, target)
              elif tarfile.is_tarfile(archive):
                  with tarfile.open(archive, "r:*") as tf:
                      names = tf.getnames()
                      for member in tf.getmembers():
                          if not member.isfile():
                              continue
                          target = target_for(member.name)
                          if target is not None:
                              src = tf.extractfile(member)
                              if src is not None:
                                  with src:
                                      copy_stream(src, target)
              else:
                  target = target_for(archive.name)
                  if target is not None:
                      with open(archive, "rb") as src:
                          copy_stream(src, target)
          except Exception as exc:
              names.append(f"ERROR: {type(exc).__name__}: {exc}")
          member_log.write_text("\n".join(names), encoding="utf-8")
          PY
          }

          while IFS=$'\t' read -r asset_id asset_name asset_size release_tag; do
            [[ -f "$CELLS_PATH" && -f "$CHECKPOINT_PATH" ]] && break
            [[ -z "${asset_id:-}" ]] && continue
            safe_name="$(printf '%s' "$asset_name" | tr -cs 'A-Za-z0-9._-' '_')"
            archive="release_downloads/${asset_id}-${safe_name}"
            echo "Inspecting release asset $asset_id: $asset_name ($asset_size bytes; tag $release_tag)"
            if gh api -H 'Accept: application/octet-stream' \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$archive"; then
              inspect_archive "$archive" release-asset "$asset_id" "$asset_name"
            fi
            rm -f "$archive"
          done < diagnostic_inventory/release-assets.tsv

      - name: Inventory and recover inputs from every retained workflow artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostic_inventory artifact_downloads "$(dirname "$CELLS_PATH")" "$(dirname "$CHECKPOINT_PATH")"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            > diagnostic_inventory/artifacts-pages.jsonl
          python - <<'PY'
          import json
          from pathlib import Path

          artifacts = []
          path = Path("diagnostic_inventory/artifacts-pages.jsonl")
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              page = json.loads(line)
              artifacts.extend(page.get("artifacts", []))
          artifacts = [a for a in artifacts if not a.get("expired", False)]
          artifacts.sort(key=lambda a: a.get("created_at", ""), reverse=True)
          rows = []
          for artifact in artifacts:
              rows.append({
                  "id": artifact["id"],
                  "name": artifact.get("name", ""),
                  "size_in_bytes": artifact.get("size_in_bytes", 0),
                  "created_at": artifact.get("created_at", ""),
                  "workflow_run_id": (artifact.get("workflow_run") or {}).get("id"),
              })
          Path("diagnostic_inventory/artifact-inventory.json").write_text(
              json.dumps(rows, indent=2), encoding="utf-8"
          )
          with open("diagnostic_inventory/artifacts.tsv", "w", encoding="utf-8") as handle:
              for row in rows:
                  name_lower = row["name"].lower()
                  package_cache = "cran" in name_lower and "cache" in name_lower
                  if not package_cache and row["size_in_bytes"] <= 1_500_000_000:
                      handle.write(
                          f'{row["id"]}\t{row["name"]}\t{row["size_in_bytes"]}\n'
                      )
          print(f"Retained non-expired artifacts: {len(rows)}")
          PY

          inspected=0
          while IFS=$'\t' read -r artifact_id artifact_name artifact_size; do
            [[ -f "$CELLS_PATH" && -f "$CHECKPOINT_PATH" ]] && break
            [[ -z "${artifact_id:-}" ]] && continue
            inspected=$((inspected + 1))
            [[ $inspected -gt 100 ]] && break
            safe_name="$(printf '%s' "$artifact_name" | tr -cs 'A-Za-z0-9._-' '_')"
            archive="artifact_downloads/${artifact_id}-${safe_name}.zip"
            echo "Inspecting artifact $artifact_id: $artifact_name ($artifact_size bytes)"
            if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$archive"; then
              rm -f "$archive"
              continue
            fi
            ARTIFACT_ID="$artifact_id" ARTIFACT_NAME="$artifact_name" ARCHIVE="$archive" \
            CELLS_PATH="$CELLS_PATH" CHECKPOINT_PATH="$CHECKPOINT_PATH" python - <<'PY'
          import os
          import shutil
          import zipfile
          from pathlib import Path

          archive = os.environ["ARCHIVE"]
          targets = [Path(os.environ["CELLS_PATH"]), Path(os.environ["CHECKPOINT_PATH"])]
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              Path(f"diagnostic_inventory/artifact-{os.environ['ARTIFACT_ID']}-members.txt").write_text(
                  "\n".join(names), encoding="utf-8"
              )
              for target in targets:
                  if target.exists():
                      continue
                  matches = [
                      name for name in names
                      if name.replace("\\", "/").endswith(str(target).replace("\\", "/"))
                  ]
                  if not matches:
                      matches = [name for name in names if Path(name).name == target.name]
                  if not matches:
                      continue
                  member = matches[0]
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(member) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst, length=1024 * 1024)
                  with open("diagnostic_inventory/recovery_sources.txt", "a", encoding="utf-8") as out:
                      out.write(
                          f"{target}\tartifact={os.environ['ARTIFACT_ID']}\tname={os.environ['ARTIFACT_NAME']}\tmember={member}\n"
                      )
                  print(f"Recovered {target} from artifact member {member}")
          PY
            rm -f "$archive"
          done < diagnostic_inventory/artifacts.tsv

      - name: Record input inventory
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p diagnostic_inventory
          {
            echo "results_cache_hit=${{ steps.results-cache.outputs.cache-hit }}"
            echo "results_cache_primary_key=${{ steps.results-cache.outputs.cache-primary-key }}"
            echo "raster_cache_hit=${{ steps.raster-cache.outputs.cache-hit }}"
            echo "raster_cache_primary_key=${{ steps.raster-cache.outputs.cache-primary-key }}"
            echo "cells_present=$([[ -f "$CELLS_PATH" ]] && echo true || echo false)"
            echo "checkpoint_present=$([[ -f "$CHECKPOINT_PATH" ]] && echo true || echo false)"
            if [[ -f "$CELLS_PATH" ]]; then
              wc -l "$CELLS_PATH"
              sha256sum "$CELLS_PATH"
            fi
            if [[ -f "$CHECKPOINT_PATH" ]]; then
              ls -lh "$CHECKPOINT_PATH"
              sha256sum "$CHECKPOINT_PATH"
            fi
          } | tee diagnostic_inventory/input_status.txt
          find results -maxdepth 4 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort \
            > diagnostic_inventory/results-files.txt || true
          find data/processed -maxdepth 4 -type f -printf '%p\t%s bytes\n' 2>/dev/null | sort \
            > diagnostic_inventory/processed-files.txt || true

      - name: Require frozen numerical inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -f "$CELLS_PATH" ]] || missing+=("$CELLS_PATH")
          [[ -f "$CHECKPOINT_PATH" ]] || missing+=("$CHECKPOINT_PATH")
          if (( ${#missing[@]} )); then
            printf 'Missing frozen input: %s\n' "${missing[@]}" | tee diagnostic_inventory/missing_inputs.txt
            echo "The full numerical diagnostic cannot be substituted with a refit or synthetic map." \
              | tee -a diagnostic_inventory/missing_inputs.txt
            exit 2
          fi

      - name: Run 1,000-map bidirectional asymmetry diagnostic
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/run_local_state_asymmetry.R \
            --cells="$CELLS_PATH" \
            --presence-checkpoint="$CHECKPOINT_PATH" \
            --max-draws=1000 \
            --output="$OUTPUT_DIR" \
            2>&1 | tee diagnostic_inventory/asymmetry-run.log

      - name: Validate numerical outputs
        shell: bash
        run: |
          set -euo pipefail
          Rscript validation/validate_local_state_asymmetry.R "$OUTPUT_DIR" \
            2>&1 | tee diagnostic_inventory/asymmetry-validation.log
          echo "=== Primary and sensitivity results ==="
          Rscript - <<'RS'
          x <- read.csv(
            "results/ecological_v23_local_state_asymmetry/local_state_asymmetry_summary.csv",
            check.names = FALSE
          )
          keep <- x$metric %in% c(
            "pigmented_in_white_count", "white_in_pigmented_count",
            "pigmented_in_white_rate", "white_in_pigmented_rate",
            "log_rate_ratio"
          )
          print(x[keep, c(
            "state_rule", "metric", "observed_value", "null_mean",
            "lower_95", "upper_95", "upper_p", "lower_p",
            "two_sided_p", "percentile", "n_natural_maps"
          )], row.names = FALSE)
          RS

      - name: Upload diagnostic inventory and numerical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-state-asymmetry-full-${{ github.sha }}
          path: |
            diagnostic_inventory
            results/ecological_v23_local_state_asymmetry
          if-no-files-found: warn
          retention-days: 30
