name: Manuscript story reframe

on:
  push:
    branches:
      - agent/bombus-sdm-inference-guardrails
    paths:
      - scripts/internal/reframe_manuscript_story.py

permissions:
  contents: write

jobs:
  reframe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bombus-sdm-inference-guardrails
          fetch-depth: 0
      - name: Reframe manuscript narrative
        run: python3 scripts/internal/reframe_manuscript_story.py
      - name: Commit manuscript edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manuscript/ecology-and-evolution-manuscript.md
          if git diff --cached --quiet; then
            echo "No manuscript changes to commit."
            exit 0
          fi
          git commit -m "Reframe manuscript as abiotic-biotic-anthropogenic layers"
          git push origin HEAD:agent/bombus-sdm-inference-guardrails
