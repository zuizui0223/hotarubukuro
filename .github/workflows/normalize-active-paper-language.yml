name: Normalize final JBI paper language and taxon scope

on:
  workflow_dispatch:
  push:
    branches:
      - agent/continuous-colour-isolation-human-context
    paths:
      - scripts/normalize_active_paper_language_and_taxon.py
      - scripts/upgrade_final_analysis_pipeline.py
      - submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md
      - .github/workflows/normalize-active-paper-language.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/normalize_active_paper_language_and_taxon.py
      - scripts/upgrade_final_analysis_pipeline.py
      - submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md
      - .github/workflows/normalize-active-paper-language.yml

permissions:
  contents: write

concurrency:
  group: normalize-final-jbi-paper
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: agent/continuous-colour-isolation-human-context

      - name: Apply direct spatial language and pooled taxon scope
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize_active_paper_language_and_taxon.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          git diff --check

          main=submission/jbi/JBI_main_manuscript_anonymized.md
          s1=submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md
          s3=submission/jbi/supporting/Appendix_S3_broad_environment_spatial_model.md

          grep -q '0.100608' "$main"
          grep -q 'P=0.00998' "$main"
          grep -q 'P=0.26347' "$main"
          grep -q 'rho=0.252' "$main"
          grep -q 'P=0.0009' "$main"
          grep -q 'ホタルブクロ' "$s1"
          grep -q 'ヤマホタルブクロ' "$s1"
          grep -q 'no clear genetic differentiation' "$s1"
          grep -q 'not a formal taxonomic revision' "$s1"
          ! grep -Eqi '(^|[^A-Za-z0-9])(F[_–—-]?ST|P[_–—-]?ST|Q[_–—-]?ST)([^A-Za-z0-9]|$)' "$main"
          ! grep -Eqi '(^|[^A-Za-z0-9])(F[_–—-]?ST|P[_–—-]?ST|Q[_–—-]?ST)([^A-Za-z0-9]|$)' "$s3"

      - name: Commit normalized final paper files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/normalize_active_paper_language_and_taxon.py \
            scripts/upgrade_final_analysis_pipeline.py \
            submission/jbi/JBI_main_manuscript_anonymized.md \
            submission/jbi/JBI_background_architecture.md \
            submission/jbi/JBI_main_figure_plan.md \
            submission/jbi/JBI_submission_checklist.md \
            submission/jbi/validate_jbi_submission.py \
            submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md \
            submission/jbi/supporting/Appendix_S3_broad_environment_spatial_model.md \
            paper/README.md \
            paper/analysis-map.md
          if git diff --cached --quiet; then
            echo 'final paper language already normalized'
            exit 0
          fi
          git commit -m 'Simplify spatial language and lock pooled taxon scope'
          git fetch origin agent/continuous-colour-isolation-human-context
          git rebase origin/agent/continuous-colour-isolation-human-context
          git push origin HEAD:agent/continuous-colour-isolation-human-context
