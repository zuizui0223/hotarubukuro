name: Current paper checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - run_pipeline.py
      - config/paper_pipeline.lock.json
      - paper/**
      - submission/jbi/**
      - R/**
      - scripts/**
      - analysis_sensitivity/**
      - source_build/**
      - hotarubukuro_analysis/**
      - validation/**
      - tests/**
      - pyproject.toml
      - reproducibility/**
      - docs/**
      - dependencies/**
      - .github/workflows/**
      - README.md
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

env:
  MODEL_SCORE_REFERENCE_ARTIFACT_ID: "9022276431"
  MODEL_SCORE_REFERENCE_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"

jobs:
  paper-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the curated paper map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import subprocess
          from pathlib import Path

          rows = list(csv.DictReader(Path('paper/active-file-map.csv').open(encoding='utf-8')))
          required_columns = {'role', 'section', 'path', 'status'}
          assert rows and required_columns.issubset(rows[0]), 'invalid paper map'
          paths = [row['path'].strip() for row in rows]
          assert len(paths) == len(set(paths)), 'duplicate paper-map paths'
          missing = [path for path in paths if not Path(path).is_file()]
          assert not missing, 'mapped current files are missing: ' + ', '.join(missing)
          assert not [path for path in paths if path.startswith('legacy/')], 'current paper map points into legacy'
          assert not Path('legacy').exists(), 'legacy tree must stay outside the active branch after the 2026-08-18 freeze'
          assert not Path('FINAL_PIPELINE_SUPP_MANUSCRIPT_AUDIT_2026-08-12.md').exists(), (
              'superseded root-level dated audit must stay removed'
          )

          primary = {row['path'].strip() for row in rows if row['status'].strip() == 'primary'}
          expected_primary = {
              'README.md', 'run_pipeline.py', 'config/paper_pipeline.lock.json',
              '.github/workflows/paper-pipeline.yml', '.github/workflows/paper-checks.yml',
              'docs/reproduction-guide.md', 'paper/README.md', 'paper/analysis-map.md',
              'paper/active-file-map.csv', 'validation/validate_jbi_repository_alignment.py',
              'submission/jbi/JBI_main_manuscript_anonymized.md',
              'submission/jbi/validate_jbi_submission.py', 'pyproject.toml',
          }
          assert expected_primary.issubset(primary), 'missing primary entry points: ' + ', '.join(
              sorted(expected_primary - primary)
          )

          failures = []
          for path_string in paths:
              path = Path(path_string)
              try:
                  if path.suffix == '.json':
                      json.load(path.open(encoding='utf-8'))
                  elif path.suffix == '.py':
                      compile(path.read_text(encoding='utf-8'), path_string, 'exec')
                  elif path.suffix == '.sh':
                      subprocess.run(['bash', '-n', path_string], check=True)
              except Exception as error:
                  failures.append(f'{path_string}: {error}')
          assert not failures, 'mapped-file syntax validation failed: ' + ' | '.join(failures)

          workflow_files = sorted(Path('.github/workflows').glob('*.yml'))
          checkout_v4 = 'actions/checkout@' + 'v4'
          python_v5 = 'actions/setup-python@' + 'v5'
          stale_checkout = [str(path) for path in workflow_files if checkout_v4 in path.read_text()]
          stale_python = [str(path) for path in workflow_files if python_v5 in path.read_text()]
          assert not stale_checkout, 'checkout v4 remains: ' + ', '.join(stale_checkout)
          assert not stale_python, 'setup-python v5 remains: ' + ', '.join(stale_python)
          print('curated paper-map rows:', len(rows), 'primary:', len(primary))
          PY

      - name: Validate the canonical execution plan
        run: |
          python run_pipeline.py audit --dry-run
          python validation/validate_jbi_repository_alignment.py
          python submission/jbi/validate_jbi_submission.py

      - name: Confirm the single front door and frozen-history separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'python run_pipeline.py audit' README.md
          grep -q 'python run_pipeline.py reproduce' README.md
          grep -q 'python run_pipeline.py audit' docs/reproduction-guide.md
          grep -q 'python run_pipeline.py reproduce' docs/reproduction-guide.md
          test -s config/paper_pipeline.lock.json
          test -s reproducibility/final_integrated_pipeline_2026-08-12.md
          test -s reproducibility/current_broad_human_primary_2026-08-12.md
          test -s reproducibility/FROZEN_RELEASE_2026-08-18.md
          test -s reproducibility/frozen_release_2026-08-18.json
          test -s docs/repository-layout.md
          test ! -e legacy
          grep -q 'ddb1c262b8332c94f4b94e572ab930a648e59553' reproducibility/FROZEN_RELEASE_2026-08-18.md
          grep -q 'archive/jbi-final-2026-08-18-pre-cleanup' reproducibility/FROZEN_RELEASE_2026-08-18.md

      - name: Install and run Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest
          hotarubukuro-paper audit --dry-run
          hotarubukuro-color --help >/dev/null

  current-r-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Parse mapped R sources
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          map <- utils::read.csv('paper/active-file-map.csv', check.names = FALSE, stringsAsFactors = FALSE)
          paths <- sort(unique(map$path[grepl('\\.R$', map$path)]))
          if (!length(paths)) stop('No mapped R sources are registered.')
          missing <- paths[!file.exists(paths)]
          if (length(missing)) stop('Missing mapped R sources: ', paste(missing, collapse = ', '))
          failures <- character()
          for (path in paths) {
            tryCatch(parse(file = path, keep.source = FALSE), error = function(error) {
              failures <<- c(failures, paste0(path, ': ', conditionMessage(error)))
            })
          }
          if (length(failures)) stop('R syntax validation failed:\n  ', paste(failures, collapse = '\n  '), call. = FALSE)
          cat('Parsed', length(paths), 'mapped R sources.\n')
          RS

      - name: Restore test and reproducibility packages
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir /tmp/current-paper-test-environment
          --scopes testing,reproducibility

      - name: Run current R unit tests
        run: Rscript tests/testthat.R

  broad-model-aligned-space-null:
    name: Model-aligned environmental score versus space-only expectation
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      INLA_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      POSTERIOR_SAMPLES: "500"
      ANALYSIS_SEED: "20260725"
      MAX_PAIRS_PER_FOLD: "15000"
      GEO_BINS: "5"

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: broad-model-score-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            broad-excess-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R analysis environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility/broad_model_aligned_space_null_environment
          --scopes analysis,reproducibility

      - name: Restore checksum-locked Broad evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference-artifact /tmp/broad-reference.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${MODEL_SCORE_REFERENCE_ARTIFACT_ID}/zip" \
            -o /tmp/broad-reference.zip
          actual="$(sha256sum /tmp/broad-reference.zip | awk '{print $1}')"
          test "$actual" = "$MODEL_SCORE_REFERENCE_ARTIFACT_SHA256"
          mkdir -p reference-artifact
          unzip -q /tmp/broad-reference.zip -d reference-artifact
          observations=reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv
          cells=reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv
          test -s "$observations"
          test -s "$cells"

      - name: Fit cross-fitted full models and space-only nulls
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/fit_broad_model_aligned_space_null.R \
            --observations=reference-artifact/results/ecological_v11_pigmentation_hurdle/analysis_data_pigmentation_hurdle.csv \
            --cells=reference-artifact/results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv \
            --output=results/broad_model_aligned_space_null \
            --samples=${POSTERIOR_SAMPLES} \
            --seed=${ANALYSIS_SEED} \
            --max-pairs-per-fold=${MAX_PAIRS_PER_FOLD} \
            --geo-bins=${GEO_BINS}

      - name: Validate output contract and final-model identity
        shell: bash
        run: |
          set -euo pipefail
          out=results/broad_model_aligned_space_null
          for file in \
            primary_model_aligned_space_null_test.csv \
            matched_distance_stratum_contrasts.csv \
            heldout_pair_model_score_excess.csv \
            heldout_model_environment_scores.csv \
            heldout_space_null_predictions.csv \
            full_data_fixed_effects.csv \
            crossfit_fixed_effects.csv \
            fit_log.csv \
            space_null_global_contrast_draws.csv \
            analysis_metadata.csv \
            RESULT_SUMMARY.md; do
            test -s "$out/$file"
          done

          python3 - "$out" <<'PY'
          import csv, math, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          def rows(name):
              with (root / name).open(newline='', encoding='utf-8') as handle:
                  return list(csv.DictReader(handle))
          primary = rows('primary_model_aligned_space_null_test.csv')
          assert len(primary) == 2
          assert {r['response'] for r in primary} == {
              'pigmentation_state', 'conditional_intensity'
          }
          for row in primary:
              assert int(float(row['n_fold_geo_strata'])) == 25
              for field in (
                  'observed_contrast', 'space_null_median',
                  'phenotype_excess_over_space_null',
                  'posterior_predictive_p_upper'
              ):
                  assert math.isfinite(float(row[field]))
          scores = rows('heldout_model_environment_scores.csv')
          counts = {}
          for row in scores:
              counts[row['response']] = counts.get(row['response'], 0) + 1
          assert counts == {
              'pigmentation_state': 1305,
              'conditional_intensity': 674
          }, counts
          coefficients = rows('full_data_fixed_effects.csv')
          lookup = {(r['response'], r['term']): float(r['mean']) for r in coefficients}
          expected = {
              ('pigmentation_state', 'env_Temperature_PC1'): -0.54185,
              ('conditional_intensity', 'env_precip_PC1'): -0.17412,
              ('conditional_intensity', 'env_TemperatureSeasonality'): 0.20741,
              ('conditional_intensity', 'env_topo_PC1'): -0.13373,
              ('conditional_intensity', 'int_thermal_variability'): -0.20423,
          }
          for key, target in expected.items():
              assert key in lookup
              assert abs(lookup[key] - target) <= 0.02, (key, lookup[key], target)
          print('validated model-aligned output:', counts)
          PY

      - name: Record provenance
        if: always()
        shell: bash
        run: |
          mkdir -p results/broad_model_aligned_space_null
          {
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "reference_artifact_id=${MODEL_SCORE_REFERENCE_ARTIFACT_ID}"
            echo "reference_artifact_sha256=${MODEL_SCORE_REFERENCE_ARTIFACT_SHA256}"
            echo "posterior_samples=${POSTERIOR_SAMPLES}"
            echo "seed=${ANALYSIS_SEED}"
            echo "max_pairs_per_fold=${MAX_PAIRS_PER_FOLD}"
            echo "geo_bins=${GEO_BINS}"
          } > results/broad_model_aligned_space_null/workflow_provenance.txt

      - name: Upload model-aligned results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-model-aligned-space-null-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/broad_model_aligned_space_null
            reproducibility/broad_model_aligned_space_null_environment
            reference-artifact/reference_lock.txt
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
