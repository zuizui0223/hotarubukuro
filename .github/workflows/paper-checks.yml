name: Current paper checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - run_pipeline.py
      - config/paper_pipeline.lock.json
      - paper/**
      - submission/jbi/**
      - R/**
      - scripts/**
      - analysis_sensitivity/**
      - source_build/**
      - validation/**
      - tests/**
      - pyproject.toml
      - reproducibility/**
      - docs/**
      - dependencies/**
      - .github/workflows/**
      - README.md
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  paper-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate the curated paper map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import subprocess
          from pathlib import Path

          rows = list(csv.DictReader(Path('paper/active-file-map.csv').open(encoding='utf-8')))
          required_columns = {'role', 'section', 'path', 'status'}
          assert rows and required_columns.issubset(rows[0]), 'invalid paper map'
          paths = [row['path'].strip() for row in rows]
          assert len(paths) == len(set(paths)), 'duplicate paper-map paths'
          missing = [path for path in paths if not Path(path).is_file()]
          assert not missing, 'mapped current files are missing: ' + ', '.join(missing)
          assert not [path for path in paths if path.startswith('legacy/')], 'current paper map points into legacy'
          assert not Path('FINAL_PIPELINE_SUPP_MANUSCRIPT_AUDIT_2026-08-12.md').exists(), (
              'superseded root-level dated audit must stay removed'
          )

          primary = {row['path'].strip() for row in rows if row['status'].strip() == 'primary'}
          expected_primary = {
              'README.md', 'run_pipeline.py', 'config/paper_pipeline.lock.json',
              '.github/workflows/paper-pipeline.yml', '.github/workflows/paper-checks.yml',
              'docs/reproduction-guide.md', 'paper/README.md', 'paper/analysis-map.md',
              'paper/active-file-map.csv', 'validation/validate_jbi_repository_alignment.py',
              'submission/jbi/JBI_main_manuscript_anonymized.md',
              'submission/jbi/validate_jbi_submission.py', 'pyproject.toml',
          }
          assert expected_primary.issubset(primary), 'missing primary entry points: ' + ', '.join(
              sorted(expected_primary - primary)
          )

          failures = []
          for path_string in paths:
              path = Path(path_string)
              try:
                  if path.suffix == '.json':
                      json.load(path.open(encoding='utf-8'))
                  elif path.suffix == '.py':
                      compile(path.read_text(encoding='utf-8'), path_string, 'exec')
                  elif path.suffix == '.sh':
                      subprocess.run(['bash', '-n', path_string], check=True)
              except Exception as error:
                  failures.append(f'{path_string}: {error}')
          assert not failures, 'mapped-file syntax validation failed: ' + ' | '.join(failures)

          workflow_files = sorted(Path('.github/workflows').glob('*.yml'))
          checkout_v4 = 'actions/checkout@' + 'v4'
          python_v5 = 'actions/setup-python@' + 'v5'
          stale_checkout = [str(path) for path in workflow_files if checkout_v4 in path.read_text()]
          stale_python = [str(path) for path in workflow_files if python_v5 in path.read_text()]
          assert not stale_checkout, 'checkout v4 remains: ' + ', '.join(stale_checkout)
          assert not stale_python, 'setup-python v5 remains: ' + ', '.join(stale_python)
          print('curated paper-map rows:', len(rows), 'primary:', len(primary))
          PY

      - name: Validate the canonical execution plan
        run: |
          python run_pipeline.py audit --dry-run
          python validation/validate_jbi_repository_alignment.py
          python submission/jbi/validate_jbi_submission.py

      - name: Confirm the single front door and legacy separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'python run_pipeline.py audit' README.md
          grep -q 'python run_pipeline.py reproduce' README.md
          grep -q 'python run_pipeline.py audit' docs/reproduction-guide.md
          grep -q 'python run_pipeline.py reproduce' docs/reproduction-guide.md
          test -s config/paper_pipeline.lock.json
          test -s reproducibility/final_integrated_pipeline_2026-08-12.md
          test -s reproducibility/current_broad_human_primary_2026-08-12.md
          test -s legacy/reproducibility-development/superseded-current-input-anomaly-pipeline-2026-08-12/README.md

      - name: Install and run Python tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest

  current-r-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Parse mapped R sources
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          map <- utils::read.csv('paper/active-file-map.csv', check.names = FALSE, stringsAsFactors = FALSE)
          paths <- sort(unique(map$path[grepl('\\.R$', map$path)]))
          if (!length(paths)) stop('No mapped R sources are registered.')
          missing <- paths[!file.exists(paths)]
          if (length(missing)) stop('Missing mapped R sources: ', paste(missing, collapse = ', '))
          failures <- character()
          for (path in paths) {
            tryCatch(parse(file = path, keep.source = FALSE), error = function(error) {
              failures <<- c(failures, paste0(path, ': ', conditionMessage(error)))
            })
          }
          if (length(failures)) stop('R syntax validation failed:\n  ', paste(failures, collapse = '\n  '), call. = FALSE)
          cat('Parsed', length(paths), 'mapped R sources.\n')
          RS

      - name: Restore test and reproducibility packages
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir /tmp/current-paper-test-environment
          --scopes testing,reproducibility

      - name: Run current R unit tests
        run: Rscript tests/testthat.R
