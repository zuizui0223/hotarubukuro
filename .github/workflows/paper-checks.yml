name: Current paper checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/repository-cleanup-legacy
    paths:
      - paper/**
      - submission/jbi/**
      - scripts/**
      - source_build/**
      - validation/**
      - reproducibility/**
      - docs/**
      - inputs/**
      - .github/workflows/**
      - README.md
      - legacy/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  current-paper-map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate active file map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          rows = list(csv.DictReader(open('paper/active-file-map.csv', encoding='utf-8')))
          assert rows, 'paper/active-file-map.csv is empty'
          paths = [
              r['path'].strip() for r in rows
              if (r.get('status') or '').startswith('active')
          ]
          assert len(paths) == len(set(paths)), 'duplicate active paths'
          missing = [p for p in paths if not Path(p).is_file()]
          assert not missing, 'missing active paper files: ' + ', '.join(missing)
          legacy = [p for p in paths if p.startswith('legacy/')]
          assert not legacy, 'active paper map points into legacy: ' + ', '.join(legacy)
          print('active/current infrastructure files:', len(paths))
          PY

      - name: Confirm legacy separation
        shell: bash
        run: |
          set -euo pipefail
          test ! -d manuscript
          test ! -d reports
          for path in \
            submission/jbi/JBI_background_architecture.md \
            submission/jbi/JBI_narrative_dependency_architecture.md \
            docs/bombus-pollinator-opportunity-proxy.md \
            docs/bombus-sdm-inference.md \
            source_build/audit_population_flow_1965.R \
            source_build/build_bombus_sdm.R \
            source_build/project_bombus_sdm_national.R \
            validation/compare_bombus_national_projections.R \
            .github/workflows/analysis-1909.yml \
            .github/workflows/bombus-limitation-gate.yml \
            .github/workflows/bombus-relaxation-local-current-inputs.yml \
            .github/workflows/bombus-effective-availability-refined.yml \
            scripts/run_analysis_1909.sh \
            scripts/check_analysis_population.R \
            scripts/run_bombus_limitation_gate.R \
            scripts/run_bombus_limitation_gate_current_inputs.R \
            scripts/run_bombus_relaxation_local_contrast.R \
            scripts/run_bombus_effective_availability_refined.R \
            scripts/run_publication_pipeline.R \
            R/local_bombus_turnover.R \
            R/final_registry.R \
            reproducibility/current_input_reanalysis_2026-08-08.md \
            reproducibility/bombus_effective_availability_refinement_spec_2026-08-08.md \
            reproducibility/bombus_effective_availability_refinement_results_2026-08-08.md \
            reproducibility/submission_reference; do
            test ! -e "$path" || { echo "superseded file remains active: $path" >&2; exit 1; }
          done
          test -s legacy/README.md
          test -s legacy/MOVED_2026-08-09.md
          test -d legacy/manuscript-development
          test -d legacy/manuscript-development/jbi-notes
          test -d legacy/method-development
          test -d legacy/workflows
          test -d legacy/reproducibility-development
          test -d legacy/source-build-prototypes

      - name: Confirm current replacements
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/bombus-inference-current.md
          test -s scripts/build_bombus_occurrence_reference_support.R
          test -s source_build/build_bombus_sdm_mainland.R
          test -s validation/compare_bombus_sdm_rebuilds.R
          test -s reproducibility/bombus_occurrence_reference_support_2026-08-09.md
          test -s reproducibility/current_broad_anomaly_reference_2026-08-09.md
          test -s .github/workflows/bombus-occurrence-reference-support.yml
          test -s inputs/canonical_snapshot.json
          test -s scripts/canonical_snapshot.sh
          grep -q '2 species = directional local availability hypothesis' docs/bombus-inference-current.md
          grep -q '5 species = supplementary community/biogeographic turnover' docs/bombus-inference-current.md
          ! grep -q 'Active 1,909 question' docs/bombus-inference-current.md

      - name: Validate JBI package
        run: python submission/jbi/validate_jbi_submission.py

      - name: Confirm manuscript-facing entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/README.md
          test -s paper/analysis-map.md
          test -s paper/active-file-map.csv
          test -s submission/jbi/JBI_main_manuscript_anonymized.md
          test -s submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md
          grep -q 'single entry point' paper/README.md
          grep -q 'Current paper — start here' README.md
          grep -q 'docs/bombus-inference-current.md' paper/active-file-map.csv
