name: Current paper checks

on:
  workflow_dispatch:
  push:
    branches: [main, agent/final-jbi-clean]
    paths:
      - run_pipeline.py
      - config/paper_pipeline.lock.json
      - paper/**
      - submission/jbi/**
      - R/**
      - scripts/**
      - analysis_sensitivity/**
      - source_build/**
      - hotarubukuro_analysis/**
      - validation/**
      - tests/**
      - pyproject.toml
      - reproducibility/**
      - docs/**
      - dependencies/**
      - .github/workflows/**
      - README.md
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  paper-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate curated active-file map
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import json
          import subprocess
          from pathlib import Path

          rows = list(csv.DictReader(Path('paper/active-file-map.csv').open(encoding='utf-8')))
          required_columns = {'role', 'section', 'path', 'status'}
          assert rows and required_columns.issubset(rows[0]), 'invalid paper map'
          paths = [row['path'].strip() for row in rows]
          assert len(paths) == len(set(paths)), 'duplicate paper-map paths'
          missing = [path for path in paths if not Path(path).is_file()]
          assert not missing, 'mapped current files are missing: ' + ', '.join(missing)
          assert not [path for path in paths if path.startswith('legacy/')], 'active paper map points into legacy'

          primary = {row['path'].strip() for row in rows if row['status'].strip() == 'primary'}
          expected_primary = {
              'README.md', 'run_pipeline.py', 'config/paper_pipeline.lock.json',
              '.github/workflows/paper-pipeline.yml', '.github/workflows/paper-checks.yml',
              'docs/reproduction-guide.md', 'paper/README.md', 'paper/analysis-map.md',
              'paper/active-file-map.csv', 'validation/validate_jbi_repository_alignment.py',
              'submission/jbi/JBI_main_manuscript_anonymized.md',
              'submission/jbi/validate_jbi_submission.py', 'pyproject.toml',
              'reproducibility/FINAL_RESULTS_2026-08-19.md',
          }
          assert expected_primary.issubset(primary), 'missing primary entry points: ' + ', '.join(
              sorted(expected_primary - primary)
          )

          failures = []
          for path_string in paths:
              path = Path(path_string)
              try:
                  if path.suffix == '.json':
                      json.load(path.open(encoding='utf-8'))
                  elif path.suffix == '.py':
                      compile(path.read_text(encoding='utf-8'), path_string, 'exec')
                  elif path.suffix == '.sh':
                      subprocess.run(['bash', '-n', path_string], check=True)
              except Exception as error:
                  failures.append(f'{path_string}: {error}')
          assert not failures, 'mapped-file syntax validation failed: ' + ' | '.join(failures)
          print('curated paper-map rows:', len(rows), 'primary:', len(primary))
          PY

      - name: Validate canonical execution plan and manuscript
        shell: bash
        run: |
          set -euo pipefail
          python run_pipeline.py audit --dry-run
          python validation/validate_jbi_repository_alignment.py
          python submission/jbi/validate_jbi_submission.py

      - name: Confirm final scientific locks and single front door
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'python run_pipeline.py audit' README.md
          grep -q 'python run_pipeline.py reproduce' README.md
          grep -q 'python run_pipeline.py audit' docs/reproduction-guide.md
          grep -q 'python run_pipeline.py reproduce' docs/reproduction-guide.md
          grep -q 'restore_broad_supported_term_distance' docs/reproduction-guide.md
          test -s config/paper_pipeline.lock.json
          test -s reproducibility/FINAL_RESULTS_2026-08-19.md
          test -s reproducibility/final_analysis_pipeline_integration_2026-08-19.md
          test -s reproducibility/broad_supported_term_distance_space_null_2026-08-19.md
          test -s reproducibility/continuous_colour_isolation_human_context_result_2026-08-18.md
          ! grep -q '0.106802' submission/jbi/JBI_main_manuscript_anonymized.md
          ! grep -q '0.03393' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q '0.100608' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q 'P=0.00998' submission/jbi/JBI_main_manuscript_anonymized.md
          grep -q 'P=0.26347' submission/jbi/JBI_main_manuscript_anonymized.md

      - name: Confirm transition machinery is absent
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/final-manuscript-freeze.yml \
            .github/workflows/final-manuscript-upgrade.yml \
            .github/workflows/integrate-continuous-isolation-manuscript.yml \
            .github/workflows/normalize-active-paper-language.yml \
            .github/workflows/sync-final-manuscript-and-figures.yml \
            scripts/demote_event_analysis_to_supplement.py \
            scripts/integrate_continuous_isolation_manuscript.py \
            scripts/normalize_active_paper_language_and_taxon.py \
            scripts/register_continuous_isolation_paper_contract.py \
            scripts/run_continuous_isolation_paper_contract.py \
            scripts/upgrade_final_analysis_pipeline.py; do
            test ! -e "$path"
          done
