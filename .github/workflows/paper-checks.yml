name: Current paper checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/repository-cleanup-legacy
    paths:
      - paper/**
      - submission/jbi/**
      - R/**
      - scripts/**
      - source_build/**
      - validation/**
      - tests/**
      - pyproject.toml
      - reproducibility/**
      - docs/**
      - inputs/**
      - data/**
      - results/**
      - dependencies/**
      - config/**
      - .github/workflows/**
      - README.md
      - legacy/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  current-paper-map:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate active file map and executable reachability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from collections import defaultdict
          from pathlib import Path

          rows = list(csv.DictReader(open('paper/active-file-map.csv', encoding='utf-8')))
          assert rows, 'paper/active-file-map.csv is empty'
          paths = [
              r['path'].strip() for r in rows
              if (r.get('status') or '').startswith('active')
          ]
          assert len(paths) == len(set(paths)), 'duplicate active paths'
          active = set(paths)
          missing = [p for p in paths if not Path(p).is_file()]
          assert not missing, 'missing active paper files: ' + ', '.join(missing)
          legacy = [p for p in paths if p.startswith('legacy/')]
          assert not legacy, 'active paper map points into legacy: ' + ', '.join(legacy)

          # These directories are closed current interfaces. Every committed
          # file under them must be registered, otherwise an orphan can look
          # current merely because it remains executable or sits beside the
          # current manuscript package.
          closed_roots = (
              '.github/workflows', 'paper', 'submission/jbi', 'R', 'scripts',
              'source_build', 'validation', 'tests', 'config', 'dependencies',
              'inputs', 'data', 'results', 'docs', 'reproducibility'
          )
          for root in closed_roots:
              files = {
                  str(path) for path in Path(root).rglob('*') if path.is_file()
              }
              unmapped = sorted(files - active)
              assert not unmapped, f'unmapped current files under {root}: ' + ', '.join(unmapped)

          root_files = {
              path for path in ('README.md', 'Data_S1.csv', 'Code_S1.py', 'pyproject.toml')
              if Path(path).is_file()
          }
          unmapped_root = sorted(root_files - active)
          assert not unmapped_root, (
              'unmapped current root entry points: ' + ', '.join(unmapped_root)
          )

          # Every active R validator must be reachable from a current driver or
          # source-build workflow. Unit tests are reached through testthat/pytest
          # directory discovery and are checked separately below.
          routing_text = '\n'.join(
              Path(path).read_text(encoding='utf-8')
              for path in (
                  'scripts/run_downstream_current_inputs.sh',
                  '.github/workflows/rebuild-bombus-sdm.yml',
              )
          )
          validators = sorted(
              str(path) for path in Path('validation').glob('*.R')
          )
          unreachable = [path for path in validators if path not in routing_text]
          assert not unreachable, 'active validators have no execution route: ' + ', '.join(unreachable)

          # A package may intentionally serve more than one scope (for example
          # analysis and lightweight unit tests), but the same package/scope
          # declaration must be unique and its source must not disagree across
          # scopes.
          dependency_path = Path('dependencies/r-packages.csv')
          dependencies = list(csv.DictReader(dependency_path.open(encoding='utf-8')))
          required_columns = {'package', 'source', 'scope', 'purpose'}
          assert dependencies, 'dependencies/r-packages.csv is empty'
          assert required_columns.issubset(dependencies[0]), (
              'dependencies/r-packages.csv is missing required columns'
          )
          keys = [
              (row['package'].strip(), row['scope'].strip())
              for row in dependencies
          ]
          duplicate_keys = sorted({key for key in keys if keys.count(key) > 1})
          assert not duplicate_keys, (
              'duplicate package/scope declarations: ' +
              ', '.join(f'{package}:{scope}' for package, scope in duplicate_keys)
          )
          blank_rows = [
              index + 2 for index, row in enumerate(dependencies)
              if any(not row[column].strip() for column in required_columns)
          ]
          assert not blank_rows, (
              'blank dependency fields on rows: ' +
              ', '.join(map(str, blank_rows))
          )
          sources = defaultdict(set)
          for row in dependencies:
              sources[row['package'].strip()].add(row['source'].strip())
          conflicts = sorted(
              package for package, values in sources.items() if len(values) != 1
          )
          assert not conflicts, (
              'packages have conflicting declared sources: ' + ', '.join(conflicts)
          )

          print('active/current infrastructure files:', len(paths))
          print('closed current directories:', len(closed_roots))
          print('reachable current validators:', len(validators))
          print('declared package/scope rows:', len(dependencies))
          PY

      - name: Validate current R loader boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('R/pipeline_support.R')
          text = path.read_text(encoding='utf-8')
          forbidden = [
              'active 1,909-observation analysis',
              'R/local_bombus_turnover.R',
              'R/final_registry.R',
              'bombus_limitation_gate =',
              'local_bombus_turnover =',
              'final_registry = "final_registry"',
          ]
          found = [x for x in forbidden if x in text]
          assert not found, 'stale loader entries remain: ' + ', '.join(found)

          block = re.search(r'hb_module_files\s*<-\s*c\((.*?)\n\)', text, re.S)
          assert block, 'could not parse hb_module_files'
          modules = re.findall(r'=\s*"([^"]+)"', block.group(1))
          assert modules, 'hb_module_files contains no paths'
          assert not any(p.startswith('legacy/') for p in modules), 'loader points into legacy'
          missing = [p for p in modules if not Path(p).is_file()]
          assert not missing, 'loader points to missing modules: ' + ', '.join(missing)
          print('current R loader modules:', len(modules))
          PY

      - name: Confirm legacy separation
        shell: bash
        run: |
          set -euo pipefail
          test ! -d manuscript
          test ! -d reports

          # These paths encode superseded result identities, abandoned Bombus
          # estimands, obsolete drafts, one-off development utilities, or the
          # old full-canonical/submission-lock interface. Current JBI narrative
          # architecture is intentionally NOT on this list.
          for path in \
            docs/bombus-pollinator-opportunity-proxy.md \
            docs/bombus-sdm-inference.md \
            dependencies/local-path-allowlist.txt \
            source_build/audit_population_flow_1965.R \
            source_build/build_bombus_sdm.R \
            source_build/project_bombus_sdm_national.R \
            validation/compare_bombus_national_projections.R \
            validation/audit_phenotype.R \
            validation/audit_multiscale_hotspots.R \
            validation/audit_human_landscape_features.R \
            .github/workflows/analysis-1909.yml \
            .github/workflows/bombus-limitation-gate.yml \
            .github/workflows/bombus-relaxation-local-current-inputs.yml \
            .github/workflows/bombus-effective-availability-refined.yml \
            scripts/run_analysis_1909.sh \
            scripts/check_analysis_population.R \
            scripts/run_bombus_limitation_gate.R \
            scripts/run_bombus_limitation_gate_current_inputs.R \
            scripts/run_bombus_relaxation_local_contrast.R \
            scripts/run_bombus_effective_availability_refined.R \
            scripts/run_publication_pipeline.R \
            scripts/preflight.R \
            scripts/write_reproducibility_report.R \
            scripts/write_submission_analysis_lock.R \
            scripts/stage_canonical_snapshot.R \
            scripts/verify_canonical_snapshot.R \
            R/local_bombus_turnover.R \
            R/final_registry.R \
            reproducibility/current_input_reanalysis_2026-08-08.md \
            reproducibility/bombus_effective_availability_refinement_spec_2026-08-08.md \
            reproducibility/bombus_effective_availability_refinement_results_2026-08-08.md \
            reproducibility/submission_reference; do
            test ! -e "$path" || { echo "superseded file remains active: $path" >&2; exit 1; }
          done

          for path in \
            legacy/reproducibility-development/dependencies/local-path-allowlist.txt \
            legacy/reproducibility-development/scripts/preflight.R \
            legacy/reproducibility-development/scripts/write_reproducibility_report.R \
            legacy/reproducibility-development/scripts/write_submission_analysis_lock.R \
            legacy/reproducibility-development/scripts/stage_canonical_snapshot.R \
            legacy/reproducibility-development/scripts/verify_canonical_snapshot.R \
            legacy/reproducibility-development/validation/audit_phenotype.R \
            legacy/reproducibility-development/validation/audit_multiscale_hotspots.R \
            legacy/reproducibility-development/validation/audit_human_landscape_features.R; do
            test -s "$path" || { echo "archived utility missing: $path" >&2; exit 1; }
          done

          test -s legacy/reproducibility-development/validation/README.md
          test -s legacy/README.md
          test -s legacy/MOVED_2026-08-09.md
          test -s legacy/REPOSITORY_CLEANUP_MAP.md
          test -d legacy/manuscript-development
          test -d legacy/method-development
          test -d legacy/workflows
          test -d legacy/reproducibility-development
          test -d legacy/source-build-prototypes

      - name: Confirm current replacements
        shell: bash
        run: |
          set -euo pipefail
          test -s submission/jbi/JBI_background_architecture.md
          test -s submission/jbi/JBI_narrative_dependency_architecture.md
          test -s docs/bombus-inference-current.md
          test -s scripts/README.md
          test -s source_build/README.md
          test -s inputs/README.md
          test -s results/README.md
          test -s scripts/setup_r_environment.R
          test -s scripts/canonical_snapshot.sh
          test -s scripts/build_bombus_occurrence_reference_support.R
          test -s source_build/build_bombus_sdm_mainland.R
          test -s config/color_extraction.json
          test -s data/processed/Data_S1_v2_manifest.json
          test -s validation/README.md
          test -s validation/validate_natural_predictive_model.R
          test -s validation/validate_joint_submission_isolate_ppc.R
          test -s validation/compare_bombus_sdm_rebuilds.R
          test -s tests/README.md
          test -s reproducibility/bombus_occurrence_reference_support_2026-08-09.md
          test -s reproducibility/current_broad_anomaly_reference_2026-08-09.md
          test -s .github/workflows/bombus-occurrence-reference-support.yml
          test -s inputs/canonical_snapshot.json
          grep -q 'validation/validate_natural_predictive_model.R' scripts/run_downstream_current_inputs.sh
          grep -q 'validation/validate_joint_submission_isolate_ppc.R' scripts/run_downstream_current_inputs.sh
          grep -q -- '--baseline=reconstruction' scripts/run_downstream_current_inputs.sh
          grep -q 'candidate_identity_dynamic' validation/validate_joint_submission_isolate_ppc.R
          ! grep -Eq '18L|==[[:space:]]*18([^0-9]|$)' validation/validate_joint_submission_isolate_ppc.R
          grep -q '2 species = directional local availability hypothesis' docs/bombus-inference-current.md
          grep -q '5 species = supplementary community/biogeographic turnover' docs/bombus-inference-current.md
          ! grep -q 'Active 1,909 question' docs/bombus-inference-current.md

      - name: Validate JBI package
        run: python submission/jbi/validate_jbi_submission.py

      - name: Confirm manuscript-facing entry points
        shell: bash
        run: |
          set -euo pipefail
          test -s paper/README.md
          test -s paper/analysis-map.md
          test -s paper/active-file-map.csv
          test -s submission/jbi/JBI_main_manuscript_anonymized.md
          test -s submission/jbi/supporting/Appendix_S1_yamap_public_benchmark.md
          grep -q 'single entry point' paper/README.md
          grep -q 'Current paper — start here' README.md
          grep -q 'submission/jbi/JBI_background_architecture.md' paper/active-file-map.csv
          grep -q 'submission/jbi/JBI_narrative_dependency_architecture.md' paper/active-file-map.csv
          grep -q 'R/pipeline_support.R' paper/active-file-map.csv
          grep -q 'R/natural_predictive_model.R' paper/active-file-map.csv
          grep -q 'scripts/setup_r_environment.R' paper/active-file-map.csv
          grep -q 'dependencies/inla.csv' paper/active-file-map.csv
          grep -q 'config/color_extraction.json' paper/active-file-map.csv
          grep -q 'data/processed/Data_S1_v2_manifest.json' paper/active-file-map.csv
          grep -q 'validation/README.md' paper/active-file-map.csv
          grep -q 'tests/testthat.R' paper/active-file-map.csv
          grep -q 'tests/python/test_extract_color.py' paper/active-file-map.csv
          grep -q 'source_build/build_bombus_sdm_mainland.R' paper/active-file-map.csv
          grep -q 'docs/bombus-inference-current.md' paper/active-file-map.csv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run current Python unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest

  current-r-unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Parse every active R source
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          map <- utils::read.csv(
            "paper/active-file-map.csv",
            check.names = FALSE,
            stringsAsFactors = FALSE
          )
          active <- startsWith(map$status, "active")
          paths <- sort(unique(map$path[active & grepl("\\.R$", map$path)]))
          if (!length(paths)) stop("No active R sources are registered.")
          missing <- paths[!file.exists(paths)]
          if (length(missing)) {
            stop("Missing active R sources: ", paste(missing, collapse = ", "))
          }
          failures <- character()
          for (path in paths) {
            tryCatch(
              parse(file = path, keep.source = FALSE),
              error = function(error) {
                failures <<- c(
                  failures,
                  paste0(path, ": ", conditionMessage(error))
                )
              }
            )
          }
          if (length(failures)) {
            stop(
              "R syntax validation failed:\n  ",
              paste(failures, collapse = "\n  "),
              call. = FALSE
            )
          }
          cat("Parsed", length(paths), "active R sources.\n")
          RS

      - name: Restore test and reproducibility packages
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir /tmp/current-paper-test-environment
          --scopes testing,reproducibility

      - name: Run current R unit tests
        run: Rscript tests/testthat.R
