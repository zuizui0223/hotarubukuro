name: Paper pipeline

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Pipeline profile
        required: true
        default: audit
        type: choice
        options:
          - audit
          - reproduce
      resume:
        description: Reuse complete outputs when present
        required: true
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - run_pipeline.py
      - config/paper_pipeline.lock.json
      - paper/**
      - submission/jbi/**
      - docs/reproduction-guide.md
      - docs/broad_spatial_inertia_environment_tracking.md
      - validation/**
      - scripts/**
      - analysis_sensitivity/**
      - R/**
      - source_build/**
      - tests/**
      - dependencies/**
      - pyproject.toml
      - .github/workflows/**
      - README.md
  push:
    branches: [main]
    paths:
      - run_pipeline.py
      - config/paper_pipeline.lock.json
      - paper/**
      - submission/jbi/**
      - docs/reproduction-guide.md
      - docs/broad_spatial_inertia_environment_tracking.md
      - validation/**
      - scripts/**
      - analysis_sensitivity/**
      - R/**
      - source_build/**
      - tests/**
      - dependencies/**
      - pyproject.toml
      - .github/workflows/**
      - README.md

permissions:
  contents: read
  actions: read

concurrency:
  group: paper-pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"

jobs:
  select-profile:
    name: Select audit or full reproduction
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.select.outputs.profile }}
      resume: ${{ steps.select.outputs.resume }}
    steps:
      - name: Check out enough history to classify PR changes
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select execution profile
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_RESUME: ${{ inputs.resume }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          profile=audit
          resume=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            profile="${REQUESTED_PROFILE:-audit}"
            resume="${REQUESTED_RESUME:-false}"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            printf '%s\n' "$changed"
            integration_pattern='^(run_pipeline\.py|config/paper_pipeline\.lock\.json|\.github/workflows/paper-pipeline\.yml|validation/validate_jbi_repository_alignment\.py|tests/python/test_run_pipeline\.py|pyproject\.toml|dependencies/|R/(broad_spatial_inertia_environment_tracking|natural_predictive_model|pipeline_support)\.R|scripts/(setup_r_environment|fit_broad_space_null_phenotype_excess|run_broad_space_null_phenotype_excess_pipeline|build_bombus_occurrence_reference_support|run_bombus_local_sharp_transition|render_jbi_main_figures_final_broad|build_jbi_submission_bundle|jbi_submission_bundle_core|validate_jbi_submission_bundle)\.(R|py)|analysis_sensitivity/(audit_bombus_final8_environment_distance|run_human_context_current_broad_primary_fast)\.R|submission/jbi/validate_jbi_submission\.py)'
            if grep -Eq "$integration_pattern" <<<"$changed"; then
              profile=reproduce
            fi
          fi

          case "$profile" in
            audit|reproduce) ;;
            *) echo "Unsupported profile: $profile" >&2; exit 2 ;;
          esac
          case "$resume" in
            true|false) ;;
            *) echo "Unsupported resume value: $resume" >&2; exit 2 ;;
          esac

          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "selected profile=$profile resume=$resume"

  run:
    name: ${{ needs.select-profile.outputs.profile }}
    needs: select-profile
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PIPELINE_PROFILE: ${{ needs.select-profile.outputs.profile }}
      PIPELINE_RESUME: ${{ needs.select-profile.outputs.resume }}

    steps:
      - name: Check out the current paper
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Read pinned R version
        if: env.PIPELINE_PROFILE == 'reproduce'
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        if: env.PIPELINE_PROFILE == 'reproduce'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        if: env.PIPELINE_PROFILE == 'reproduce'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          cat dependencies/apt-packages.txt dependencies/submission-apt-packages.txt \
            | grep -vE '^\s*(#|$)' \
            | sort -u \
            | xargs sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        if: env.PIPELINE_PROFILE == 'reproduce'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: paper-pipeline-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            paper-pipeline-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            broad-excess-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Run canonical paper pipeline
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          resume_flag=--no-resume
          if [[ "$PIPELINE_RESUME" == "true" ]]; then
            resume_flag=--resume
          fi
          python run_pipeline.py "$PIPELINE_PROFILE" "$resume_flag"

      - name: Upload audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-pipeline-${{ env.PIPELINE_PROFILE }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/paper_pipeline
          if-no-files-found: warn
          retention-days: 90

      - name: Upload reproduced JBI package
        if: env.PIPELINE_PROFILE == 'reproduce' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jbi-paper-reproduction-${{ github.sha }}-${{ github.run_id }}
          path: |
            results/paper_pipeline
            results/broad_space_null_phenotype_excess
            results/bombus_occurrence_reference_support
            results/ecological_v18_bombus_local_sharp_transition
            results/bombus_final8_environment_audit
            results/human_context_current_broad
            results/jbi_figure_bundle
            results/jbi_submission_bundle
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
