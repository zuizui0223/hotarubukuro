name: phenology-fast-contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  fast-phenology:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Read pinned R version
        id: r-version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r-version.outputs.version }}
          use-public-rspm: true

      - name: Install minimal mixture dependency
        shell: bash
        run: Rscript -e 'install.packages("mclust", repos = "https://cloud.r-project.org")'

      - name: Download frozen continuous-isolation artifact from PR 57
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p .fast_isolation
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9317087893/zip" \
            --output .fast_isolation/isolation.zip
          unzip -q .fast_isolation/isolation.zip -d .fast_isolation/artifact
          test -s .fast_isolation/artifact/continuous_isolation_cell_metrics.csv

      - name: Reconstruct phenotype and test H1-H3
        shell: bash
        run: |
          Rscript scripts/run_human_flowering_phenology_fast.R \
            --raw Data_S1.csv \
            --isolation .fast_isolation/artifact/continuous_isolation_cell_metrics.csv \
            --output results/human_flowering_phenology_fast \
            --permutations 9999 \
            --seed 20260823
          cat results/human_flowering_phenology_fast/fast_validation.txt

      - name: Upload fast phenology result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-flowering-phenology-fast
          path: results/human_flowering_phenology_fast
          if-no-files-found: warn
