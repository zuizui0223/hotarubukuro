name: PR checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Validate the declared code manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          manifest = Path('config/code_manifest.csv')
          rows = list(csv.DictReader(manifest.open(encoding='utf-8')))
          if not rows:
              raise SystemExit('config/code_manifest.csv is empty')
          paths = [row['path'].strip() for row in rows]
          if len(paths) != len(set(paths)):
              raise SystemExit('duplicate paths in config/code_manifest.csv')
          missing = [path for path in paths if not Path(path).is_file()]
          if missing:
              raise SystemExit('declared code files are missing: ' + ', '.join(missing))

          roots = [Path('R'), Path('scripts'), Path('validation'),
                   Path('tests/testthat'), Path('tests/python'), Path('source_build')]
          discovered = set()
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix in {'.R', '.Rmd', '.py', '.sh'}:
                      discovered.add(path.as_posix())
          discovered.add('tests/testthat.R')
          discovered.add('Code_S1.py')
          declared = set(paths)
          undeclared = sorted(discovered - declared)
          stale = sorted(declared - discovered)
          if undeclared:
              raise SystemExit('undeclared executable files outside legacy: ' + ', '.join(undeclared))
          if stale:
              raise SystemExit('manifest paths outside checked code roots: ' + ', '.join(stale))
          print('code manifest ok:', len(rows), 'declared files')
          PY

      - name: Parse all declared R code
        shell: Rscript {0}
        run: |
          manifest <- read.csv(
            "config/code_manifest.csv", stringsAsFactors = FALSE,
            check.names = FALSE
          )
          files <- manifest$path[grepl("\\.(R|Rmd)$", manifest$path)]
          stopifnot(length(files) > 0L, all(file.exists(files)))
          for (file in files) {
            if (grepl("\\.Rmd$", file)) next
            parse(file, keep.source = FALSE)
          }
          cat("Parsed", length(files), "declared R files.\n")

      - name: Check declared shell drivers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/hb-shell-files
          import csv
          for row in csv.DictReader(open('config/code_manifest.csv')):
              if row['path'].endswith('.sh'):
                  print(row['path'])
          PY
          while IFS= read -r script; do bash -n "$script"; done < /tmp/hb-shell-files

      - name: Validate workflow YAML and stage registry
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import csv, pathlib, sys, yaml
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text())
              print('yaml ok:', path)
          rows = list(csv.DictReader(open('reproducibility/pipeline_stage_registry.csv')))
          if not rows: sys.exit('stage registry is empty')
          ids = [r['stage_id'] for r in rows]
          if len(ids) != len(set(ids)): sys.exit('duplicate stage_id')
          absent = []
          for row in rows:
              for col in ('generating_script','validation_script','audit_script'):
                  value = row[col].strip()
                  if value and not pathlib.Path(value).exists():
                      absent.append(f'{row["stage_id"]}:{value}')
          if absent: sys.exit('missing active scripts: ' + ', '.join(absent))
          declared = {r['path'] for r in csv.DictReader(open('config/code_manifest.csv'))}
          referenced = {
              row[col].strip() for row in rows
              for col in ('generating_script','validation_script','audit_script')
              if row[col].strip()
          }
          missing_from_manifest = sorted(referenced - declared)
          if missing_from_manifest:
              sys.exit('stage registry uses undeclared code: ' + ', '.join(missing_from_manifest))
          print('stage registry ok:', len(rows), 'stages')
          PY

      - name: Validate active snapshot descriptor and population expectations
        shell: Rscript {0}
        run: |
          if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite")
          descriptor <- jsonlite::fromJSON("inputs/canonical_snapshot.json", simplifyDataFrame = TRUE)
          stopifnot(
            nzchar(descriptor$release_tag), nzchar(descriptor$asset_name),
            nchar(descriptor$asset_sha256) == 64L,
            nrow(descriptor$contents) > 0L,
            all(nchar(descriptor$contents$sha256) == 64L)
          )
          expected <- read.csv("inputs/analysis_1909_expectations.csv", stringsAsFactors = FALSE)
          stopifnot(
            identical(expected$quantity, c("analysis_observations","white_observations","pigmented_observations")),
            identical(as.integer(expected$expectation), c(1909L,955L,954L))
          )

      - name: Confirm active code does not import legacy or source-build tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/hb-active-files
          import csv
          active = {'active','supplementary','support','validation','active_test'}
          for row in csv.DictReader(open('config/code_manifest.csv')):
              if row['status'] in active:
                  print(row['path'])
          PY
          if xargs grep -InE \
            '(source\(|sys\.source\(|read\.csv\(|readLines\(|file\.exists\(|list\.files\(|system2\(|Rscript |bash ).*(legacy/|source_build/)' \
            < /tmp/hb-active-files; then
            echo 'Active executable code imports legacy or source-build material.' >&2
            exit 1
          fi

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - run: python -m pytest

  environment-and-r-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs sudo apt-get install --yes --no-install-recommends
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-4.5.3-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            r-lib-${{ runner.os }}-4.5.3-
      - run: Rscript scripts/setup_r_environment.R --report-dir reproducibility --scopes analysis,reproducibility,testing,figures,reporting
      - run: Rscript scripts/preflight.R --scope canonical --report-dir reproducibility
      - shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)
