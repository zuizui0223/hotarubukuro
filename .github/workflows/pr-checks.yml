name: PR checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Parse active R code
        shell: Rscript {0}
        run: |
          files <- unlist(lapply(
            c("R", "scripts", "validation", "tests"),
            function(path) list.files(path, pattern = "\\.R$", recursive = TRUE, full.names = TRUE)
          ))
          stopifnot(length(files) > 0L)
          for (file in files) parse(file, keep.source = FALSE)
          cat("Parsed", length(files), "active R files. Legacy is intentionally excluded.\n")

      - name: Check active shell drivers
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done

      - name: Validate workflow YAML and stage registry
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import csv, pathlib, sys, yaml
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              yaml.safe_load(path.read_text())
              print('yaml ok:', path)
          rows = list(csv.DictReader(open('reproducibility/pipeline_stage_registry.csv')))
          if not rows: sys.exit('stage registry is empty')
          ids = [r['stage_id'] for r in rows]
          if len(ids) != len(set(ids)): sys.exit('duplicate stage_id')
          absent = []
          for row in rows:
              for col in ('generating_script','validation_script','audit_script'):
                  value = row[col].strip()
                  if value and not pathlib.Path(value).exists(): absent.append(f'{row["stage_id"]}:{value}')
          if absent: sys.exit('missing active scripts: ' + ', '.join(absent))
          print('stage registry ok:', len(rows), 'stages')
          PY

      - name: Validate active snapshot descriptor and population expectations
        shell: Rscript {0}
        run: |
          if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite")
          descriptor <- jsonlite::fromJSON("inputs/canonical_snapshot.json", simplifyDataFrame = TRUE)
          stopifnot(
            nzchar(descriptor$release_tag), nzchar(descriptor$asset_name),
            nchar(descriptor$asset_sha256) == 64L,
            nrow(descriptor$contents) > 0L,
            all(nchar(descriptor$contents$sha256) == 64L)
          )
          expected <- read.csv("inputs/analysis_1909_expectations.csv", stringsAsFactors = FALSE)
          stopifnot(
            identical(expected$quantity, c("analysis_observations","white_observations","pigmented_observations")),
            identical(as.integer(expected$expectation), c(1909L,955L,954L))
          )

      - name: Confirm active code does not import legacy
        shell: bash
        run: |
          set -euo pipefail
          # Mentions in explanatory error messages are allowed. Fail only when
          # active executable code attempts to read, source, list, or execute a
          # path below the archived 1,923 tree.
          if grep -RInE \
            --exclude-dir=legacy \
            --exclude='*.md' \
            --exclude='pr-checks.yml' \
            '(source\(|read\.csv\(|readLines\(|hb_read_csv\(|file\.exists\(|list\.files\(|system2\(|Rscript |bash ).*legacy/published-1923' \
            R scripts validation tests .github/workflows; then
            echo 'Active executable code imports legacy material.' >&2
            exit 1
          fi

  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - run: python -m pytest

  environment-and-r-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs sudo apt-get install --yes --no-install-recommends
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-4.5.3-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            r-lib-${{ runner.os }}-4.5.3-
      - run: Rscript scripts/setup_r_environment.R --report-dir reproducibility --scopes analysis,reproducibility,testing,figures,reporting
      - run: Rscript scripts/preflight.R --scope canonical --report-dir reproducibility
      - shell: Rscript {0}
        run: testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)
