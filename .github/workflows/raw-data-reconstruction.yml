name: Raw external-data reconstruction

# Workflow B. Rebuilds everything upstream of the canonical analysis-input
# snapshot from the pinned public sources, validates the result, and publishes
# the snapshot as an immutable GitHub Release asset for workflow A.
#
# It is manually dispatched because CHELSA, SoilGrids, WorldPop, MLIT, and GBIF
# are slow and occasionally unavailable. A public data server being down must
# not turn every pull request red.

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot identifier, used as the release tag and asset stem
        type: string
        required: false
        default: analysis-input-snapshot-v1
      publish:
        description: Publish the staged snapshot as a Release asset
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: raw-data-reconstruction-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_CACHE: ${{ github.workspace }}/reproduction_inputs/public_environment_cache
  MLIT_CACHE: ${{ github.workspace }}/reproduction_inputs/mlit_l03_2021
  GBIF_CACHE: ${{ github.workspace }}/results/bombus_occurrence_phenology_cache
  BOMBUS_DIR: ${{ github.workspace }}/results/enmeval_aicc_reselected/predictions
  STATUS_DIR: ${{ github.workspace }}/reproduction_status
  REPORT_DIR: ${{ github.workspace }}/reproducibility
  SNAPSHOT_STAGING: ${{ github.workspace }}/snapshot_staging
  SNAPSHOT_ID: ${{ inputs.snapshot_id || 'analysis-input-snapshot-v1' }}
  HISTORICAL_PUBLICATION_COMMIT: bcceb7c7c909adcb5f7b69721ee5c5921ae90f2e

jobs:
  reconstruct:
    name: Reconstruct and publish the analysis-input snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore the R library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}

      # Raw sources are cached only to avoid re-downloading tens of gigabytes
      # from public servers between attempts. Every cached file is re-hashed and
      # re-validated by the preparation step, and the recorded provenance names
      # the provider URL, not the cache.
      - name: Restore the raw source cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache/rasters
            reproduction_inputs/mlit_l03_2021
            results/bombus_occurrence_phenology_cache
          key: raw-sources-${{ hashFiles('config/raster_sources.csv', 'config/pipeline.yml', 'R/raster_sources.R') }}
          restore-keys: raw-sources-

      - name: Restore the declared R environment
        run: Rscript scripts/setup_r_environment.R --report-dir "$REPORT_DIR"

      - name: Reconstruct all upstream stages and stage the snapshot
        run: bash scripts/run_raw_reconstruction.sh

      - name: Publish the snapshot as an immutable Release asset
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="${SNAPSHOT_ID}.tar.gz"
          bash scripts/canonical_snapshot.sh publish \
            "$SNAPSHOT_STAGING" "$SNAPSHOT_ID" "$asset" | tee "${STATUS_DIR}/snapshot_publish.txt"
          sha="$(grep '^sha256=' "${STATUS_DIR}/snapshot_publish.txt" | cut -d= -f2)"
          [[ -n "$sha" ]] || { echo "No snapshot checksum was produced" >&2; exit 1; }
          jq --arg sha "$sha" '.asset_sha256 = $sha' inputs/canonical_snapshot.json \
            > inputs/canonical_snapshot.json.new
          mv inputs/canonical_snapshot.json.new inputs/canonical_snapshot.json
          cp inputs/canonical_snapshot.json "${STATUS_DIR}/canonical_snapshot.json"
          {
            echo "## Canonical analysis-input snapshot published"
            echo
            echo "- tag: \`${SNAPSHOT_ID}\`"
            echo "- asset: \`${asset}\`"
            echo "- asset sha256: \`${sha}\`"
            echo
            echo "Commit the descriptor below to \`inputs/canonical_snapshot.json\`"
            echo "before running the canonical analysis workflow."
            echo
            echo '```json'
            cat inputs/canonical_snapshot.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "=== inputs/canonical_snapshot.json ==="
          cat inputs/canonical_snapshot.json

      - name: Record run provenance
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$STATUS_DIR"
          {
            echo "workflow=raw-data-reconstruction"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "snapshot_id=${SNAPSHOT_ID}"
            echo "historical_publication_commit=${HISTORICAL_PUBLICATION_COMMIT}"
          } > "${STATUS_DIR}/run_provenance.txt"
          find data/processed results reproducibility snapshot_staging \
            -type f -printf '%p\t%s\n' 2>/dev/null | sort \
            > "${STATUS_DIR}/result_inventory.tsv"

      - name: Upload the staged snapshot, manifests, and all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-reconstruction-${{ github.sha }}-${{ github.run_id }}
          path: |
            reproducibility
            reproduction_status
            snapshot_staging
            data/processed/raster_download_manifest.csv
            data/processed/raster_manifest.csv
            results/ecological_v11_pigmentation_hurdle
            results/environment_v3
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
