name: 1965-source Bombus ecology sensitivities v2

on:
  push:
    branches: [agent/reanalysis-1965-new-bombus]
    paths: [.github/workflows/reanalysis-1965-bombus-ecology-sensitivity-v2.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reanalysis-1965-bombus-ecology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensitivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HOTARUBUKURO_R_SEED: "42"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      GOTO_NUM_THREADS: "1"
      BLIS_NUM_THREADS: "1"
      GDAL_NUM_THREADS: "1"
      OMP_DYNAMIC: "FALSE"
      FRESH_STAGE02_ARTIFACT_ID: "9021172765"
      FRESH_STAGE02_ARTIFACT_SHA256: "3b2e01a2edd6ccc1b3797ed4438dc4c0f1a4aaa9bee472658e7af6e116485bab"
      BOMBUS_ARTIFACT_ID: "9020226937"
      BOMBUS_ARTIFACT_SHA256: "d5d639e8e00d1ccc2f887c53fa8041465905b29f6bca1127f816e8c7a649d708"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs sudo apt-get install --yes --no-install-recommends

      - name: Restore R library cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: bombus-source-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt') }}
          restore-keys: |
            bombus-source-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore pinned analysis and acquisition R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility/reanalysis_1965_sensitivity
          --scopes analysis,acquisition,reproducibility

      - name: Restore frozen fresh flower stage 02 and frozen seeded Bombus source build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRESH_STAGE02_ARTIFACT_ID}/zip" > /tmp/fresh.zip
          echo "${FRESH_STAGE02_ARTIFACT_SHA256}  /tmp/fresh.zip" | sha256sum -c -
          rm -rf /tmp/fresh && mkdir -p /tmp/fresh && unzip -q /tmp/fresh.zip -d /tmp/fresh
          rm -rf results/ecological_v15_multiscale_hotspots results/ecological_v16_predictive_replication
          mkdir -p results
          cp -a /tmp/fresh/results/ecological_v15_multiscale_hotspots results/
          cp -a /tmp/fresh/results/ecological_v16_predictive_replication results/

          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOMBUS_ARTIFACT_ID}/zip" > /tmp/bombus.zip
          echo "${BOMBUS_ARTIFACT_SHA256}  /tmp/bombus.zip" | sha256sum -c -
          rm -rf /tmp/bombus && mkdir -p /tmp/bombus && unzip -q /tmp/bombus.zip -d /tmp/bombus
          awk -F, 'NR>1 && $2 != "PASS" {bad=1} END {exit bad}' /tmp/bombus/reproducibility/bombus_sdm_rebuild_comparison.csv

      - name: Run ecological-group and leave-one-species-out sensitivity grid
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/run_bombus_ecology_sensitivity.R \
            --artifact-root . \
            --sdm-dir /tmp/bombus/results/bombus_sdm_rebuild_A/predictions \
            --occurrence-dir /tmp/bombus/results/bombus_occurrence_snapshot \
            --output results/reanalysis_1965_bombus_ecology_sensitivity \
            --env-match 0.75 \
            --low-thresholds 0.10,0.20,0.25,0.33 \
            --available-threshold 0.50
          Rscript validation/validate_bombus_ecology_sensitivity.R \
            --output results/reanalysis_1965_bombus_ecology_sensitivity

      - name: Show sensitivity outputs
        shell: bash
        run: |
          set -euo pipefail
          find results/reanalysis_1965_bombus_ecology_sensitivity -maxdepth 1 -type f -printf '%f\n' | sort
          for f in results/reanalysis_1965_bombus_ecology_sensitivity/*summary*.csv results/reanalysis_1965_bombus_ecology_sensitivity/*primary*.csv; do
            [[ -f "$f" ]] || continue
            echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Record provenance
        shell: bash
        run: |
          mkdir -p reproducibility/reanalysis_1965
          printf '%s\n' \
            "analysis_population=fresh 1965-source sequential population; no target n" \
            "fresh_stage02_artifact_id=${FRESH_STAGE02_ARTIFACT_ID}" \
            "fresh_stage02_artifact_sha256=${FRESH_STAGE02_ARTIFACT_SHA256}" \
            "bombus_artifact_id=${BOMBUS_ARTIFACT_ID}" \
            "bombus_artifact_sha256=${BOMBUS_ARTIFACT_SHA256}" \
            "groups=all_five;widespread;montane_alpine;five_leave_one_out" \
            "normalizations=flower_cell_rank;occurrence_site_ecdf" \
            "gate_grid=0.10,0.20,0.25,0.33;available=0.50" \
            "pairing=25km;same-fold;env<=0.75;one-to-one" \
            "AUC_weighting=false" \
            "role=sensitivity_not_primary_replacement" \
            "commit=${GITHUB_SHA}" \
            > reproducibility/reanalysis_1965/bombus_ecology_sensitivity_provenance.txt

      - uses: actions/upload-artifact@v4
        with:
          name: reanalysis-1965-bombus-ecology-${{ github.sha }}-${{ github.run_id }}
          path: |
            reproducibility/reanalysis_1965
            results/reanalysis_1965_bombus_ecology_sensitivity
          if-no-files-found: error
          retention-days: 90
