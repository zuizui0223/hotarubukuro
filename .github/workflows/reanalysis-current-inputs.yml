name: Rebuild current broad and anomaly analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reanalysis-current-inputs.yml
      - scripts/run_reanalysis_current_inputs.sh
      - scripts/run_downstream_current_inputs.sh
      - scripts/report_reanalysis_current_inputs.R
      - R/**
      - source_build/**
      - config/**

permissions:
  contents: read
  actions: read

concurrency:
  group: current-input-reanalysis-${{ github.ref }}
  cancel-in-progress: true

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  HOTARUBUKURO_R_SEED: "20260725"
  HOTARUBUKURO_SUBMISSION_DRAWS: "10000"
  HOTARUBUKURO_JOINT_LATENT_DRAWS: "10000"
  HOTARUBUKURO_JOINT_OBS_REPS: "20"
  BOMBUS_ARTIFACT_ID: "9020226937"
  BOMBUS_ARTIFACT_SHA256: "d5d639e8e00d1ccc2f887c53fa8041465905b29f6bca1127f816e8c7a649d708"
  UPSTREAM_COMMIT: "1d7c575f1191e4e035db01a617f52b75eeaca313"

jobs:
  reanalyse:
    name: Fresh 1,965-row broad/anomaly reconstruction
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout current paper code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout exact frozen upstream implementation
        uses: actions/checkout@v5
        with:
          ref: ${{ env.UPSTREAM_COMMIT }}
          path: upstream
          fetch-depth: 1

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            current-paper-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore public raster cache
        uses: actions/cache@v4
        with:
          path: data/cache/rasters
          key: current-paper-rasters-${{ hashFiles('config/raster_sources.csv', 'config/pipeline.yml', 'R/raster_sources.R') }}
          restore-keys: |
            raw-sources-
            current-paper-rasters-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,acquisition,testing,figures,reporting

      - name: Restore checksum-locked fresh Bombus source build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-artifact /tmp/bombus-source.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${BOMBUS_ARTIFACT_ID}/zip" \
            -o /tmp/bombus-source.zip
          actual="$(sha256sum /tmp/bombus-source.zip | awk '{print $1}')"
          [[ "$actual" == "$BOMBUS_ARTIFACT_SHA256" ]]
          mkdir -p source-artifact
          unzip -q /tmp/bombus-source.zip -d source-artifact
          for species in ardens diversus beaticola consobrinus honshuensis; do
            test -s "source-artifact/results/bombus_sdm_rebuild_A/predictions/${species}.tif"
          done

      - name: Rebuild fresh broad-analysis boundary
        shell: bash
        run: bash scripts/run_reanalysis_current_inputs.sh "$GITHUB_WORKSPACE/upstream" "$GITHUB_WORKSPACE/source-artifact"

      - name: Clear downstream outputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf \
            results/ecological_v16_* \
            results/ecological_v17_* \
            results/ecological_v18_* \
            results/ecological_v19_* \
            results/ecological_v2[0-9]_* \
            results/final_analysis_pipeline
          mkdir -p reanalysis_status

      - name: Run current anomaly and human-context downstream stages
        shell: bash
        run: bash scripts/run_downstream_current_inputs.sh

      - name: Record workflow provenance
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reanalysis_status
          {
            echo "workflow=reanalysis-current-inputs"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "upstream_implementation_commit=${UPSTREAM_COMMIT}"
            echo "bombus_artifact_id=${BOMBUS_ARTIFACT_ID}"
            echo "bombus_artifact_sha256=${BOMBUS_ARTIFACT_SHA256}"
            echo "source_rows=1965"
            echo "manuscript_scope=broad_natural_template;event_departure;human_context"
            echo "bombus_main_scope=separate_local_transition_pipeline"
          } > reanalysis_status/workflow_provenance.txt
          find reanalysis_inputs reanalysis_status results \
            -type f -printf '%p\t%s\n' 2>/dev/null | sort \
            > reanalysis_status/result_inventory.tsv

      - name: Upload complete current-input outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-input-reanalysis-${{ github.sha }}-${{ github.run_id }}
          path: |
            reanalysis_inputs
            reanalysis_status
            reproducibility
            data/processed/raster_download_manifest.csv
            data/processed/raster_manifest.csv
            results
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
