name: Recover the established analysis inputs

# Workflow C. One-shot recovery.
#
# The published phenotype and 1-km cell stages were never committed and no
# longer exist on the author's machine. GitHub is still holding provenance that
# predates their loss: the canonical-analysis artifact from run 30727117525, and
# the two published analysis-input snapshots. This workflow retrieves them,
# verifies them, enumerates what is still missing, and commits whatever is
# genuinely recoverable to inputs/established_analysis_inputs/.
#
# It is gated. If the retrieved phenotype table does not match the published
# counts, nothing is committed and the run fails with the evidence. A directory
# that claims to hold the published inputs when it does not would be worse than
# no directory at all.

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Workflow run holding the canonical-analysis artifact
        type: string
        required: false
        default: "30727117525"
      commit:
        description: Commit the recovered inputs to the pull-request branch
        type: string
        required: false
        default: "true"
  pull_request:
    types: [labeled]
    branches: ["main"]

permissions:
  contents: write
  actions: read

concurrency:
  group: recover-established-inputs-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || '30727117525' }}
  # Recorded SHA-256 of the established 1923-row phenotype table, as carried by
  # the analysis-input-snapshot-v1 descriptor at commit e8030ad8.
  ESTABLISHED_PHENOTYPE_SHA256: 3916ac6b32c03e84f0de57eb8c2f4d2222c41ea0cb5f99e83662df1f8cad069f
  RECOVERY_ROOT: ${{ github.workspace }}/recovery

jobs:
  recover:
    name: Retrieve, verify, and enumerate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'run-recover-established-inputs'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The artifact lives in another workflow run, so it needs an explicit
      # run-id and a token with actions: read.
      - name: Download the canonical-analysis artifact
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: ${{ env.RECOVERY_ROOT }}/artifact
          merge-multiple: true

      - name: Restore analysis-input-snapshot-v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RECOVERY_ROOT}"
          # The v1 descriptor is not the one on this branch; it is reconstructed
          # here from the values recorded in the release itself so the restore
          # still verifies the asset checksum before unpacking.
          cat > "${RECOVERY_ROOT}/snapshot_v1.json" <<'JSON'
          {
            "snapshot_id": "analysis-input-snapshot-v1",
            "release_tag": "analysis-input-snapshot-v1",
            "asset_name": "analysis-input-snapshot-v1.tar.gz",
            "asset_sha256": "984aae08624f171ed207f568de5b9ef330994e1615649ad1adac5aecb0271f1a"
          }
          JSON
          bash scripts/canonical_snapshot.sh restore \
            "${RECOVERY_ROOT}/snapshot_v1.json" "${RECOVERY_ROOT}/snapshot_v1"

      # Searched so the report can say where each missing file is and is not,
      # including the places it must not be taken from.
      - name: Restore analysis-input-snapshot-v2 for the search only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/canonical_snapshot.sh restore \
            inputs/canonical_snapshot.json "${RECOVERY_ROOT}/snapshot_v2"

      - name: Inventory everything retrieved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reproducibility
          find "${RECOVERY_ROOT}" -type f -printf '%p\t%s\n' | sort \
            > reproducibility/recovery_source_inventory.tsv
          wc -l reproducibility/recovery_source_inventory.tsv
          echo "--- phenotype and cell tables found ---"
          find "${RECOVERY_ROOT}" -type f \
            \( -name 'analysis_data_pigmentation_hurdle.csv' \
            -o -name 'multiscale_hotspot_cells_1km.csv' \) \
            -printf '%p\t%s\n' | sort

      - name: Recover, verify, and enumerate
        id: recover
        shell: bash
        run: |
          # The exit status is the verdict, not a crash: a non-zero status means
          # the established inputs were not recovered, and that outcome has to be
          # reported and uploaded before the job fails on it.
          set +e
          python3 scripts/recover_established_inputs.py \
            --artifact-dir "${RECOVERY_ROOT}/artifact" \
            --snapshot-v1 "${RECOVERY_ROOT}/snapshot_v1" \
            --snapshot-v2 "${RECOVERY_ROOT}/snapshot_v2" \
            --repo-results results \
            --expectations inputs/established_input_expectations.csv \
            --expected-phenotype-sha256 "${ESTABLISHED_PHENOTYPE_SHA256}" \
            --out inputs/established_analysis_inputs \
            --report-dir reproducibility
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish the recovery report
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "## Established-input recovery"
            echo
            if [[ -s reproducibility/established_input_recovery.md ]]; then
              cat reproducibility/established_input_recovery.md
            else
              echo "No recovery report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the recovered inputs
        if: ${{ steps.recover.outputs.status == '0' && (inputs.commit || 'true') == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inputs/established_analysis_inputs
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Recover the established analysis inputs from GitHub provenance

          Retrieved from the analysis-input-snapshot-v1 Release asset and the
          canonical-analysis artifact of run ${ARTIFACT_RUN_ID}, verified by
          checksum and by internal consistency against
          inputs/established_input_expectations.csv. RECOVERY.md records where
          each file came from and which files could not be recovered."
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"${{ github.event.pull_request.head.ref || github.ref_name }}"; then
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "Push failed after four attempts." >&2
          exit 1

      - name: Upload the recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: established-input-recovery-${{ github.run_id }}
          path: |
            reproducibility
            inputs/established_analysis_inputs
          if-no-files-found: warn
          retention-days: 90

      - name: Fail when the established inputs were not recovered
        if: ${{ steps.recover.outputs.status != '0' }}
        shell: bash
        run: |
          echo "Recovery did not produce the established analysis inputs." >&2
          echo "The report in the step summary states which candidates were" >&2
          echo "retrieved and how they differ from the published analysis." >&2
          echo "Nothing was committed. Do not relabel a reconstruction as the" >&2
          echo "established input." >&2
          exit 1
