name: Refine anthocyanin wording

on:
  push:
    branches:
      - agent/strengthen-environmental-hypotheses
    paths:
      - .github/workflows/refine-anthocyanin-wording.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/strengthen-environmental-hypotheses
          fetch-depth: 0

      - name: Apply the literature-accurate wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('submission/jbi/JBI_main_manuscript_anonymized.md')
          text = path.read_text(encoding='utf-8')
          old = ('Lower temperature increased petal anthocyanin and pathway-gene expression in gerbera, '
                 'whereas prolonged heat suppressed anthocyanin genes and pink flower colour in chrysanthemum')
          new = ('Lower temperature enhanced petal anthocyanin in gerbera, where coloration differences were '
                 'associated with pathway-gene expression, whereas prolonged heat suppressed anthocyanin genes '
                 'and pink flower colour in chrysanthemum')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one target phrase, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python submission/jbi/validate_jbi_submission.py

      - name: Commit and remove the one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-anthocyanin-wording.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine the anthocyanin temperature wording"
          git push origin HEAD:agent/strengthen-environmental-hypotheses
