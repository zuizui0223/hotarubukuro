name: Repository checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  declared-source-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
      - name: Parse declared R sources only
        shell: Rscript {0}
        run: |
          manifest <- read.csv(
            "config/code_manifest.csv", stringsAsFactors = FALSE,
            check.names = FALSE
          )
          files <- manifest$path[grepl("\\.R$", manifest$path)]
          stopifnot(length(files) > 0L, all(file.exists(files)))
          for (file in files) parse(file, keep.source = FALSE)
          cat("Checked", length(files), "declared R files; legacy excluded.\n")

  python-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - run: python -m pytest
