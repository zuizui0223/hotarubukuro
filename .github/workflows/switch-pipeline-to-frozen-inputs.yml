name: Switch pipeline to repository-frozen inputs

on:
  push:
    branches: [agent/unify-jbi-reproducible-pipeline]
    paths:
      - .github/workflows/switch-pipeline-to-frozen-inputs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/unify-jbi-reproducible-pipeline

      - name: Replace retention-bound restore stages with Git-frozen materializers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          lock_path = Path('config/paper_pipeline.lock.json')
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          replacements = {
              'restore_broad': {
                  'kind': 'command',
                  'command': ['{python}', 'scripts/materialize_frozen_input.py', 'broad'],
                  'outputs': lock['artifacts']['broad']['required'],
              },
              'restore_bombus_sdm': {
                  'kind': 'command',
                  'command': ['{python}', 'scripts/materialize_frozen_input.py', 'bombus_sdm'],
                  'outputs': lock['artifacts']['bombus_sdm']['required'],
              },
              'restore_final8_draws': {
                  'kind': 'command',
                  'command': ['{python}', 'scripts/materialize_frozen_input.py', 'final8_draws'],
                  'outputs': lock['artifacts']['final8_draws']['required'],
              },
          }
          lock['stages'].update(replacements)
          lock['provenance_boundary']['exact_reproduction_starts_from'] = 'repository-frozen checksum-locked accepted Broad evidence, seeded Bombus SDMs, and final-eight-axis posterior draws'
          lock['provenance_boundary']['interpretation'] = 'The reproduce profile regenerates the accepted Broad spatial-null sensitivity, local Bombus and human-context analyses, figures, and JBI review bundle from permanent Git-frozen inputs. Historical Actions artifact IDs and checksums remain provenance references only.'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          guide = Path('docs/reproduction-guide.md')
          text = guide.read_text(encoding='utf-8')
          text = text.replace(
              'Exact reproduction starts from three checksum-locked inputs:',
              'Exact reproduction starts from three checksum-locked inputs permanently frozen under `reproducibility/frozen_inputs/`:'
          )
          text = text.replace(
              'Local artifact restoration requires `GITHUB_TOKEN` or `GH_TOKEN` with Actions-artifact read access. The canonical workflow supplies its own token.',
              'Local exact reproduction does not require a GitHub token: the three required archives are versioned in the repository. Historical Actions artifact IDs/checksums remain provenance references only.'
          )
          text = re.sub(
              r'## Remaining durability gate\n\n.*?\Z',
              '## Durability status\n\nThe exact-reproduction binary inputs are permanently versioned in `reproducibility/frozen_inputs/` with SHA-256 locks. GitHub Actions artifacts are no longer required for execution. A future DOI mirror is optional rather than a reproduction prerequisite.\n',
              text,
              flags=re.S,
          )
          guide.write_text(text, encoding='utf-8')

          md = Path('reproducibility/FROZEN_RELEASE_2026-08-18.md')
          if md.exists() and '## Permanent binary inputs' not in md.read_text(encoding='utf-8'):
              md.write_text(md.read_text(encoding='utf-8') + '\n## Permanent binary inputs\n\nThe exact-reproduction archives are versioned under `reproducibility/frozen_inputs/`, with SHA-256 identities in `SHA256SUMS`. Historical Actions artifacts are provenance references only.\n', encoding='utf-8')

          fj = Path('reproducibility/frozen_release_2026-08-18.json')
          if fj.exists():
              data = json.loads(fj.read_text(encoding='utf-8'))
              data['permanent_binary_inputs'] = {
                  'broad': {'path': 'reproducibility/frozen_inputs/broad-minimal.zip', 'sha256': 'f9c54ff940a6eb4cf5ced7ae5049bd95fe15bc700bb72c364c95162d8755820a'},
                  'bombus_sdm': {'path': 'reproducibility/frozen_inputs/bombus-sdm-minimal.zip', 'sha256': '9c3993e3b42307ed3780f3b235740b6dc9a33f3962e07b6137a61217a4cabf52'},
                  'final8_draws': {'path': 'reproducibility/frozen_inputs/final8-draws-minimal.zip', 'sha256': '4c4456bc5fdca96db3cc7279f75eb146d1e8f828b2c8cc6e00bd7c9f9db8226e'},
              }
              data['actions_artifacts_required_for_execution'] = False
              fj.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 scripts/materialize_frozen_input.py broad
          python3 scripts/materialize_frozen_input.py bombus_sdm
          python3 scripts/materialize_frozen_input.py final8_draws
          python3 run_pipeline.py reproduce --dry-run

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/paper_pipeline.lock.json docs/reproduction-guide.md reproducibility
          git commit -m "Make Git-frozen inputs canonical for exact reproduction"
          git push origin HEAD:agent/unify-jbi-reproducible-pipeline
