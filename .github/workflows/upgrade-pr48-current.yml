name: Upgrade PR 48 to current paper

on:
  push:
    branches:
      - agent/unify-jbi-reproducible-pipeline
    paths:
      - 'scripts/pr48_migrate_*.py'
      - '.github/workflows/upgrade-pr48-current.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python -m pip install -e '.[submission,test]'

      - name: Apply migration
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts/pr48
          cp scripts/pr48_migrate_*.py scripts/pr48/
          python scripts/pr48/pr48_migrate_01_lock.py
          python scripts/pr48/pr48_migrate_02_docs.py
          python scripts/pr48/pr48_migrate_03_validator_map.py
          python scripts/pr48/pr48_migrate_04_workflows_tests.py
          rm -f scripts/pr48_migrate_*.py scripts/pr48/*.py
          rmdir scripts/pr48

      - name: Validate generated contracts
        run: |
          python -m json.tool config/paper_pipeline.lock.json >/dev/null
          python -m pytest tests/python/test_run_pipeline.py
          python run_pipeline.py audit --only-stage validate_alignment --no-resume
          python submission/jbi/validate_jbi_submission.py

      - name: Commit upgraded branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Integrate current JBI manuscript and Broad spatial-null sensitivity'
          git push origin "HEAD:${GITHUB_REF_NAME}"
