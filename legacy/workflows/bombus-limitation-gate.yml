name: Bombus limitation gate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bombus-sdm-inference-guardrails
    paths:
      - .github/workflows/bombus-limitation-gate.yml
      - scripts/run_bombus_limitation_gate.R
      - scripts/internal/build_bombus_limitation_figure.R
      - R/final_registry.R
      - R/pipeline_support.R
      - validation/validate_bombus_limitation_gate.R
      - validation/audit_bombus_limitation_gate.R
      - validation/validate_publication_pipeline.R
      - validation/audit_publication_claims.R
      - config/code_manifest.csv

permissions:
  contents: read
  actions: read

jobs:
  limitation-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Download frozen 1,909 submission artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p canonical-artifact
          gh run download 31149006557 \
            --repo zuizui0223/hotarubukuro \
            --name analysis-1909-2084bceaef9c4dee71a3399c9d0c5aa917abe067-31149006557 \
            --dir canonical-artifact
          mkdir -p results
          cp -a canonical-artifact/results/. results/

      - name: Run active Bombus limitation gate
        run: |
          Rscript scripts/run_bombus_limitation_gate.R \
            --artifact-root . \
            --output results/ecological_v17_bombus_limitation_gate \
            --env-match 0.75 \
            --low-thresholds 0.10,0.20,0.25,0.33 \
            --primary-low-threshold 0.33 \
            --available-threshold 0.50

      - name: Validate and audit active stage 03
        run: |
          Rscript validation/validate_bombus_limitation_gate.R
          Rscript validation/audit_bombus_limitation_gate.R

      - name: Rebuild final result and claim registries
        run: |
          Rscript -e 'source("R/pipeline_support.R"); hb_load_modules("final_registry"); final_write_lock(".", "results/final_analysis_pipeline")'
          Rscript validation/validate_publication_pipeline.R \
            --output=results/final_analysis_pipeline \
            --baseline=reconstruction
          Rscript validation/audit_publication_claims.R \
            --output=results/final_analysis_pipeline \
            --baseline=reconstruction

      - name: Install lightweight Figure 3 packages
        run: Rscript -e 'install.packages(c("ggplot2", "patchwork"), repos="https://cloud.r-project.org")'

      - name: Build active Figure 3
        run: Rscript scripts/internal/build_bombus_limitation_figure.R

      - name: Show active inference
        run: |
          cat results/ecological_v17_bombus_limitation_gate/bombus_limitation_gate_summary.csv
          echo
          cat results/final_analysis_pipeline/final_claim_registry.csv

      - uses: actions/upload-artifact@v4
        with:
          name: bombus-limitation-integration-${{ github.sha }}
          path: |
            results/ecological_v17_bombus_limitation_gate
            results/final_analysis_pipeline
            manuscript/figures/figure_3_bombus_limitation.png
            manuscript/figures/figure_3_bombus_limitation.pdf
          if-no-files-found: error
          retention-days: 30
