name: Fresh-SDM Bombus relaxation local analysis

on:
  workflow_dispatch:
  push:
    branches:
      - agent/bombus-relaxation-analysis
    paths:
      - .github/workflows/bombus-relaxation-local-current-inputs.yml
      - scripts/run_bombus_relaxation_local_contrast.R
      - reproducibility/bombus_relaxation_analysis_spec_2026-08-08.md

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  FRESH_REANALYSIS_ARTIFACT_ID: "9022276431"
  FRESH_REANALYSIS_ARTIFACT_SHA256: "0135939a9c66d087ea2fc8e2e00a6e4802927a63b400c2011d63e5b86e004240"

jobs:
  bombus-relaxation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: bombus-relaxation-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            reanalysis-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing

      - name: Download checksum-locked fresh reanalysis artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/fresh-reanalysis.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRESH_REANALYSIS_ARTIFACT_ID}/zip" \
            -o /tmp/fresh-reanalysis.zip
          actual="$(sha256sum /tmp/fresh-reanalysis.zip | awk '{print $1}')"
          echo "Fresh reanalysis artifact sha256=${actual}"
          [[ "$actual" == "$FRESH_REANALYSIS_ARTIFACT_SHA256" ]] || {
            echo "Fresh-reanalysis artifact digest mismatch" >&2
            exit 1
          }
          unzip -q -o /tmp/fresh-reanalysis.zip -d "$GITHUB_WORKSPACE"
          test -s results/ecological_v15_multiscale_hotspots/multiscale_hotspot_cells_1km.csv
          test -s results/ecological_v16_predictive_replication/checkpoints/national_environment_spde_presence_draws1000.rds
          test -s results/ecological_v16_predictive_replication/checkpoints/national_environment_spde_intensity_draws1000.rds

      - name: Verify locked analysis specification predates this run
        shell: bash
        run: |
          set -euo pipefail
          test -s reproducibility/bombus_relaxation_analysis_spec_2026-08-08.md
          git log -1 --format='%H %cI %s' -- reproducibility/bombus_relaxation_analysis_spec_2026-08-08.md

      - name: Run locked local Bombus relaxation analysis
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/run_bombus_relaxation_local_contrast.R \
            --env-match=0.75 \
            --radii=10,25,50 \
            --primary-radius=25 \
            --k=5 \
            --output=results/ecological_v17_bombus_relaxation_local

      - name: Validate primary result identity and no threshold retuning
        shell: bash
        run: |
          set -euo pipefail
          Rscript - <<'RS'
          d <- read.csv("results/ecological_v17_bombus_relaxation_local/bombus_relaxation_directional_summary.csv", check.names = FALSE)
          c <- read.csv("results/ecological_v17_bombus_relaxation_local/bombus_relaxation_community_turnover_summary.csv", check.names = FALSE)
          i <- read.csv("results/ecological_v17_bombus_relaxation_local/bombus_relaxation_interpretation.csv", check.names = FALSE)
          p <- d[d$is_primary_test %in% TRUE, , drop = FALSE]
          q <- c[c$is_required_corroboration %in% TRUE, , drop = FALSE]
          stopifnot(nrow(p) == 1L, nrow(q) == 1L)
          stopifnot(p$radius_km == 25, p$response == "presence", p$exposure == "all5_total_support")
          stopifnot(q$radius_km == 25, q$response == "presence", q$predictor == "fingerprint_turnover")
          stopifnot(all(d$environmental_caliper == 0.75))
          stopifnot(all(c$environmental_caliper == 0.75))
          stopifnot(any(i$field == "old_max_gate_role"))
          print(p)
          print(q)
          print(i)
          RS

      - name: Record run provenance
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p results/ecological_v17_bombus_relaxation_local
          {
            echo "workflow=bombus-relaxation-local-current-inputs"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "source_artifact_id=${FRESH_REANALYSIS_ARTIFACT_ID}"
            echo "source_artifact_sha256=${FRESH_REANALYSIS_ARTIFACT_SHA256}"
            echo "primary_radius_km=25"
            echo "environmental_caliper=0.75"
            echo "threshold_retuning=false"
          } > results/ecological_v17_bombus_relaxation_local/run_provenance.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bombus-relaxation-local-${{ github.sha }}-${{ github.run_id }}
          path: |
            reproducibility/bombus_relaxation_analysis_spec_2026-08-08.md
            results/ecological_v17_bombus_relaxation_local
          if-no-files-found: warn
          retention-days: 90
