name: Resume fresh-input reanalysis from v16

on:
  workflow_dispatch:
  push:
    branches:
      - agent/reanalyse-from-1965-new-bombus
    paths:
      - .github/workflows/resume-reanalysis-current-inputs.yml
      - scripts/run_bombus_limitation_gate_current_inputs.R
      - scripts/resume_reanalysis_from_fresh_v16.sh
      - scripts/report_reanalysis_current_inputs.R

permissions:
  contents: read
  actions: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  GOTO_NUM_THREADS: "1"
  BLIS_NUM_THREADS: "1"
  INLA_NUM_THREADS: "1"
  OMP_DYNAMIC: "FALSE"
  HOTARUBUKURO_R_SEED: "20260725"
  HOTARUBUKURO_SUBMISSION_DRAWS: "10000"
  HOTARUBUKURO_JOINT_LATENT_DRAWS: "10000"
  HOTARUBUKURO_JOINT_OBS_REPS: "20"
  FRESH_V16_ARTIFACT_ID: "9022017169"
  FRESH_V16_ARTIFACT_SHA256: "1167ad8abc635b69964cc4af20b8a7de1b7db9675085ecade625ca725ad3fe3a"

jobs:
  resume:
    name: Resume unchanged stages 03-05
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pinned R version
        id: rversion
        shell: bash
        run: echo "version=$(tr -d '[:space:]' < dependencies/r-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.rversion.outputs.version }}
          use-public-rspm: true

      - name: Install declared system libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          grep -vE '^\s*(#|$)' dependencies/apt-packages.txt | xargs \
            sudo apt-get install --yes --no-install-recommends

      - name: Restore R package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: reanalysis-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-${{ hashFiles('dependencies/r-packages.csv', 'dependencies/cran-snapshot.txt', 'dependencies/inla.csv') }}
          restore-keys: |
            reanalysis-r-${{ runner.os }}-${{ steps.rversion.outputs.version }}-
            r-lib-${{ runner.os }}-${{ steps.rversion.outputs.version }}-

      - name: Restore declared R environment
        run: >-
          Rscript scripts/setup_r_environment.R
          --report-dir reproducibility
          --scopes analysis,reproducibility,testing,figures,reporting

      - name: Download completed fresh v16 artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/fresh-v16.zip
          curl --fail --location --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${FRESH_V16_ARTIFACT_ID}/zip" \
            -o /tmp/fresh-v16.zip
          actual="$(sha256sum /tmp/fresh-v16.zip | awk '{print $1}')"
          echo "Fresh-v16 artifact sha256=${actual}"
          [[ "$actual" == "$FRESH_V16_ARTIFACT_SHA256" ]] || {
            echo "Fresh-v16 artifact digest mismatch" >&2
            exit 1
          }
          unzip -q -o /tmp/fresh-v16.zip -d "$GITHUB_WORKSPACE"
          test -s results/ecological_v16_predictive_replication/checkpoints/national_environment_spde_presence_draws1000.rds
          test -s results/ecological_v16_predictive_replication/checkpoints/national_environment_spde_intensity_draws1000.rds
          test -s results/ecological_v25_submission_presence/checkpoints/national_environment_spde_presence_draws10000.rds

      - name: Resume current-input analysis
        shell: bash
        run: bash scripts/resume_reanalysis_from_fresh_v16.sh

      - name: Record resume provenance
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p reanalysis_status
          {
            echo "workflow=resume-reanalysis-current-inputs"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "fresh_v16_artifact_id=${FRESH_V16_ARTIFACT_ID}"
            echo "fresh_v16_artifact_sha256=${FRESH_V16_ARTIFACT_SHA256}"
            echo "fixed_bombus_gate_thresholds=0.10,0.20,0.25,0.33"
            echo "threshold_retuning=false"
          } > reanalysis_status/resume_workflow_provenance.txt
          find reanalysis_inputs reanalysis_status results \
            -type f -printf '%p\t%s\n' 2>/dev/null | sort \
            > reanalysis_status/resume_result_inventory.tsv

      - name: Upload resumed reanalysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumed-current-input-reanalysis-${{ github.sha }}-${{ github.run_id }}
          path: |
            reanalysis_inputs
            reanalysis_status
            reproducibility
            results
          if-no-files-found: warn
          compression-level: 6
          retention-days: 90
