[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotarubukuro-analysis"
version = "2.9.0"
description = "Zero-from-Zenodo reconstruction and retained analyses for Campanula punctata floral colour"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
hotarubukuro-color = "source_build.extract_color:main"
hotarubukuro-from-zenodo = "source_build.reproduce_from_zenodo:main"
hotarubukuro-reproduce = "run_pipeline:main"

[tool.setuptools]
py-modules = ["run_pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = ["source_build*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
