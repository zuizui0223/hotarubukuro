[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotarubukuro-analysis"
version = "2.8.0"
description = "Analysis and source-reconstruction utilities for quantitative floral-colour and spatial-ecology workflows"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
hotarubukuro-color = "hotarubukuro_analysis.cli:color_main"
hotarubukuro-from-zenodo = "source_build.reproduce_from_zenodo:main"
hotarubukuro-reproduce = "run_pipeline:main"

[tool.setuptools]
py-modules = ["Code_S1", "run_pipeline"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hotarubukuro_analysis*", "source_build*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
